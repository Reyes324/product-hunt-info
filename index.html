<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年8月1日</span>
        <span class="updated">更新于 10:00</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-02","updatedAt":"10:00","yesterday":[{"rank":1,"name":"NudgeForMe","zhName":"NudgeForMe","url":"https://www.producthunt.com/products/nudgeforme","desc":"AI follow-up agent for missed email opportunities","zhDesc":"AI follow-up agent for missed email opportunities","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/136f1435-260c-4135-9c5f-54ac923d5f78.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"NudgeForMe scans your sent conversations, finds threads where someone never replied, and drafts natural follow-ups inside your own mailbox. It starts in draft mode, so you stay in control. You can review each opportunity, select the useful ones, and send from Gmail, Outlook, or IMAP/SMTP. Built by the Snoooz team after processing millions of emails, NudgeForMe is focused on one painful workflow: making sure leads, deals, partnerships, and customer conversations do not quietly go cold.","zhDetail":"NudgeForMe 面向销售、商务及客户成功人士，自动扫描你已发送的邮件，找出对方未回复的对话，并在你的邮箱内直接生成自然的跟进草稿。它默认以草稿模式呈现，让你完全掌控——可逐条审阅、挑选有用的跟进内容，并通过 Gmail、Outlook 或 IMAP/SMTP 一键发送，确保潜在客户、交易、合作及客户沟通不再悄然冷却。"},{"rank":2,"name":"DeepSeek-V4-Flash-0731","zhName":"DeepSeek-V4-Flash-0731","url":"https://www.producthunt.com/products/deepseek","desc":"Frontier agent intelligence at Flash prices","zhDesc":"Frontier agent intelligence at Flash prices","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/9d823c04-85e6-4010-a80e-52c793e0e20b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"DeepSeek-V4-Flash-0731 is the official release of V4-Flash, featuring a massive leap in agentic capabilities. It outperforms V4-Pro (Preview) on key benchmarks, natively supports the Responses API, and is fully adapted for Codex CLI.","zhDetail":"DeepSeek-V4-Flash-0731 是面向开发者和 AI 代理场景的官方模型版本，在关键基准测试上超越 V4-Pro（预览版），显著提升智能体任务执行能力。它原生支持 Responses API，并已全面适配 Codex CLI，帮助用户更高效地构建和部署自动化工作流。"},{"rank":3,"name":"Port22","zhName":"Port22","url":"https://www.producthunt.com/products/port22","desc":"Claude Code, Codex & more on your phone","zhDesc":"Claude Code, Codex & more on your phone","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/db044d18-ce80-43d6-89c7-ac039f7e196d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Reading the options off the live session instead of guessing a keystroke is the part that makes this usable. What I'd still get wrong on a phone is approving the right button for the wrong reason, because I can see \"edit src/auth.ts\" but not what's actually in the diff. If the approval card carries enough of the change to judge it, I'll clear a queue of these from a coffee shop. If it doesn't, I walk back to the Mac anyway and the buzz just moved the interruption earlier.","zhDetail":"Port22 是一款面向开发者的远程代码审批工具，解决在手机上无法准确判断代码变更内容的问题。它通过实时读取终端会话中的具体差异信息，让审批卡片携带足够的上下文，使开发者无需回到电脑前就能安全、高效地处理代码审查队列。"},{"rank":4,"name":"AgentMicro","zhName":"AgentMicro","url":"https://www.producthunt.com/products/agentmicro","desc":"Live Codex task status in your macOS menu bar","zhDesc":"Live Codex task status in your macOS menu bar","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/dc4ce086-ba4f-4900-8de6-7a15b24b2496.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"In base mode with no Accessibility permission, orange for input needed has to be inferred from session metadata, and a long tool call looks identical to a prompt sitting unanswered. If that's a timeout threshold I'd want the number documented, because a 90 second web fetch showing up as needing me is the false positive that gets the whole menu bar ignored by Thursday. Five states only pay off if orange is never wrong.","zhDetail":"AgentMicro 是一款面向 AI 代理开发者的状态监控工具，帮助你在不授予无障碍权限的情况下，准确区分“等待用户输入”与“工具执行中”的界面状态。它通过解析会话元数据推断输入需求，并明确记录超时阈值，避免因误报橙色提示导致用户忽略整个菜单栏。该工具以五态模型为核心，确保状态指示精准可靠，减少开发与调试中的认知负担。"},{"rank":5,"name":"Yamanote 3D","zhName":"Yamanote 3D","url":"https://www.producthunt.com/products/yamanote-3d","desc":"Ride Tokyo’s Yamanote Line in a 3D world","zhDesc":"Ride Tokyo’s Yamanote Line in a 3D world","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/3a7d9b16-8c64-45ca-bdeb-e6108ab70ddd.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Hi Product Hunt! I started Yamanote 3D because I wanted the sounds and atmosphere of a train journey in the background while studying or working. Instead of using a looped video, I wanted something I could actually explore, so I began recreating Tokyo’s Yamanote Line as a live 3D experience in the browser. You can walk through an E235 carriage, take a seat, watch the city, listen to announcements, and get off at stations. There are no missions or scores. It is meant to be a calm place you can leave running. The project is still evolving, and I would really appreciate honest feedback about the atmosphere, realism, performance, and anything that feels missing.","zhDetail":"Yamanote 3D 是一款专为学习或工作人群打造的沉浸式浏览器3D体验，让你在虚拟世界中漫步东京山手线列车，感受沿途城市风景与车站广播的宁静氛围。它没有任务或得分，旨在提供一个可随时开启、随时离开的放松空间，帮助你在专注时获得身临其境的背景环境。"},{"rank":6,"name":"TerminalWidget","zhName":"TerminalWidget","url":"https://www.producthunt.com/products/terminalwidget","desc":"Put script output in your Desktop/Home screen widgets.","zhDesc":"Put script output in your Desktop/Home screen widgets.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e7fd4aac-35df-48c0-a8e9-fc12775a16b1.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"TerminalWidget 是一款面向开发者和技术爱好者的桌面小组件工具，让你无需打开终端即可在桌面或主屏幕直接查看脚本输出。它通过将任意命令行脚本的结果实时渲染为小组件，解决了频繁切换窗口查看运行状态或监控数据的麻烦，让关键信息一目了然。"},{"rank":7,"name":"Terminal Candy","zhName":"Terminal Candy","url":"https://www.producthunt.com/products/terminal-candy","desc":"A native macOS terminal you can skin and theme","zhDesc":"A native macOS terminal you can skin and theme","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2328bc32-b057-4279-8163-34374aca092d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Terminal Candy is a real, native macOS terminal you live inside. Pick a skin — Game Boy, cassette deck, Pip-Boy, or your own art — and draw the terminal square right on it. It pings you (sound + dock bounce) when Claude Code or Codex actually needs input, so you stop babysitting the window. The Skin Builder turns any image into a terminal; 84 palettes, CRT effects, ⌥Space hotkey, community skin marketplace. 14-day free trial, then $10 once — no subscription. macOS 14+, Apple Silicon.","zhDetail":"Terminal Candy 是一款真正的原生 macOS 终端，让你直接“住”在里面。你可以为它换上 Game Boy、卡带机、Pip-Boy 或自定义皮肤，并自由绘制终端窗口；当 Claude Code 或 Codex 真正需要输入时，它会通过声音和 Dock 弹跳提醒你，免去一直盯屏的麻烦。内置皮肤构建器可将任意图片变为终端，支持 84 种配色、CRT 特效、⌥Space 快捷键及社区皮肤市场，14 天免费试用后一次性买断 $10，无订阅，适用于 macOS 14+ 和 Apple Silicon。"},{"rank":8,"name":"Basedash Audit Logs","zhName":"Basedash Audit Logs","url":"https://www.producthunt.com/products/basedash","desc":"Every action in your BI tool, on the record.","zhDesc":"Every action in your BI tool, on the record.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/71904071-f19e-4fc9-b2e1-38d6d3f7c648.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Native audit logs for Basedash — every sign-in, query, and configuration change is on the record, including every query the AI runs, attributed and traceable. Answer who saw what, when with one filter, stream events to your SIEM, set retention to match your policy, and pull the log through the API. Built for security reviews and enterprise rollouts, alongside SSO, SCIM, and RBAC. Your BI tool finally has a memory. Every action, on the record.","zhDetail":"Basedash Audit Logs 为使用 Basedash 的团队提供原生审计日志，记录每一次登录、查询和配置变更，包括 AI 执行的每条查询，均可追溯归属。通过一个筛选器即可回答“谁在何时看到了什么”，并支持将事件流式传输至 SIEM、按策略设置保留期限及通过 API 拉取日志。专为安全审查和企业部署打造，与 SSO、SCIM 和 RBAC 协同工作，让您的 BI 工具终于拥有完整记忆。"},{"rank":9,"name":"SyncStaq","zhName":"SyncStaq","url":"https://www.producthunt.com/products/syncstaq","desc":"Stripe billing data, always current in Google Sheets","zhDesc":"Stripe billing data, always current in Google Sheets","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2db48d82-0c0f-4b5e-965b-ee874dda5bac.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"The thing that breaks every Stripe to Sheets sync is not freshness, it is history changing underneath you. A charge from March gets disputed in August. Does the March row mutate in place, or do you append a correction? Mutating is what people expect, and it quietly rewrites a number someone already reported to a board. Appending is honest, and it breaks every SUMIF they built on the range. There is no clean answer, which is exactly why I would want to know which one you picked and where that is documented, before I point a deck at it. Raffay's IAP point is the same shape. A third of the revenue picture is worse than none unless the sheet is labelled Stripe only right on the tab.","zhDetail":"SyncStaq 专为依赖 Stripe 与 Sheets 同步的财务或运营团队设计，解决因历史数据变更（如退款、争议）导致报表被静默改写或公式失效的难题。它通过明确记录每次数据是“原地更新”还是“追加修正”，并清晰标注数据范围与来源，让团队在汇报或分析前能追溯每一处变动，避免基于错误或模糊数据做出决策。"},{"rank":10,"name":"EssayKraft","zhName":"EssayKraft","url":"https://www.producthunt.com/products/essaykraft","desc":"Native essay writing app for Mac and iPad","zhDesc":"Native essay writing app for Mac and iPad","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/65f41280-3e78-48d1-a20e-b561ede089f9.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"I'm a student studying creative writing at Uni and as much as I love writing, managing references and citations in essays has always been a task that I dread having to approach. I previously used Word with a plugin, which was difficult to set up, and clunky to use; I spent more time managing references than actually writing the essay itself. Over two years, I have taught myself Swift and this is my first app. I made EssayKraft with one goal in mind: to let writers write, and leave reference management to the app. I'd love to hear your feedback, whether it's about the app itself, the design, or features you'd like to see next. Thanks for checking it out!","zhDetail":"EssayKraft 是一款专为大学生和论文写作者设计的引用管理应用，旨在解决写作过程中参考文献整理繁琐、工具操作笨拙的痛点。它通过简洁的界面和自动化流程，让用户专注于写作本身，而将引用格式、文献管理等杂务交给应用处理，从而大幅提升论文写作效率。"},{"rank":11,"name":"Kopai","zhName":"Kopai","url":"https://www.producthunt.com/products/kopai-the-marketplace-for-ai-agents","desc":"Share your expertise, and let our agents earn for you.","zhDesc":"Share your expertise, and let our agents earn for you.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b8e24549-ef15-49b1-84bb-869b8dddd49e.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Kopai 让专家将自身知识转化为可自动创收的智能代理，无需持续手动投入。它面向拥有专业技能或经验、希望实现被动收入的个人与团队，通过配置代理来分享知识并代为执行任务，从而在节省时间的同时持续获得收益。"},{"rank":12,"name":"Tandem","zhName":"Tandem","url":"https://www.producthunt.com/products/tandem-11","desc":"AI-native office leasing brokerage","zhDesc":"AI-native office leasing brokerage","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/594aa697-588f-4402-a639-38a06d9247c5.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Tandem 是一款面向企业租户的 AI 原生办公租赁经纪平台，帮助企业在复杂的写字楼市场中快速找到合适的办公空间。它通过智能匹配、数据分析和自动化谈判流程，替代传统人工经纪的繁琐环节，节省时间并降低租赁成本。"}],"today":[{"rank":1,"name":"Zinley","zhName":"Zinley","url":"https://www.producthunt.com/products/zinley","desc":"Your Personal AI Representative for calls, email, and tasks","zhDesc":"Your Personal AI Representative for calls, email, and tasks","tags":[],"upvotes":null,"icon":null,"detail":"Most AI waits inside a chat. Zinley is reachable by you and the people around you. With its own phone number and email, it answers calls, handles email, books things, and gets work done within your rules. It remembers your people and relationships, then reports back in your language. Not another chatbot. A second you that shows up.","zhDetail":"Zinley 是一款拥有独立电话号码和邮箱的 AI 助手，能替你接听电话、处理邮件、预订事务并执行任务，同时严格遵守你设定的规则。它还能记住你的人际关系，用你的语言向你汇报进展，让你和身边的人都随时能找到它——不是又一个聊天机器人，而是你的“数字分身”。"},{"rank":2,"name":"Zen Whisper","zhName":"Zen Whisper","url":"https://www.producthunt.com/products/zen-whisper","desc":"On-device Mac dictation that types into any app","zhDesc":"On-device Mac dictation that types into any app","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/30730b1c-fffe-40bb-b2fc-4091bf12b05a.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Hold a shortcut and dictate into any Mac app without sending audio to the cloud. Zen Whisper keeps core speech recognition on-device, with local models, searchable transcripts, voice memos, media transcription, and Pro tools for larger models and translation.","zhDetail":"Zen Whisper 是一款面向 Mac 用户的本地语音转文字工具，让你在任何应用中按住快捷键即可口述输入，无需将音频上传到云端。它通过内置本地模型实现核心语音识别，支持可搜索的转录文本、语音备忘录和媒体转写，并提供 Pro 工具以使用更大模型和翻译功能，兼顾隐私与效率。"},{"rank":3,"name":"Termexo","zhName":"Termexo","url":"https://www.producthunt.com/products/termexo","desc":"A local Windows workbench for Claude Code and Codex","zhDesc":"A local Windows workbench for Claude Code and Codex","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/bbc9e293-260e-462e-a440-646567cbc697.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Alerting when an agent needs attention is the right primitive. The one nobody builds is the opposite alert, for the agent that's quietly burning your tokens on a loop going nowhere. The profiles already hold the API key, so you could put spend per session next to each PTY tab, and that number changes behaviour faster than any layout feature will. Running two agents at once and having no idea which one ate the budget is the part that actually costs me.","zhDetail":"Termexo 面向同时运行多个 AI 代理的开发者和团队，解决代理在后台空转消耗令牌却无人察觉的问题。它通过在终端标签页旁实时显示每次会话的花费，并针对“低效循环”发出反向警报，让你一眼看出哪个代理在烧钱，从而及时干预、控制成本。"},{"rank":4,"name":"Bolcho AI","zhName":"Bolcho AI","url":"https://www.producthunt.com/products/bolcho-ai","desc":"Build Voice AI agents that actually speak India","zhDesc":"Build Voice AI agents that actually speak India","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/66e08304-53ad-4b84-9f22-977ef0b67b42.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Bolcho AI is an AI voice platform that helps businesses build, deploy and scale multilingual AI phone and web agents. Unlike generic Voice AI platforms, Bolcho is built for India—with native language support, ultra-low latency, telephony integrations, and the flexibility to bring your own LLMs, STT, and TTS providers. From sales and support to appointment booking and customer engagement, launch production-ready voice agents in minutes.","zhDetail":"Bolcho AI 是一款面向企业的 AI 语音平台，帮助快速搭建和部署支持多语言的电话及网页语音代理。它专为印度市场优化，支持本地语言、超低延迟和电话系统集成，并允许企业自带 LLM、语音识别和语音合成服务，从销售、客服到预约和客户互动，几分钟内即可上线可用的语音代理。"},{"rank":5,"name":"Capptivo","zhName":"Capptivo","url":"https://www.producthunt.com/products/capptivo","desc":"Free open-source screen recorder & demo editor","zhDesc":"Free open-source screen recorder & demo editor","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/f6d382dd-f39d-47b9-92c1-de14b5a52036.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Capptivo is a free, open-source screen recorder and demo editor for macOS, Windows, and Linux. Record locally, add follow-cursor zooms, polish the look, burn on-device captions, and export, no account, no subscription. Give your demos the spotlight they deserve.","zhDetail":"Capptivo 是一款免费开源的跨平台屏幕录制与演示视频编辑器，适用于 macOS、Windows 和 Linux。它让产品演示、教程创作者无需注册或订阅，即可在本地录制屏幕、添加跟随光标的缩放效果、美化画面并生成设备端字幕，最终导出高质量视频，让演示内容更专业、更吸睛。"},{"rank":6,"name":"FreqWave EQ","zhName":"FreqWave EQ","url":"https://www.producthunt.com/products/freqwave-eq-browser-audio-equalizer","desc":"Custom let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
