<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年7月29日</span>
        <span class="updated">更新于 10:28</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-07-30","updatedAt":"10:28","yesterday":[{"rank":1,"name":"Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2e85ae4d-5d7d-4547-9839-4c8fb5e5e29a.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向开发团队和产品经理的代码审查辅助工具，能够在 AI 生成的变更上线前自动识别其中的潜在决策问题。它通过对比每次代码改动与产品规格、任务单及现有上下文，清晰解释 AI 代理的决策内容、可能带来的后果以及回退难度，帮助团队快速审批、修正或替换决策，并将这些上下文无缝带入后续工作中。"},{"rank":3,"name":"Denovo","zhName":"Denovo","url":"https://www.producthunt.com/products/denovo-business-manager","desc":"Turn your vibe-coded app into paying customers","zhDesc":"Turn your vibe-coded app into paying customers","tags":[],"upvotes":null,"icon":null,"detail":"Congrats on the launch Saverio. The honest bit about previous startups failing on go-to-market makes this more interesting than the usual “build anything with AI” pitch. Denovo is taking on a lot though. Idea validation, branding, websites, payments, ads, lead generation, reporting. I’d want to know where the system is genuinely making decisions and where it is mainly automating setup. The green, yellow, red verdict also caught my attention. Has Denovo ever told a founder not to build something, and what evidence does it use to make that call? That could be one of the most valuable parts if it is willing to be blunt.","zhDetail":"Denovo 是一款面向创业者的全流程产品启动助手，帮助解决从创意验证、品牌建设、网站搭建到支付、广告、线索生成和报告分析的繁琐问题。它通过自动化设置与智能决策支持，让创始人能更专注于核心业务，甚至敢于给出“不建议启动”的直白判断，避免盲目投入。"},{"rank":5,"name":"ClinicFrame","zhName":"ClinicFrame","url":"https://www.producthunt.com/products/clinic-scribe-clinicframe","desc":"Like Granola, but for healthcare. Fully HIPAA-compliant.","zhDesc":"Like Granola, but for healthcare. Fully HIPAA-compliant.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/633bd8a1-8e3c-449f-acec-88372c665558.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"An ambient AI scribe that writes clinical notes in real time so you can focus on your patient. It passively captures every visit, whether in person or virtual, and delivers a complete, structured clinical note the moment the encounter ends. HIPAA compliant, desktop native, and EHR ready in seconds. We're launching Scribe today, with a much bigger vision ahead: a medical intelligence platform that goes beyond documentation to support the entire clinical workflow.","zhDetail":"ClinicFrame 是一款面向临床医生的环境式AI记录助手，能在诊疗过程中实时生成病历，让医生专注于患者本身。它通过被动捕捉面对面或远程问诊的完整内容，在就诊结束后即刻输出结构化的临床记录，并支持HIPAA合规、桌面原生运行，数秒内即可对接电子病历系统。"},{"rank":7,"name":"Totem","zhName":"Totem","url":"https://www.producthunt.com/products/totem-5","desc":"Your Twitter bookmarks organized to make you read them","zhDesc":"Your Twitter bookmarks organized to make you read them","tags":[],"upvotes":null,"icon":null,"detail":"I save threads for community management work - launch announcements, ecosystem updates, AMA threads - and they get buried the same way you describe. The Obsidian/Markdown export is the part that would actually change my workflow: I keep running notes on each project and community I track, and a clean thread export I can drop directly into those notes without manual cleanup would save real time during launch season. Does the export include quoted tweets and embedded thread context, or mostly just the main tweet text?","zhDetail":"Totem 是一款面向社区管理者的工具，帮助用户高效保存和整理 Twitter 线程，避免重要内容（如发布公告、生态更新、AMA 线程）被淹没。它通过将线程导出为 Obsidian/Markdown 格式，让用户能直接将干净的内容嵌入到项目笔记中，省去手动清理的麻烦，在发布季大幅节省时间。"},{"rank":8,"name":"Bo AI","zhName":"Bo AI","url":"https://www.producthunt.com/products/bo-ai","desc":"An AI personal assistant that lives in your texts 💬","zhDesc":"An AI personal assistant that lives in your texts 💬","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/bf7e6ff3-68de-462c-855f-ad6028363761.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Bo is the first consumer AI product that exists to serve everyday people. Bo helps you stay organized, save time, live healthier, and answer your questions—all via text.","zhDetail":"Bo AI 是首款面向普通大众的消费级AI产品，旨在通过短信对话帮助用户保持生活条理、节省时间、养成健康习惯并解答各类问题。无需下载复杂应用，只需发消息即可获得智能助手服务。"},{"rank":9,"name":"Task Monki","zhName":"Task Monki","url":"https://www.producthunt.com/products/task-monki","desc":"Run coding agents through the full development process","zhDesc":"Run coding agents through the full development process","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/9b608328-f855-4b13-b9ef-1a02821fc16f.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"the \"bring multiple agents into the same discussion so they can challenge assumptions\" part is what catches my eye. when two agents actually disagree in there - one says the approach is fine, the other flags a problem with it - what breaks the tie? does it surface as an open disagreement for me to resolve, or does one agent's take win by default (most confident, last word, whichever finished first)? that seems like the moment the whole point of having them argue either pays off or quietly gets lost","zhDetail":"Task Monki 是一款面向需要多角度决策支持的用户的任务管理工具，它通过让多个 AI 代理在同一讨论中互相质疑和挑战假设，帮助用户发现潜在问题。当代理之间出现分歧时，系统会将争议点清晰呈现给用户，由用户最终裁决，从而避免单一视角的盲区，提升决策质量。"},{"rank":11,"name":"Epilude","zhName":"Epilude","url":"https://www.producthunt.com/products/epilude","desc":"Local voice dictation for Mac for polished text","zhDesc":"Local voice dictation for Mac for polished text","tags":[],"upvotes":null,"icon":null,"detail":"\"trim the rambling\" is the phrase that catches me, since that's not just punctuation cleanup, that's deciding what you didn't mean to say. for casual notes that's exactly what I'd want, but if I'm dictating something with a number, a caveat, or a qualifier in the middle of a rambly sentence, trimming risks cutting the part that mattered along with the filler. is there a way to see what got trimmed before it lands in the app, or does it commit straight to the final text with no diff to check against","zhDetail":"Epilude 是一款面向日常笔记和语音输入用户的智能润色工具，它能自动识别并删除口语中的冗余内容，帮你把啰嗦的句子精简成清晰文本。不过，对于包含数字、限定条件等关键信息的复杂句子，用户可能担心误删重要内容，因此产品需要提供修剪前后的对比查看功能，让用户确认后再提交最终文本。"},{"rank":14,"name":"BlackFlare","zhName":"BlackFlare","url":"https://www.producthunt.com/products/blackflare","desc":"Mission control for Claude Code & Codex in your menu bar","zhDesc":"Mission control for Claude Code & Codex in your menu bar","tags":[],"upvotes":null,"icon":null,"detail":"The problem this solves is real — I have lost track of how many times I gave Claude Code a task, wandered off, and came back to find it had finished twenty minutes ago and was just sitting there. The notification routing to Telegram is the part I would actually use most. The thing I want to know upfront is how it distinguishes a session that is truly finished from one that is paused mid-task waiting on input — whether that is coming from parsing terminal output or from the agent explicitly reporting a terminal state, since those two behave very differently when something goes sideways halfway through.","zhDetail":"BlackFlare 专为频繁使用 Claude Code 等 AI 编程助手的开发者设计，解决任务完成后无人通知、白白等待的问题。它通过解析终端输出或智能体主动报告的状态，精准区分任务真正完成与中途暂停等待输入的情况，并将完成通知实时路由到 Telegram，让你无需守在终端前也能及时获知结果。"},{"rank":15,"name":"JusTTY","zhName":"JusTTY","url":"https://www.producthunt.com/products/justty","desc":"A simple native macOS terminal built on Swift and libghostty","zhDesc":"A simple native macOS terminal built on Swift and libghostty","tags":[],"upvotes":null,"icon":null,"detail":"Native macOS apps built with libghostty are exactly what I've been hoping someone would ship. One thing that would make me switch from iTerm2 full time: support for per-pane scrollback buffers with the ability to detach a pane into its own window. Would be great for keeping long-running logs handy while working in another session.","zhDetail":"JusTTY 是一款为 macOS 用户打造的终端应用，基于 libghostty 原生构建，旨在解决 iTerm2 等传统终端中缺乏独立面板滚动缓冲与窗口分离功能的问题。它允许用户将每个面板的滚动历史独立保存，并可将任意面板拖出成为独立窗口，方便在多个工作会话中随时查看长时间运行的日志。"}],"today":[{"rank":1,"name":"Virre","zhName":"Virre","url":"https://www.producthunt.com/products/virre","desc":"A private relationship system for your career and network.","zhDesc":"A private relationship system for your career and network.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/01b7c7e7-cbef-48f4-a45c-4f62652dc5ba.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Virre is a private relationship intelligence system that helps you turn existing connections into meaningful opportunities. It brings your network, conversations, goals, events, and follow-ups into one place, then recommends who matters, why they matter, and what to do next—without turning relationships into transactions.","zhDetail":"Virre 是一款面向职场人士与社交达人的私密关系智能系统，帮助你将现有社交联系转化为有意义的机遇。它把联系人、对话、目标、活动与跟进记录整合到一处，并主动推荐谁值得关注、为何重要以及下一步该做什么——同时避免让关系变得功利化。"},{"rank":2,"name":"Greplica","zhName":"Greplica","url":"https://www.producthunt.com/products/greplica","desc":"Self updating wiki for coding agents","zhDesc":"Self updating wiki for coding agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/44d46fbd-4d23-4bd3-a32c-860082414991.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Greplica gives your engineering team and every coding agent a shared memory of the codebase. It continuously extracts decisions, constraints, gotchas, failed approaches, and file-level context from coding sessions, then retrieves only what matters for the task at hand. Unlike static docs or siloed agent memory, Greplica stays grounded in the repo, keeps knowledge fresh, and works across developers, agents, clones, and forks. It is open source, runs locally, and offers a managed shared mode.","zhDetail":"Greplica 为工程团队和所有编码智能体提供代码库的共享记忆。它能持续从编码会话中提取决策、约束、陷阱、失败方案及文件级上下文，并仅检索当前任务所需的关键信息。与静态文档或孤立的智能体记忆不同，Greplica 始终基于代码仓库，保持知识实时更新，并支持跨开发者、智能体、克隆和分支协同工作。"},{"rank":3,"name":"docktor","zhName":"Docktor","url":"https://www.producthunt.com/products/docktor","desc":"Your Dock's wasted side space, now full of widgets","zhDesc":"Your Dock's wasted side space, now full of widgets","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/25db771e-8a78-410f-8bb5-877b4d9841dc.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"If you don't hide your Dock, you've probably got wasted space sitting on either side of it. Docktor fills it with widgets you actually glance at: music, calendar, weather, system stats and more coming soon. No extra menu-bar icon fighting for room. No separate window to open. Just the stuff you check constantly, parked in space your Mac was already wasting. It also adds hover previews to your Dock — mouse over an app and see its open windows without clicking.","zhDetail":"Docktor 是一款专为 Mac 用户设计的桌面工具，能有效利用 Dock 两侧的闲置空间。它可以在 Dock 旁直接显示音乐、日历、天气、系统状态等常用信息，无需额外菜单栏图标或独立窗口。此外，它还支持 Dock 应用悬停预览功能，鼠标悬停即可查看应用的打开窗口，提升操作效率。"},{"rank":4,"name":"Pally","zhName":"Pally","url":"https://www.producthunt.com/products/pally","desc":"Your personal assistant that lives in your texts","zhDesc":"Your personal assistant that lives in your texts","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/3275caf8-9843-49ba-a9d9-06cf0243b5d2.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Pally is your personal assistant that lives in your texts. Stop leaving people on read: let Pally reply for you, do your work, and save you time. We’re the only text agent that natively connects to your iMessage and WhatsApp inboxes, meaning Pally can monitor, alert, and even reply to your friends for you - in your tone, with your context.","zhDetail":"Pally 是一款内置于短信中的个人助手，专为经常忘记回复消息的用户设计。它能直接接入你的 iMessage 和 WhatsApp 收件箱，替你监控、提醒并以你的语气和上下文自动回复朋友，帮你节省时间、不再“已读不回”。"},{"rank":5,"name":"Caimera","zhName":"Caimera","url":"https://www.producthunt.com/products/caimera-2","desc":"AI Visual Production Platform for Fashion Teams","zhDesc":"AI Visual Production Platform for Fashion Teams","tags":[],"upvotes":null,"icon":null,"detail":"What I'd genuinely love feedback on: **where the workflow breaks apart.** Bring us your hardest bulk workflow, you want to generate 100 sketches, then create tech packs and lifestyle images for all the styles to launch, but the workflow is shaking — tell us where we fall short. That's the only benchmark that matters to us.","zhDetail":"Caimera 是一款面向服装设计师和品牌团队的工作流自动化工具，旨在解决从批量草图生成到技术包与生活方式图制作过程中流程断裂的问题。它通过整合设计、制图与视觉呈现环节，帮助用户在高强度、多款式并行开发时保持工作流的连贯与高效。"},{"rank":6,"name":"NINA","zhName":"NINA","url":"https://www.producthunt.com/products/agenq-nina-ai-product-assistant","desc":"Guide users step by step inside your product.","zhDesc":"Guide users step by step inside your product.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/8f171449-e35d-4ef7-98c1-0387d7c1be54.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"NINA lives inside your product and helps users exactly where they get stuck. They ask “How do I…?” by voice or text, and NINA guides them step by step on the live interface before they open a ticket, search documentation, or message support. It is not a scripted tour, chatbot, or FAQ. NINA is built for B2B SaaS teams still relying on onboarding calls, product videos, Slack channels, and repeated support answers.","zhDetail":"NINA 是一款内嵌于 B2B SaaS 产品中的智能引导助手，专为那些仍依赖人工引导、产品视频或反复回答用户问题的团队设计。当用户通过语音或文字询问“我该怎么做？”时，NINA 会在真实界面上逐步引导他们完成操作，从而避免用户提交工单、搜索文档或联系客服。它不同于预设的教程、聊天机器人或常见问题列表，能直接在用户卡住的地方提供即时帮助。"},{"rank":7,"name":"Focus Room","zhName":"Focus Room","url":"https://www.producthunt.com/products/focus-room","desc":"Turn YouTube into your personal learning platform","zhDesc":"Turn YouTube into your personal learning platform","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/ec237044-32b2-4554-b3a0-4a527def2b03.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Focus Room turns YouTube into a personal learning platform with a structured, course-inspired interface. Convert educational videos and playlists into organized courses, navigate lessons using timestamped topics, generate concise summaries, create notes and to-do lists, track your progress, and bookmark courses for later. With unnecessary recommendations and distractions removed, Focus Room helps transform passive watching into focused, consistent learning.","zhDetail":"Focus Room 是一款专为学习者设计的工具，能将 YouTube 上的教育视频和播放列表转化为结构化的课程。它通过时间戳导航、自动生成摘要、笔记与待办清单、进度追踪等功能，帮助用户屏蔽无关推荐和干扰，把被动观看转变为专注、持续的学习体验。"},{"rank":8,"name":"Viktor.com","zhName":"Viktor.com","url":"https://www.producthunt.com/products/viktor","desc":"An AI coworker that actually does the work","zhDesc":"An AI coworker that actually does the work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/37038cc7-70ae-4d9f-b264-b20497bae49b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Viktor has become a core part of how we run operations at UniTru, giving us leverage that would normally require engineering resources. It allows us to manage workflows across Slack and Google Sheets seamlessly, handling things like scheduling, status tracking, and coordination in real time. What stands out most is how quickly we can build, test, and refine workflows without slowing down, which is critical for a fast moving team. At a high level, Viktor does not just save time, it enables us to operate at a level of speed, organization, and scale that would not be possible otherwise.","zhDetail":"Viktor.com 是一款面向快节奏团队的工作流管理工具，帮助非技术人员在 Slack 和 Google Sheets 上无缝处理排程、状态追踪和实时协作。它让用户无需工程资源即可快速构建、测试和优化工作流程，从而提升团队的组织效率与规模化运营能力。"},{"rank":9,"name":"agentOS","zhName":"agentOS","url":"https://www.producthunt.com/products/agentos-3","desc":"254× cheaper sandbox alternative, powered by WebAssembly","zhDesc":"254× cheaper sandbox alternative, powered by WebAssembly","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/463b8019-f504-428e-94c1-e8c3b29c52fe.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"254x is doing a lot of work in that tagline and the number isn't anywhere in your comment, so say against what. Firecracker per agent-hour at list price is a different claim to a per-request one. Some of that saving is also the isolation boundary you removed, since in-process WASM means a bug in the host bridge lands inside my backend instead of in a VM I was already paying to throw away. I'd lead with 4.8ms and 22MB, those are checkable.","zhDetail":"agentOS 是一款面向 AI 代理开发者的操作系统级工具，旨在解决代理运行成本高、启动延迟大和资源占用多的问题。它通过进程内 WASM 隔离技术，将每个代理的启动时间压缩至 4.8 毫秒、内存占用降至 22MB，并以每代理小时计费的模式大幅降低部署成本。"},{"rank":10,"name":"Sorinai","zhName":"Sorinai","url":"https://www.producthunt.com/products/sorinai","desc":"The Interative AI Notepad for Meetings","zhDesc":"The Interative AI Notepad for Meetings","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/dc6153d5-d9ef-4af1-86a6-00ac7dcd6b26.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Sorinai is an interactive AI notepad that fills out your meeting notes along with you. Drop in the template you already use, Word, PDF or plain text, and it reads the structure and fills every field from the call. No bot joins your meeting; it captures your computer's audio, so video calls, phone calls and in-person all work. Ask it what to say next while you're still on the call, then qu let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
