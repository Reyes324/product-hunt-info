<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年8月8日</span>
        <span class="updated">更新于 08:48</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-09","updatedAt":"08:48","yesterday":[],"today":[{"rank":1,"name":"Workflo","zhName":"Workflo","url":"https://www.producthunt.com/products/workflo-2","desc":"Mac workspace automation that never sees your screen","zhDesc":"Mac workspace automation that never sees your screen","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/3dfccc2f-0ce6-49a3-8fec-6d209839316d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Every tool I tried made that minute faster, **but they all wait to be asked.** Workflo removes the asking. It learns your layout for each display setup **(Desks)**, stages the right windows before calendar events or at set times **(Scenes)**, and snaps everything back when displays change. One hotkey clears the screen for a share and restores it after **(Stash).**","zhDetail":"Workflo 是一款面向多显示器办公人群的桌面效率工具，解决频繁手动排列窗口、切换场景的繁琐问题。它能学习你每个显示布局的习惯，在日历事件前或设定时间自动排好窗口（Scenes），并在显示器变化时恢复布局；一键热键即可暂存并清空屏幕用于分享，之后一键还原（Stash），让工作流不再等待指令。"},{"rank":2,"name":"DuckDisk","zhName":"DuckDisk","url":"https://www.producthunt.com/products/duckdisk","desc":"Table-first storage analysis for Mac, cloud, and SSH","zhDesc":"Table-first storage analysis for Mac, cloud, and SSH","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/6baf5366-6047-4a54-bbf4-9c6028db30b4.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"DuckDisk is a free, open-source macOS storage analyzer built for people who want answers, not just colorful maps. Its WizTree-style, table-first tree keeps size, allocated space, parent %, item counts, and file-type totals visible while you drill down. Scan local disks, OneDrive, Google Drive, and SSH in one app. Cloud scans use metadata only—file contents are not downloaded. The release is Apple-notarized and available on the Mac App Store.","zhDetail":"DuckDisk 是一款免费开源的 macOS 存储分析工具，专为那些想要明确答案而非花哨图表的用户设计。它采用类似 WizTree 的表格优先树状视图，在逐层深入时始终显示大小、占用空间、父级占比、项目数量及文件类型汇总。支持本地磁盘、OneDrive、Google Drive 和 SSH 扫描，且云端扫描仅读取元数据，不下载文件内容，兼顾效率与隐私。"},{"rank":3,"name":"Soup CLI","zhName":"Soup CLI","url":"https://www.producthunt.com/products/soup-cli","desc":"Fine-tune an 8B LLM on a 4 GB laptop GPU","zhDesc":"Fine-tune an 8B LLM on a 4 GB laptop GPU","tags":[],"upvotes":null,"icon":null,"detail":"LoRA keeps the base model frozen: read, never written. So Soup keeps it in system RAM and streams it into the GPU one decoder layer at a time. Peak VRAM becomes one layer instead of the whole model. Measured on an RTX 3050 Laptop 4 GB: Llama-3.1-8B trains at 119.6 tok/s in 3.32 GB peak. One YAML, one command. SFT, DPO, GRPO, KTO, plus eval, gating and export. Apache-2.0. Every number is published, including the ones I measured and threw away.","zhDetail":"Soup CLI 是一款面向 AI 开发者的命令行工具，专为在低显存 GPU 上高效训练大语言模型而设计。它通过将 LoRA 适配器保存在系统内存中，并逐层将解码器层流式传输到 GPU，从而将峰值显存占用从整个模型降至单层，让普通笔记本也能训练 Llama-3.1-8B 等模型。只需一个 YAML 文件即可完成 SFT、DPO、GRPO、KTO 等训练及评估、门控和导出，且所有性能数据公开透明。"},{"rank":4,"name":"Omniwork","zhName":"Omniwork","url":"https://www.producthunt.com/products/omniwork-2","desc":"The Creative Agent OS — create better with desktop AI agents","zhDesc":"The Creative Agent OS — create better with desktop AI agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/ca9f8039-1afd-45fb-8410-e43e4f63d929.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"We watched creators lose hours every day switching between chat windows, asset folders, editing tools, and social media backends — losing momentum and creative flow with every context switch. The AI tools were getting smarter, but the workflow kept getting more fragmented. We asked ourselves: what if a team of creative agents could just live on your desktop, learn your style, and handle the work end-to-end?","zhDetail":"Omniwork 是一款面向创作者和内容团队的桌面端 AI 工作流助手，解决因频繁切换聊天窗口、素材文件夹、编辑工具和社交媒体后台而导致的效率流失与创意中断问题。它通过一组常驻桌面的智能代理，学习你的个人风格，并端到端自动处理从素材整理、内容编辑到多平台发布的完整流程，让创作节奏不再被打断。"},{"rank":5,"name":"Macrobite","zhName":"Macrobite","url":"https://www.producthunt.com/products/macrobite","desc":"The fastest way to actually get your macros right","zhDesc":"The fastest way to actually get your macros right","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a4a42fea-9aa3-44e8-b7dc-17ae8598a41a.webp?auto=compress&codec=mozjpeg&cs=strip&dpr=2&fit=max&fm=webp&frame=1&h=48&w=48","detail":"Macrobite is the fastest way to get your macros right. Snap a photo of your meal and get an instant breakdown of calories, protein, carbs, and fat. Not perfect on the first try? Quick editing closes the gap in seconds, no scrolling through massive food databases. Prefer to talk? Log meals by voice, including through Siri. Track your day from your iPhone widget or Apple Watch without opening the app. Built for people who want accurate macros without the friction of traditional tracking apps.","zhDetail":"Macrobite 是一款专为追求精准营养摄入却厌倦繁琐记录的用户打造的饮食追踪工具。只需拍一张餐食照片，即可瞬间获得热量、蛋白质、碳水与脂肪的分解数据；若初次识别不够准确，几秒内即可快速手动修正，无需翻找庞大食物数据库。它还支持语音记录（包括通过 Siri）、iPhone 小组件和 Apple Watch 查看每日进度，让宏量营养追踪变得轻松无负担。"},{"rank":6,"name":"radiusHQ","zhName":"radiusHQ","url":"https://www.producthunt.com/products/radiushq","desc":"One link replaces your scheduling chaos","zhDesc":"One link replaces your scheduling chaos","tags":[],"upvotes":null,"icon":null,"detail":"Your services, prices, calendar, payments, and reminders — all in one beautiful page. Clients book in 30 seconds. You set it up in 10 minutes.","zhDetail":"radiusHQ 是一款面向自由职业者和小型服务商的在线预约与支付管理工具，将服务项目、报价、日历、收款和提醒功能整合在一个美观的页面中。客户只需30秒即可完成预约，而商家只需10分钟即可完成设置，大幅简化了从接单到收款的全流程。"},{"rank":7,"name":"SoloUno","zhName":"SoloUno","url":"https://www.producthunt.com/products/solouno","desc":"Take control of hair pulling, nail biting & skin picking","zhDesc":"Take control of hair pulling, nail biting & skin picking","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/24d34406-7124-4fdd-810c-5ac4f5a61034.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"SoloUno helps people take control over body-focused repetitive behaviors (BFRBs) such as hair pulling (trichotillomania), skin picking (dermatillomania), and nail biting. Inspired by Habit Reversal Training, CBT, and ACT, it works as a gamified self-help tool. You progress by achieving small daily wins: habit-free challenges and streaks, quick habit logging, trigger analysis, and urge-acceptance sessions. No shame - just steady progress.","zhDetail":"SoloUno 是一款面向拔毛癖、皮肤抠抓和咬指甲等身体重复行为（BFRB）人群的游戏化自助工具。它融合习惯逆转训练、认知行为疗法和接纳承诺疗法，通过每日小目标（如无习惯挑战、连续打卡、快速记录、触发因素分析和冲动接纳练习）帮助用户逐步摆脱困扰，以无羞耻感的方式实现稳步改善。"},{"rank":8,"name":"Viktor.com","zhName":"Viktor.com","url":"https://www.producthunt.com/products/viktor","desc":"An AI coworker that actually does the work","zhDesc":"An AI coworker that actually does the work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/37038cc7-70ae-4d9f-b264-b20497bae49b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Your AI tools answer questions. Viktor does the work. It lives in Slack and Microsoft Teams, connects to 3,200+ tools across your stack, and acts on its own. It watches how your team works, spots problems before anyone notices, and proposes automations built around how your company actually works. It manages campaigns, builds apps, delivers reports, and writes code. And it runs for weeks without losing context, learning your company deeper every day. Not a chatbot. An AI employee.","zhDetail":"Viktor.com 是一款面向企业团队的 AI 员工，直接嵌入 Slack 和 Microsoft Teams，连接 3200 多种常用工具，自主执行任务。它能观察团队工作方式，提前发现问题并主动提出自动化方案，还能管理营销活动、构建应用、生成报告和编写代码，且长期保持上下文记忆，持续学习公司业务，而非简单的聊天机器人。"},{"rank":9,"name":"DocsAlot CLI","zhName":"DocsAlot CLI","url":"https://www.producthunt.com/products/docsalot-2","desc":"Let Claude or Codex create and maintain good looking docs","zhDesc":"Let Claude or Codex create and maintain good looking docs","tags":[],"upvotes":null,"icon":null,"detail":"Claude Code and Codex are great at writing a first draft. DocsAlot turns that draft into a genuinely good-looking docs site, and gives your agent a complete workflow for keeping it current. Ask in plain English to create or pull docs, preview changes, migrate existing content, save versions, and publish only when approved. No commands to memorize or documentation workflow to manage by hand. You describe the outcome; your agent handles the work while you stay in control","zhDetail":"DocsAlot CLI 面向使用 Claude Code 或 Codex 等 AI 编程助手的开发者，解决“初稿易得、文档难精”的问题。它能把 AI 生成的草稿自动转化为美观的文档站点，并赋予你的智能体一套完整流程，用自然语言即可创建、拉取、预览、迁移、保存版本，并在你批准后才发布，无需记忆命令或手动管理文档流程。"},{"rank":10,"name":"Argos","zhName":"Argos","url":"https://www.producthunt.com/products/argos-2","desc":"The AI that acts as you, right in your browser","zhDesc":"The AI that acts as you, right in your browser","tags":[],"upvotes":null,"icon":null,"detail":"Most AI just tells you what to do. Argos does it. It works right inside your browser using your own logged-in accounts — clicking, typing, filling forms, and finishing real tasks. Ask it in the sidebar or text it on Telegram/WhatsApp, and it runs live or in the background, then hands you the result. Native in Gmail, Docs and Sheets. Connects GitHub, Slack, Notion and more. Your data stays on your device. Free to start.","zhDetail":"Argos 是一款直接在浏览器中替你完成真实操作的 AI 助手，面向希望省去重复点击、填表等繁琐步骤的用户。它利用你已登录的账号，在侧边栏或通过 Telegram/WhatsApp 下达指令，即可实时或后台执行任务，并原生支持 Gmail、Docs 和 Sheets，同时连接 GitHub、Slack、Notion 等工具。所有数据保留在你的设备上，免费即可开始使用。"},{"rank":11,"name":"Meet Bruno","zhName":"Meet Bruno","url":"https://www.producthunt.com/products/bruno-6","desc":"Send a request, commit the collection. No account, no cloud.","zhDesc":"Send a request, commit the collection. No account, no cloud.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/74254131-e46d-4271-bb8b-7da3c8ce6bc5.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"The API-client built for developers. Open-source. Local Native git. Bruno stores collections on your filesystem which allows you to natively interact with git for collaboration and versioning.","zhDetail":"Meet Bruno 是一款专为开发者打造的开源 API 客户端，它将接口集合直接存储在本地文件系统中，原生支持 Git 协作与版本管理。无需云端同步，开发者即可像管理代码一样管理 API 请求，实现团队高效共享、追踪变更与回滚，彻底告别传统 API 工具的锁定与同步烦恼。"},{"rank":12,"name":"Papaya","zhName":"Papaya","url":"https://www.producthunt.com/products/papaya-4","desc":"Your sex's private recap — never leaves your phone","zhDesc":"Your sex's private recap — never leaves your phone","tags":[],"upvotes":null,"icon":null,"detail":"🔒 Network: for most people the only call is Apple's subscription check. Subscribe from Russia, where Apple IAP does not work, and a separate path confirms your subscription through Sign in with Apple. It sends an Apple token, never session data. Run a packet trace. I would rather you verify than trust me.","zhDetail":"Papaya 是一款面向无法使用 Apple 内购订阅（如俄罗斯地区用户）的工具，通过“通过 Apple 登录”独立验证订阅状态，解决苹果订阅检查不可用的问题。它仅发送 Apple 令牌，绝不传输会话数据，并支持数据包追踪，让用户可自行验证安全性。"},{"rank":13,"name":"Persodex","zhName":"Persodex","url":"https://www.producthunt.com/products/persodex-contacts-with-context-for-ios","desc":"Your personal CRM that lives on top of your iOS contacts.","zhDesc":"Your personal CRM that lives on top of your iOS contacts.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/ad2bcf23-a3d4-4e83-acd9-ab76a53f3357.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"A smarter contacts app that helps you stay in touch with the people who matter. Or as we like to call it: Contacts with Context. Persodex syncs natively with Apple’s Contacts instead of replacing them. We don‘t even require an account. No import. No migration. No lock-in.","zhDetail":"Persodex 是一款更智能的联系人管理应用，帮助用户与重要的人保持联系，堪称“带背景信息的通讯录”。它原生同步 Apple 通讯录，无需导入、迁移或注册账号，即可为联系人补充上下文信息，让每次沟通都更有温度、更高效。"},{"rank":14,"name":"2. AstraPixels","zhName":"AstraPixels","url":"https://www.producthunt.com/products/astrapixels","desc":"​​A pixel-art solar system at its real current positions.​","zhDesc":"​​A pixel-art solar system at its real current positions.​","tags":[],"upvotes":null,"icon":null,"detail":"An animated pixel-art map of the solar system with every body at its real current position, computed from published orbital elements rather than copied from a list. Zoom from the Sun to the Kuiper belt, browse 171 catalogued objects with sourced facts, and see what the sky is doing for the next six months. Every rock is also for sale: claim an asteroid for $5, keep it forever, name it whatever you like. A name here is shown on AstraPixels only, and is not an IAU designation.","zhDetail":"AstraPixels 是一张动态像素艺术太阳系地图，面向天文爱好者、教育工作者和好奇的探索者。它基于公开轨道数据实时计算并展示每个天体的真实当前位置，而非静态列表，让你从太阳一路缩放到柯伊伯带，浏览171个带来源说明的天体，并查看未来六个月的天空动态。此外，你还可以花5美元认领一颗小行星，永久命名并展示在图上（仅限站内展示，非IAU官方命名）。"},{"rank":15,"name":"3. Hexis","zhName":"Hexis","url":"https://www.producthunt.com/products/bevel-4","desc":"Git-backed skills, tools & context for AI agents","zhDesc":"Git-backed skills, tools & context for AI agents","tags":[],"upvotes":null,"icon":null,"detail":"One place where your company's AI skills, tools and knowledge live - centrally managed, reviewed and access-controlled, and usable from any AI agent. Hexis is a layer on top of Git: same core (versioning, PRs), plus a clean UX so anyone can use skills, suggest changes, and submit new ones and admins can govern which context, tools, and skills each person, team, or agent can access. Consumed via MCP, works in any agent in the company.","zhDetail":"Hexis 是一个集中管理企业 AI 技能、工具和知识的平台，让任何 AI 代理都能安全调用。它基于 Git 构建，提供版本控制、审查和权限管理，同时拥有简洁易用的界面，使普通员工也能提交或建议技能变更，管理员则可精细控制每个团队或代理的访问范围。通过 MCP 协议接入，Hexis 可无缝适配公司内任意 AI 代理，解决 AI 工具分散、难以治理和复用的问题。"},{"rank":16,"name":"5. Toolport","zhName":"Toolport","url":"https://www.producthunt.com/products/conduit-12","desc":"Every tool, one port. One MCP setup for all your AI agents","zhDesc":"Every tool, one port. One MCP setup for all your AI agents","tags":[],"upvotes":null,"icon":null,"detail":"A free, open source, local MCP gateway. Set up each server once and every AI agent shares it (Claude, Cursor, VS Code, Codex, and 29 more). Instead of dumping every tool definition into context, it exposes a few meta-tools your agent searches on demand. Benchmarked and graded for correct answers, that's up to 91% fewer tokens at the same task success. Secrets live in your OS keychain, not client configs. Rug-pulls and tool poisoning get flagged, and destructive calls can wait for your approval.","zhDetail":"Toolport 是一款免费、开源的本地 MCP 网关，专为使用多种 AI 编程工具（如 Claude、Cursor、VS Code、Codex 等）的开发者设计。它解决了每个 AI 客户端重复配置工具、上下文被工具定义塞满导致效率低下的问题，通过一次性设置服务器并暴露少量元工具，让 AI 按需搜索调用，最高可减少 91% 的 token 消耗。同时，它把密钥安全存放在系统钥匙串中，并能标记恶意工具或拦截破坏性操作，确保开发过程更安全可控。"},{"rank":17,"name":"1. Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":null,"detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向开发团队和产品经理的 AI 审查工具，能在代码发布前捕捉 AI 代理做出的隐含产品决策。它会结合规格说明、工单和现有产品上下文，清晰解释每个决策的内容、潜在影响及撤销难度，帮助团队快速批准、修正或替换决策，并将这些上下文延续到后续开发中，避免“隐性决策”带来的返工和风险。"},{"rank":18,"name":"3. SKI","zhName":"SKI","url":"https://www.producthunt.com/products/ski","desc":"Free voice coding for Claude Code, Codex and more","zhDesc":"Free voice coding for Claude Code, Codex and more","tags":[],"upvotes":null,"icon":null,"detail":"We just built SKI — voice coding for Claude Code, Codex and more. It's not dictation: your agent answers you out loud, like a real teammate, so you build at the speed you think. You can even bring it into let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
