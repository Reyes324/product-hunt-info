<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年8月6日</span>
        <span class="updated">更新于 09:03</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-07","updatedAt":"09:03","yesterday":[{"rank":9,"name":"Aveiro","zhName":"Aveiro","url":"https://www.producthunt.com/products/aveiro","desc":"Publish sites, newsletters and social posts with AI agents","zhDesc":"Publish sites, newsletters and social posts with AI agents","tags":[],"upvotes":null,"icon":null,"detail":"For sites and pages, you can already give publishing permission to the AI, so for low-risk content updates (e.g. documentation update on pull requests) AI can keep everything up to date. Of course, it's optional and up to the team's workflow.","zhDetail":"Aveiro 面向需要管理网站和页面内容更新的团队，允许将发布权限安全地授予 AI，从而自动处理低风险的内容变更（如拉取请求中的文档更新）。它让 AI 在团队工作流中自主保持内容最新，同时保留人工控制的灵活性，减少重复性维护工作。"},{"rank":12,"name":"Chute","zhName":"Chute","url":"https://www.producthunt.com/products/chute-better-airdrop","desc":"The fastest way to send anything to your iPhone","zhDesc":"The fastest way to send anything to your iPhone","tags":[],"upvotes":null,"icon":null,"detail":"Hi Product Hunt! I made Chute, something that I have been using dozens of delightful times a day that I wanted to share -- the other day I was posting an ig story and wanted to drop in a screenshot of something I was working on in figma and realized: a) there is no easy way to do this b) handoff sucks and works half the time c) airdrop share flow is clunky so i built something that is butter smooth and 10x faster! This is genuinely the fastest way to get anything from your mac to iPhone. I'm so happy to finally be able to share it with the world and launch here on PH!","zhDetail":"Chute 是一款专为 Mac 和 iPhone 用户打造的极速文件传输工具，解决了从电脑向手机发送截图、图片等文件时操作繁琐、成功率低的问题。它通过流畅的分享流程，让你在几秒内完成传输，比 AirDrop 更快更可靠。"},{"rank":17,"name":"UCP Radar","zhName":"UCP Radar","url":"https://www.producthunt.com/products/ucp-radar","desc":"Make your product feed visible to AI shopping agents","zhDesc":"Make your product feed visible to AI shopping agents","tags":[],"upvotes":null,"icon":null,"detail":"Your titles and descriptions were probably never written to Google's spec. And the fields AI agents read (material, product details, age group, highlights, FAQ) are sitting empty. Connecting UCP Radar to Merchant Center is one click. It then works through the catalog, flagging what breaks GMC rules and what hides you from AI shopping assistants, rewriting weak titles and filling the blanks. Brand names it leaves alone. Out comes a supplemental feed Google, Perplexity and ChatGPT can read.","zhDetail":"UCP Radar 是一款面向电商卖家的商品数据优化工具，专治商品标题和描述不符合 Google 规范、以及 AI 购物助手所需的关键字段（如材质、产品详情、适用年龄、亮点、FAQ）缺失的问题。只需一键连接 Merchant Center，它便会自动扫描整个商品目录，标记违反 GMC 规则或导致商品在 AI 搜索中“隐身”的条目，并重写薄弱标题、填补空白字段，同时保留品牌名不变，最终生成一份 Google、Perplexity 和 ChatGPT 都能轻松读取的补充数据源。"}],"today":[{"rank":1,"name":"Coldtea.ai","zhName":"Coldtea.ai","url":"https://www.producthunt.com/products/coldtea","desc":"Make your software delivery self-driving","zhDesc":"Make your software delivery self-driving","tags":[],"upvotes":null,"icon":null,"detail":"When I was a Staff Engineer at the world's largest meal kit brand, HelloFresh, what I personally obsessed over was the part after merging a PR: how do you know a regression didn't slip through, how do you know what production is doing right now, have we architected the product right, and where does the whole team go to see it all of this in one place? That question followed me home.","zhDetail":"Coldtea.ai 是一款面向工程团队的生产环境监控与架构可视化工具，帮助开发者在代码合并后快速发现回归问题、实时掌握生产状态，并直观理解系统架构。它通过统一的数据面板和自动化分析，让整个团队在一个地方就能看清产品运行全貌，减少排查故障的时间成本。"},{"rank":2,"name":"StepShot","zhName":"StepShot","url":"https://www.producthunt.com/products/stepshot-2","desc":"AI that turns real workflows into step-by-step guides","zhDesc":"AI that turns real workflows into step-by-step guides","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b1c91584-8ff0-416d-a654-6dde1ed3bf06.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"StepShot is an AI-powered documentation tool that turns real on-screen workflows into polished step-by-step guides as you work. It captures clicks and typing; local AI frames screenshots, writes instructions, and explains which actions to keep or skip. Edit, annotate, reorder, and redact every step, then export to PDF, Markdown, or HTML. It runs locally on your Mac with no account or product telemetry, while optional cloud AI polishing uses your own OpenAI-compatible provider.","zhDetail":"StepShot 是一款面向技术写作者、产品经理和开发者的 AI 文档工具，能在你操作屏幕时自动将真实工作流程转化为精美的分步指南。它通过本地 AI 捕捉点击与输入，自动截屏并撰写操作说明，同时智能判断哪些步骤该保留或省略；你还可以自由编辑、标注、排序和脱敏每一步，并导出为 PDF、Markdown 或 HTML。所有处理默认在 Mac 本地运行，无需注册账号或发送遥测数据，可选云端润色则使用你自己的 OpenAI 兼容服务，兼顾隐私与灵活性。"},{"rank":3,"name":"Kitesurf","zhName":"Kitesurf","url":"https://www.producthunt.com/products/cloudflare","desc":"Browser built for agents, running on Cloudflare Workers","zhDesc":"Browser built for agents, running on Cloudflare Workers","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/82f3196a-79f8-4479-9c73-2ff286bf0b69.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Use Kitesurf, Cloudflare's stateless, agent-first browser that runs entirely on Workers, with Browser Run for screenshots, HTML extraction, and automation.","zhDetail":"Kitesurf 是 Cloudflare 推出的无状态、面向智能体的浏览器，完全运行在 Workers 上。面向开发者与自动化场景，帮助用户无需管理传统浏览器实例即可完成网页截图、HTML 提取和自动化操作，通过轻量级 API 调用实现高效、可扩展的云端浏览任务。"},{"rank":4,"name":"Orite","zhName":"Orite","url":"https://www.producthunt.com/products/orite","desc":"Give your AI Agent money. Not a blank check.","zhDesc":"Give your AI Agent money. Not a blank check.","tags":[],"upvotes":null,"icon":null,"detail":"AI agents can already shop, book, and research on their own but the moment one needs to pay, every existing system assumes a human clicks approve. Nobody built for agents. Orite fixes that. Set spending limits once Orite enforces them on every transaction, automatically. Stay within budget, it just happens. Go over, it's blocked or held for a quick yes/no. Every payment logged, always explainable. Works wherever you build your agent. This is day one of AI having its own money.","zhDetail":"Orite 是为 AI 代理打造的支付基础设施，解决现有系统在代理付款时仍需人工确认的痛点。你只需设置一次消费限额，Orite 会在每笔交易中自动执行预算控制，超支时自动拦截或等待快速审批，所有支付记录清晰可查，并兼容任何代理构建平台。这是 AI 拥有自己“钱包”的第一步。"},{"rank":5,"name":"BAP Studio","zhName":"BAP Studio","url":"https://www.producthunt.com/products/bap-studio","desc":"An MPC-style drum machine that runs in a browser tab","zhDesc":"An MPC-style drum machine that runs in a browser tab","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b8293873-9e8a-4e1f-aee3-3509a28f14e7.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Make beats in your browser with 16 velocity drum pads, a step sequencer, swing, sampling and WAV export. Free, no download, no signup.","zhDetail":"BAP Studio 是一款在浏览器中直接使用的免费音乐制作工具，专为喜欢即兴创作节拍的 Beatmaker 和音乐爱好者设计。它提供 16 个力度感应鼓垫、步进音序器、摇摆功能、采样以及 WAV 导出，无需下载或注册，打开网页即可快速完成节奏编排与作品导出。"},{"rank":6,"name":"Fin","zhName":"Fin","url":"https://www.producthunt.com/products/fin","desc":"Startups get Fin free for a year + 93% off Intercom","zhDesc":"Startups get Fin free for a year + 93% off Intercom","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/5981d643-91c7-43ec-ad8f-27de75dfbd97.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Reviewers largely see Fin as strong at handling common support questions, blending AI with human handoff, and helping small teams stay responsive without much manual work. Several say it improves efficiency, customer satisfaction, and even supports proactive guidance. But praise is tempered by repeated concerns about cost: pricing and upgrades can become hard to justify, especially for startups or as volume grows. Users also flag weaker performance on off-script or account-specific issues, confusing analytics, some missing basics, and occasional inconsistency in the AI experience.","zhDetail":"Fin 是一款面向小型客服团队的 AI 助手，能够自动处理常见支持问题，并在必要时无缝转接人工，帮助团队在少投入的情况下保持高响应速度。它通过混合 AI 与人工协作的方式提升效率与客户满意度，并支持主动引导，但需注意其定价在业务增长后可能较难承受。"},{"rank":7,"name":"Whop CLI","zhName":"Whop CLI","url":"https://www.producthunt.com/products/whop-cli","desc":"Run your entire business from the terminal","zhDesc":"Run your entire business from the terminal","tags":[],"upvotes":null,"icon":null,"detail":"Everything you can do from your Whop dashboard now runs from a terminal. Build a business, create products, set pricing, run ads, move money, ship apps, and read the numbers. Run it yourself, or hand it to an AI agent like Claude, Cursor, or Codex. The entire Whop API, one binary, your business is completely programmable. You don't need to be a dev wizard. Just tell your agent what you want, and it runs the commands for you. It's that easy.","zhDetail":"Whop CLI 是一款面向商家和开发者的命令行工具，让你无需打开网页后台，就能在终端里完成建站、创建产品、定价、投放广告、转账和查看数据等全部操作。它把整个 Whop API 封装进一个二进制文件，业务完全可编程；即使你不懂编程，也能通过自然语言让 AI 代理（如 Claude、Cursor 或 Codex）替你执行命令，轻松管理生意。"},{"rank":8,"name":"Nitro 4.0","zhName":"Nitro 4.0","url":"https://www.producthunt.com/products/alconost-localization","desc":"The first human translation platform built for AI agents","zhDesc":"The first human translation platform built for AI agents","tags":[],"upvotes":null,"icon":null,"detail":"Nitro is now the first human translation service an AI agent can order and pay for on its own — no account, no API keys, no signup. Your agent sends the text, pays per request, and a professional native speaker translates it — publication-ready in hours. Great for the smaller texts that still need to be right: ads, app updates, email sequences, and more. The ordering is machine-to-machine. The translating stays human. 80+ languages. No plans, no minimums.","zhDetail":"Nitro 4.0 是首个让 AI 代理能够自主下单并付费的人工翻译服务，无需注册账户或 API 密钥。您的 AI 代理发送文本、按次付费，即可获得专业母语译者的高质量翻译，数小时内交付可发布内容。适用于广告、应用更新、邮件序列等需要精准翻译的短文本，支持 80 多种语言，无套餐和最低消费限制。"},{"rank":9,"name":"Rindler","zhName":"Rindler","url":"https://www.producthunt.com/products/rindler","desc":"Automate the web work your team does by hand","zhDesc":"Automate the web work your team does by hand","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/52f5cfe9-17e4-4dd0-8cb0-56f60a9e0c2b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Rindler automates the repetitive web work your team still does by hand. Say what you need in plain English, and Rindler goes to the real site, signs in when needed, completes the task, and returns clean structured data. Put it on a schedule and it keeps running. Instead of making a browser agent guess every time, Rindler maps each site ahead of time and repairs workflows when pages change, so recurring tasks stay reliable","zhDetail":"Rindler 是一款面向团队的自动化工具，能替代人工完成重复性的网页操作。你只需用日常语言描述需求，它就会自动登录真实网站、完成任务并返回清晰的结构化数据，还能按计划定时运行。通过预先映射网站结构并在页面变动时自动修复流程，Rindler 让周期性任务保持稳定可靠，无需每次依赖浏览器代理猜测操作。"},{"rank":10,"name":"Tines","zhName":"Tines","url":"https://www.producthunt.com/products/tines","desc":"The single, secure environment for agents, apps, and automations.","zhDesc":"The single, secure environment for agents, apps, and automations.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/cc0a22b2-4c48-45db-b558-21182d4ac184.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Tines offers a secure, trusted, vendor-agnostic platform to build, run, and monitor intelligent workflows.","zhDetail":"Tines 是一款安全、可信且与供应商无关的智能工作流平台，帮助安全与运营团队无需编写代码即可构建、运行和监控自动化流程。它通过可视化界面连接各类工具与数据源，解决重复性任务和响应效率低下的问题，让团队更专注于高价值决策。"},{"rank":11,"name":"HAR","zhName":"HAR","url":"https://www.producthunt.com/products/har","desc":"Open Source harness for multi-agent coding workflows","zhDesc":"Open Source harness for multi-agent coding workflows","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0642afb7-fe40-4cb2-afe5-f7174ef7e5a5.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"All of this lives in one contract committed to your repo, which every agent reads the same way. It replaces the usual scatter of a README, a CLAUDE.md, editor rules, and CI config that drift apart. You start from a profile that matches your stack, your agent adapts it to the real repo, and you extend verification with plugins (like Playwright) or with any command you already run.","zhDetail":"HAR 是一款面向开发者的 AI 代理配置管理工具，旨在解决项目文档、规则和 CI 配置分散且容易不一致的问题。它将所有约定统一到一个提交到代码仓库的合约文件中，让每个 AI 代理都按同一标准读取，并支持根据你的技术栈快速初始化、自动适配实际仓库，以及通过插件或自定义命令扩展验证流程。"},{"rank":12,"name":"AndroMeld","zhName":"AndroMeld","url":"https://www.producthunt.com/products/andromeld","desc":"Bring a continuity-style experience to Android and Mac","zhDesc":"Bring a continuity-style experience to Android and Mac","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/868920a5-d609-437c-ac84-78c02f1af73a.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"AndroMeld brings a Continuity-style experience to Android and Mac. Mirror multiple Android apps in separate, resizable, native-like Mac windows, hand off the app already open on your phone, and control it with keyboard & trackpad gestures. Browse Android storage in Finder, sync notifications and clipboard, and turn on your phone’s hotspot over Bluetooth. Support any Android 16+ devices connect by USB or Wi-Fi, with a free Web App available.","zhDetail":"AndroMeld 为 Android 和 Mac 用户带来类似苹果 Continuity 的无缝体验。它能在 Mac 上以独立、可调整大小的原生风格窗口镜像多个 Android 应用，并支持从手机直接接力当前打开的 App，用键盘和触控板手势操控。此外，你还可以在 Finder 中浏览 Android 存储、同步通知与剪贴板，并通过蓝牙开启手机热点，支持所有 Android 16+ 设备通过 USB 或 Wi-Fi 连接，还提供免费网页版。"},{"rank":13,"name":"Crew","zhName":"Crew","url":"https://www.producthunt.com/products/crew-a-tiny-crew-for-claude-code","desc":"A tiny crew of monsters for your Claude Code agents","zhDesc":"A tiny crew of monsters for your Claude Code agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e0e02b58-e2d2-4adf-b7ea-9c728cbae3d8.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Crew gives every Claude Code chat and subagent a body: a little pixel monster that walks along the bottom of your screen, digs while it works, sleeps when it's idle, and waves when it's done. Free for macOS. Nothing ever leaves your Mac.","zhDetail":"Crew 为 Claude Code 的每次对话和子代理赋予一个可爱的像素小怪兽形象，在屏幕底部行走、工作时挖掘、空闲时睡觉、完成后挥手致意。它面向 macOS 用户，完全免费且所有数据仅保存在本地，让开发过程更生动有趣，同时不牺牲隐私安全。"},{"rank":14,"name":"Merge","zhName":"Merge","url":"https://www.producthunt.com/products/merge-5","desc":"AI-native code review assessments","zhDesc":"AI-native code review assessments","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/611fa5dc-e8ce-427b-935b-bab5e0cf2468.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Merge is a online code review assessment that helps engineering teams assess engineering judgement. With Merge, candidates review a PR, just like on the job. Then, our AI agent addresses PR comments in realtime, simulating a real engineer. At the end, we assess bug coverage, communication, PR quality, and token use efficiency.","zhDetail":"Merge 是一款在线代码评审评估工具，帮助工程团队衡量候选人的工程判断力。候选人像在实际工作中一样审查一个 Pull Request，随后 AI 代理会实时回应评审意见，模拟真实工程师的互动。最终，系统会评估缺陷覆盖、沟通能力、PR 质量和 token 使用效率，为招聘决策提供量化依据。"},{"rank":15,"name":"Viktor.com","zhName":"Viktor.com","url":"https://www.producthunt.com/products/viktor","desc":"An AI coworker that actually does the work","zhDesc":"An AI coworker that actually does the work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/fd5afde4-430d-4d5c-9abc-56de9221f9c2.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=max&frame=1&h=178&w=888","detail":"Your AI tools answer questions. Viktor does the work. It lives in Slack and Microsoft Teams, connects to 3,200+ tools across your stack, and acts on its own. It watches how your team works, spots problems before anyone notices, and proposes automations built around how your company actually works. It manages campaigns, builds apps, delivers reports, and writes code. And it runs for weeks without losing context, learning your company deeper every day. Not a chatbot. An AI employee.","zhDetail":"Viktor.com 是一款驻留在 Slack 和 Microsoft Teams 中的 AI 员工，能连接你团队使用的 3,200 多种工具并自主行动。它主动观察团队工作方式，提前发现问题，并基于公司实际流程提出自动化方案，还能管理项目、构建应用、生成报告和编写代码。它并非聊天机器人，而是能持续学习、长期保持上下文并深度融入公司运作的 AI 同事。"},{"rank":16,"name":"Soloop","zhName":"Soloop","url":"https://www.producthunt.com/products/soloop","desc":"Approval-first Agent OS for solo founders","zhDesc":"Approval-first Agent OS for solo founders","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/206a6062-9874-4dfc-9dbb-87366bd3d63b.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"I measure an AI team by **how much uncertainty it removes** each week. Soloop helps a founder turn a company thesis into a focused bet, test it in the market, and bring back evidence before making the next commitment. Most AI tools make an individual task cheaper. Soloop aims to reduce the cost of deciding what the company should do next.","zhDetail":"Soloop 是一款面向创始人的 AI 决策助手，帮助你将公司战略构想转化为明确的行动赌注，并在市场中进行快速验证。它通过收集真实反馈和证据，降低“下一步该做什么”的决策成本，让你在每次投入资源前都能基于数据做出更明智的选择。"},{"rank":17,"name":"Blueberry","zhName":"Blueberry","url":"https://www.producthunt.com/products/blueberry-6","desc":"Stop Ghosting People You Actually Like","zhDesc":"Stop Ghosting People You Actually Like","tags":[],"upvotes":null,"icon":null,"detail":"Recent thread context is sent to the cloud to generate drafts. Our models are hosted on AWS Bedrock or Google Vertex servers. This means that your iMessages stay private and secure, and model providers cannot see your data or use it to train on.","zhDetail":"Blueberry 是一款面向苹果用户的智能回复工具，专为 iMessage 设计。它能将最近的聊天上下文安全发送至云端（基于 AWS Bedrock 或 Google Vertex 服务器）自动生成回复草稿，同时确保消息内容私密且不被模型提供商用于训练，让用户在保护隐私的前提下快速、自然地完成对话。"},{"rank":18,"name":"Mem0","zhName":"Mem0","url":"https://www.producthunt.com/products/mem0-5","desc":"Persistent Memory Layer for AI Agents","zhDesc":"Persistent Memory Layer for AI Agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2e38bbde-7acf-4c84-98e8-638b629e2927.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Mem0 enables AI agents & apps to continuously learn from past user interactions, enhancing their intelligence and personalization.","zhDetail":"Mem0 为 AI 智能体和应用提供持续学习能力，使其能从过往用户交互中不断积累知识，从而提升智能水平与个性化体验。它面向开发者与产品团队，通过无缝集成记忆层，让 AI 更懂用户、响应更贴心。"},{"rank":19,"name":"Lightfield","zhName":"Lightfield","url":"https://www.producthunt.com/products/lightfield","desc":"AI-native CRM that builds itself and does work for you","zhDesc":"AI-native CRM that builds itself and does work for you","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e31fc558-30e0-48e2-921a-0199328f3f02.x-icon?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Lightfield reads your emails, meetings, and calls to build your CRM automatically. No manual data entry — ever. Connect your inbox, upload a spreadsheet or CSV from your old CRM, and everything is recreated in less than five minutes. Ask it anything in plain English: who needs follow-up, what objections keep coming up, how has our ICP shifted — answered from your actual conversations. Then put it to work to draft follow-ups, create board decks, build proposals, and more.","zhDetail":"Lightfield 是一款面向销售团队的智能 CRM 自动构建工具，通过读取你的邮件、会议和通话记录，自动填充客户数据，彻底告别手动录入。只需连接邮箱或上传旧 CRM 的表格，五分钟内即可完成迁移，并能用自然语言提问（如“谁需要跟进”“客户常提哪些异议”），还能自动生成跟进邮件、董事会汇报和提案，让销售工作更高效。"},{"rank":20,"name":"DataBlur","zhName":"DataBlur","url":"https://www.producthunt.com/products/datablur","desc":"Blur sensitive data on screen before anyone sees it","zhDesc":"Blur sensitive data on screen before anyone sees it","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/73d1c001-6443-46e8-a686-410d4ba46b8f.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"DataBlur blurs sensitive data on your screen in real time — during live scord 社区分享产品预览、更新和幕后进展，并鼓励成员互相交流、协作共创，共同影响产品的发展方向。"},{"rank":10,"name":"Cekura","zhName":"Cekura","url":"https://www.producthunt.com/products/vocera","desc":"The self-improvement loop for voice agents","zhDesc":"The self-improvement loop for voice agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a0348018-57b9-4835-bf5a-faf8d3bee8a0.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Cekura is praised for its innovative approach to automating QA for Conversational AI teams. Users appreciate its ability to enhance user experience and save time by automating changes and validation. The software is noted for its practicality and ease of use, with one user highlighting its effectiveness in providing peace of mind for elderly care. The response team is commended for their quick and professional handling of emergencies. Overall, Cekura is seen as a valuable tool for improving the quality and reliability of AI agents.","zhDetail":"Cekura 是一款面向对话式 AI 团队的自动化质量保障工具，帮助用户快速验证和部署 AI 行为变更，显著提升用户体验并节省时间。它操作简便、实用性强，尤其适用于需要高可靠性的场景（如老年护理），同时其响应团队能专业高效地处理紧急问题，让团队对 AI 智能体的质量与稳定性更放心。"},{"rank":15,"name":"Zinley","zhName":"Zinley","url":"https://www.producthunt.com/products/zinley","desc":"Your Personal AI Representative for calls, email, and tasks","zhDesc":"Your Personal AI Representative for calls, email, and tasks","tags":[],"upvotes":null,"icon":null,"detail":"the caller-ID angle is what worries me more than prompt injection - if part of how Zinley decides \"is this a known relationship\" leans on caller ID or the from-address, both are trivially spoofable. someone who's done a bit of recon on you (knows your assistant's name, knows a real contact's number) could call in pretending to be that trusted contact and get bumped into the more autonomous tier before Zinley ever has to guess anything risky. is there any out-of-band verification for \"this really is the person Zinley thinks it is,\" or does trust level still ultimately trace back to caller ID/email address matching a stored contact?","zhDetail":"Zinley 是一款面向个人与团队的智能语音/消息助手，旨在解决来电或来信身份验证不可靠的问题——尤其是防止通过伪造来电显示或发件地址冒充熟人来骗取更高权限。它通过引入带外验证机制（如独立于来电信息的二次确认）来确认对方真实身份，从而在自动处理敏感任务前确保信任等级可靠。"},{"rank":16,"name":"Denovo","zhName":"Denovo","url":"https://www.producthunt.com/products/denovo-business-manager","desc":"Turn your vibe-coded app into paying customers","zhDesc":"Turn your vibe-coded app into paying customers","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/93aac7bb-d5a6-4c32-8611-7018fabe2faa.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Congrats on the launch Saverio. The honest bit about previous startups failing on go-to-market makes this more interesting than the usual “build anything with AI” pitch. Denovo is taking on a lot though. Idea validation, branding, websites, payments, ads, lead generation, reporting. I’d want to know where the system is genuinely making decisions and where it is mainly automating setup. The green, yellow, red verdict also caught my attention. Has Denovo ever told a founder not to build something, and what evidence does it use to make that call? That could be one of the most valuable parts if it is willing to be blunt.","zhDetail":"Denovo 是一款面向创业者的全流程 AI 助手，覆盖从创意验证、品牌设计、网站搭建到支付、广告投放、线索生成和报告分析等环节。它通过自动化工具减少繁琐的启动工作，并用红黄绿三色评估系统帮助创始人判断项目可行性，敢于直接建议“不要做”，从而降低盲目创业的风险。"},{"rank":17,"name":"NINA","zhName":"NINA","url":"https://www.producthunt.com/products/agenq-nina-ai-product-assistant","desc":"Guide users step by step inside your product.","zhDesc":"Guide users step by step inside your product.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/8f171449-e35d-4ef7-98c1-0387d7c1be54.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"NINA lives inside your product and helps users exactly where they get stuck. They ask “How do I…?” by voice or text, and NINA guides them step by step on the live interface before they open a ticket, search documentation, or message support. It is not a scripted tour, chatbot, or FAQ. NINA is built for B2B SaaS teams still relying on onboarding calls, product videos, Slack channels, and repeated support answers.","zhDetail":"NINA 是一款嵌入产品内部的智能引导助手，专为 B2B SaaS 团队打造，帮助用户在真实界面中通过语音或文字提问“怎么做…”，并逐步获得操作指引，从而减少对 onboarding 电话、产品视频、Slack 频道和重复客服解答的依赖。它并非预设脚本、聊天机器人或 FAQ，而是直接在用户卡住的位置提供即时、情境化的解决方案，显著降低支持成本并提升用户自助完成率。"}],"monthly":[{"rank":1,"name":"Acti","zhName":"Acti","url":"https://www.producthunt.com/products/acti-2","desc":"Agentic keyboard for mobile commands and search","zhDesc":"Agentic keyboard for mobile commands and search","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/5ccc5e0b-77d9-45f8-bafe-ec081a905348.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Type what you need. Hold Acti Bar. Acti understands your intent and brings back the right result, link, or action - right where you are. Use Acti for live sports schedules, nearby restaurants, Notion docs, LinkedIn profiles, Meet links, Calendar actions, and custom workflows - without leaving the conversation.","zhDetail":"Acti 是一款面向日常对话场景的智能操作助手，让你无需切换应用即可快速获取所需信息或执行操作。只需输入需求并按住 Acti 栏，它就能理解你的意图，直接返回比赛日程、附近餐厅、Notion 文档、LinkedIn 资料、会议链接、日历操作或自定义工作流的结果，让一切触手可及。"},{"rank":2,"name":"Pazi","zhName":"Pazi","url":"https://www.producthunt.com/products/pazi","desc":"Vibe code business operations","zhDesc":"Vibe code business operations","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0cc238aa-08c3-4d44-a509-0289f8806019.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Pazi is an AI team for that idea you keep coming back to — a book, a shop, an app, a skill you want to sell. Tell Pazi what you're trying to do and it builds a team of agents around your idea and starts making things happen: a website, first outreach, content, the next step. Every time you come back, something has moved. You stay in control; your team does the rest alongside you, one real step at a time. Like vibe coding but for business operations.","zhDetail":"Pazi 是一个围绕你的创意组建的 AI 团队——无论是写书、开店、做应用还是卖技能，告诉它你的目标，它就会自动搭建代理团队并推进落地，包括建网站、首次外联、内容制作和下一步行动。每次回来，事情都有进展，你始终掌控方向，团队与你并肩一步步推进，就像“氛围编程”但用于商业运营。"},{"rank":5,"name":"AnySearch","zhName":"AnySearch","url":"https://www.producthunt.com/products/anysearch","desc":"Real-time structured search trusted by agents and developers","zhDesc":"Real-time structured search trusted by agents and developers","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/d7e5bffe-bacb-4118-a8e4-1bfbdf7c531e.x-icon?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"A search tool for agents, not a search box. AI agents are only as good as the information they receive. When connected to AnySearch, your agent gets filtered, de-duplicated, and structured information from trusted sources searched in parallel, helping it produce more reliable results. Free to start.","zhDetail":"AnySearch 是一款专为 AI 智能体设计的搜索工具，而非面向人类的搜索框。它能并行检索可信来源，并对结果进行过滤、去重和结构化处理，让智能体获得更可靠的信息，从而生成更准确的回答。适合开发者或团队为 AI 应用接入高质量数据源，免费即可开始使用。"},{"rank":9,"name":"Sim","zhName":"Sim","url":"https://www.producthunt.com/products/sim-studio","desc":"Open-source workspace for AI agents and workflows","zhDesc":"Open-source workspace for AI agents and workflows","tags":[],"upvotes":null,"icon":null,"detail":"I've been building agent workflows for a while and the thing that always killed me was how fast everything turns into crap once you go past two or three agents talking to each other. Sim fixes that. You get an actual visual canvas where you can see the whole flow, wire things up, and then actually deploy it instead of it just being a pretty diagram. It's open source and you can self host it, which matters a lot to me because I don't want my whole stack depending on some company's pricing decisions. The integrations that come out of the box saved me a ton of setup time too since they a 1000+! This is let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
