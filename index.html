<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年7月26日</span>
        <span class="updated">更新于 11:29</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-07-27","updatedAt":"11:29","yesterday":[{"rank":1,"name":"TouchGrass","zhName":"TouchGrass","url":"https://www.producthunt.com/products/touchgrass-2","desc":"Context-aware break reminders without invasive permissions","zhDesc":"Context-aware break reminders without invasive permissions","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2a4f342e-caaa-47f5-afb2-6c37767922b0.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"TouchGrass is a context-aware break reminder built for macOS. Most break reminders only know one thing: time. TouchGrass waits through meetings, calls, media playback and screen recordings, counts time away from your Mac as a completed break, and reminds you to blink, improve your posture and rest after long typing sessions. Everything runs locally, never asks for Accessibility permission, and respects your workflow. 7 day free trial, then a one time purchase of $3.99 with lifetime updates.","zhDetail":"TouchGrass 是一款专为 macOS 设计的智能休息提醒工具。它不同于传统仅依赖时间的提醒器，能自动识别会议、通话、媒体播放和屏幕录制等场景，在你离开电脑时自动计入休息时间，并在长时间打字后提醒你眨眼、改善坐姿和放松。所有功能本地运行，无需无障碍权限，尊重你的工作节奏。提供7天免费试用，之后一次性付费3.99美元即可获得终身更新。"},{"rank":2,"name":"Athena by Shoplazza","zhName":"Athena by Shoplazza","url":"https://www.producthunt.com/products/athena-by-shoplazza","desc":"An orchestrator agent for your entire commerce stack","zhDesc":"An orchestrator agent for your entire commerce stack","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/070fb73f-cbfd-450d-a087-e0e6b1ecf62b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"After years of working with e-commerce merchants, we've learned the real challenge isn't launching a storefront. It's connecting design, payments, shipping, and daily operations into one business that actually runs. Most AI tools hand you half a storefront and stop there. You still have to figure out theme setup and operations yourself. Athena doesn't work like that. It builds you a launch-ready store, then keeps it running.","zhDetail":"Athena 是一款面向跨境电商卖家的智能建站与运营助手，解决了从店铺搭建到日常运营中设计、支付、物流等环节难以整合的痛点。它不仅能自动生成可直接上线的店铺，还能持续协助运营管理，让卖家无需再手动处理主题配置和繁琐操作。"},{"rank":3,"name":"Openbase","zhName":"Openbase","url":"https://www.producthunt.com/products/openbase-2","desc":"Manage your team of AI agents by voice, from anywhere","zhDesc":"Manage your team of AI agents by voice, from anywhere","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/9b059430-9dce-4ca1-bd9b-80ac9702807d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Openbase lets you manage a team of AI coding agents by voice, from anywhere; no screen, no desk. AI agents can work async, but supervising them still pulls you back to a laptop. OpenBase fixes that. Dispatch tasks, steer agents mid-work, and approve changes just by talking. The agents write code, control your computer, open PRs, commit and push; you stay in control from your phone. Works across providers and syncs to your machine, so you pick up at your desk right where you left off.","zhDetail":"Openbase 让开发者通过语音管理一组 AI 编程代理，无需屏幕和办公桌，随时随地即可操作。它解决了传统 AI 代理异步工作时仍需回到笔记本电脑进行监督的痛点。你只需通过语音即可分配任务、中途调整代理工作方向、批准代码变更，代理会自动编写代码、控制电脑、提交 PR 并推送，而你只需用手机就能掌控全局，并支持跨平台同步，回到办公桌后无缝衔接。"},{"rank":4,"name":"SF Apartment Finder","zhName":"SF Apartment Finder","url":"https://www.producthunt.com/products/sf-apartment-finder","desc":"Tinder for live SF rentals from across the web","zhDesc":"Tinder for live SF rentals from across the web","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b8239e89-ef66-4ee2-a6db-50db666d92e2.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"A commute-time filter would be huge. Plug in where you work and it shows you listings under your max door-to-door time on Muni or BART, not just the rent number. Right now I still have to mentally cross-check every place against how long it'll actually take me to get to the office.","zhDetail":"面向在旧金山工作或生活的租房者，解决传统租房平台只显示租金、却忽略通勤时间的问题。只需输入工作地点，工具便会自动筛选出符合你最大通勤时间（基于Muni或BART）的房源，省去手动逐一核对通勤时长的麻烦。"},{"rank":5,"name":"Aymo AI","zhName":"Aymo AI","url":"https://www.producthunt.com/products/aymo-ai","desc":"All-in-one AI Platform for Teams","zhDesc":"All-in-one AI Platform for Teams","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/87e5614c-1ded-4f21-8b40-39385c993a57.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Get access to latest models of GPT, Claude, Gemini, DeepSeek, Grok, Kimi, GLM and 45+ top AI models in one secure workspace with powerful team features. Compare outputs AI model response side by side, upload and chat with files, search the web, generate images, and collaborate with your team on every plan. Free and decent plans that can replace a dozen AI tools: Bundled with a Chrome extension, apps, useful AI tools, and AI Docs on the way.","zhDetail":"Aymo AI 是一个面向团队和个人的一站式AI工作空间，集成了GPT、Claude、Gemini等45+顶级AI模型。用户无需切换多个工具，即可在安全环境中对比模型输出、上传文件对话、联网搜索、生成图像，并与团队成员协作。免费及付费方案可替代十几种AI工具，还附带Chrome扩展、移动应用和即将推出的AI文档功能。"},{"rank":6,"name":"PureBox.ai","zhName":"PureBox.ai","url":"https://www.producthunt.com/products/purebox-ai","desc":"Review-first AI cleanup for your real Gmail inbox.","zhDesc":"Review-first AI cleanup for your real Gmail inbox.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/13d2e711-0ab6-4e1f-a6dc-1abca88a2e94.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"PureBox.ai 是一款专为重度 Gmail 用户打造的邮件清理工具，它通过 AI 优先识别并保留真正重要的邮件，帮你自动过滤掉订阅、通知等垃圾信息，让收件箱回归纯净高效。"},{"rank":7,"name":"BrainFeed","zhName":"BrainFeed","url":"https://www.producthunt.com/products/brainfeed-scroll-better","desc":"A personalized learning feed that redirects your scroll","zhDesc":"A personalized learning feed that redirects your scroll","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b7a1d339-1e95-481c-b418-6ece18e8d22c.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=cr wagon. Introducing Rescript: edit videos by simply editing the transcript text. → Github [https://github.com/wassgha/rescript](https://github.com/wassgha/rescript) Runs fully in the browser: Local, free, offline and open source!","zhDetail":"Rescript 是一款面向视频创作者的免费开源工具，让你只需编辑转录文本就能直接修改视频。它完全在浏览器中本地运行，无需上传数据，支持离线使用，解决了传统视频编辑软件昂贵、复杂且依赖云端的问题。"},{"rank":6,"name":"14. Rivault","zhName":"Rivault","url":"https://www.producthunt.com/products/rivault","desc":"Safely provide and store data and context for AI agents","zhDesc":"Safely provide and store data and context for AI agents","tags":[],"upvotes":null,"icon":null,"detail":"Rivault lets you safely and securely provide AI agents and CUA data and context for tasks. Store data and context in a zero-knowledge vault, When an AI agent needs data (Passport No. or Credit Card details) to execute a task like booking a flight, Rivault sends you an auth request, you unlock data with Face ID/ Passkey and data is deterministically redacted after task completes. Rivault never gets access to your data by default.","zhDetail":"Rivault 是一款面向 AI 代理与 CUA（计算机使用代理）场景的安全数据保险库，帮助用户在 AI 执行任务（如预订航班）时安全提供护照号、信用卡等敏感信息。它采用零知识加密存储数据，当 AI 需要调用信息时，用户需通过 Face ID 或通行密钥授权解锁，任务完成后数据会被自动确定性脱敏。默认情况下，Rivault 本身也无法访问你的数据，确保隐私全程可控。"},{"rank":7,"name":"22. HeyZoku","zhName":"HeyZoku","url":"https://www.producthunt.com/products/heyzoku","desc":"Orchestrate an army of coding agents with your voice.","zhDesc":"Orchestrate an army of coding agents with your voice.","tags":[],"upvotes":null,"icon":null,"detail":"I am Priyanshu, an indie builder building this product HeyZoku. The world is changing very fast and in this new world voice is gonna be our primary way of interacting with the machines. We have to be at the forefront to make this reality and HeyZoku is my first contribution to it. HeyZoku helps you control all your terminal cli agents with your voice. We are using nvidia parakeet to make it work completely offline on your mac - so that it can work well without 和放松。所有功能本地运行，无需无障碍权限，尊重你的工作节奏。提供7天免费试用，之后一次性支付3.99美元即可获得终身更新。"},{"rank":10,"name":"3. Openbase","zhName":"Openbase","url":"https://www.producthunt.com/products/openbase-2","desc":"Manage your team of AI agents by voice, from anywhere","zhDesc":"Manage your team of AI agents by voice, from anywhere","tags":[],"upvotes":null,"icon":null,"detail":"Openbase lets you manage a team of AI coding agents by voice, from anywhere; no screen, no desk. AI agents can work async, but supervising them still pulls you back to a laptop. OpenBase fixes that. Dispatch tasks, steer agents mid-work, and approve changes just by talking. The agents write code, control your computer, open PRs, commit and push; you stay in control from your phone. Works across providers and syncs to your machine, so you pick up at your desk right where you left off.","zhDetail":"Openbase 让开发者能通过语音从任何地方管理一组 AI 编程代理，无需屏幕和办公桌。它解决了传统上监督异步工作的 AI 代理仍需回到笔记本电脑前的问题。你只需动口说话，就能分配任务、中途引导代理、批准代码变更，代理会替你写代码、操作电脑、提交 PR 并推送，而你全程通过手机掌控，并可在不同设备间无缝切换。"},{"rank":11,"name":"2. Lev8","zhName":"Lev8","url":"https://www.producthunt.com/products/lev8","desc":"Find, research, and reach the right people","zhDesc":"Find, research, and reach the right people","tags":[],"upvotes":null,"icon":null,"zhDetail":"Lev8 是一款面向销售和商务人士的线索挖掘与触达工具，帮助用户快速找到、调研并联系到目标客户。它通过智能搜索和自动化流程，省去手动筛选和联系的低效环节，让用户能更精准地触达潜在客户。"},{"rank":12,"name":"4. Nautis","zhName":"Nautis","url":"https://www.producthunt.com/products/nautis","desc":"The AI-native Operating System for founders.","zhDesc":"The AI-native Operating System for founders.","tags":[],"upvotes":null,"icon":null,"detail":"Nautis is the AI-native Operating System for founders. Manage fundraising, planning, finance, documents, meetings, CRM, hiring, and daily operations from one connected workspace. Unlike disconnected SaaS tools, every module shares one AI brain, giving you context-aware automation, smarter insights, and a Chief of Staff that understands your business—not just one app. Spend less time managing tools and more time building.","zhDetail":"Nautis 是为创业者打造的 AI 原生操作系统。它将融资、规划、财务、文档、会议、客户管理、招聘及日常运营整合在一个互联工作空间中，解决传统 SaaS 工具各自为政、信息割裂的问题。通过统一的 AI 大脑，系统能提供上下文感知的自动化、更智能的洞察，并充当理解你整个业务而非单一应用的“AI 参谋长”，让你减少管理工具的时间，专注于业务建设。"},{"rank":13,"name":"5. Migma AI","zhName":"Migma AI","url":"https://www.producthunt.com/products/migma-ai","desc":"AI runs your email marketing. Better with every send.","zhDesc":"AI runs your email marketing. Better with every send.","tags":[],"upvotes":null,"icon":null,"detail":"Migma creates full campaigns before you ask. It understands your goals and events, creates every email, personalizes and localizes it, and renders consistently across inboxes. It handles sending, preferences and compliance, then learns what drives revenue.","zhDetail":"Migma AI 面向营销团队，能在你提出需求前自动生成完整的邮件营销活动。它理解你的目标和活动事件，创建每封邮件并进行个性化与本地化处理，确保在不同收件箱中一致呈现。同时，它自动处理发送、偏好设置与合规要求，并通过学习不断优化提升营收效果。"},{"rank":14,"name":"1. Fundraisly","zhName":"Fundraisly","url":"https://www.producthunt.com/products/fundraisly","desc":"AI fundraising agent that finds investors and books meetings","zhDesc":"AI fundraising agent that finds investors and books meetings","tags":[],"upvotes":null,"icon":null,"detail":"Fundraisly: AI-native fundraising system. It built the most complete investors database of 300k+ and analyzes millions of deals to identify the investors actively backing companies in your space, stage, and geography. It maps warm paths to them from your own network and then covers the rest with targeted outreach. The result: 10-50 qualified investor meetings on your calendar in 90 days. Built by founders who raised over $1B.","zhDetail":"Fundraisly 是一款面向创业者的 AI 原生融资系统。它拥有超过 30 万投资人的数据库，并分析数百万笔交易，帮你精准锁定那些在你所在领域、阶段和地区活跃的投资人。系统还能从你的人脉中绘制出“温暖路径”，并对剩余目标进行定向触达，最终在 90 天内为你安排 10 到 50 场高质量的投资人会议。"},{"rank":15,"name":"2. Goldfish","zhName":"Goldfish","url":"https://www.producthunt.com/products/goldfish-early-access","desc":"Press Option. It knows your work and replies like you","zhDesc":"Press Option. It knows your work and replies like you","tags":[],"upvotes":null,"icon":null,"detail":"Most AI tools make you explain the context before they can help. Goldfish already has it. It privately remembers what you’ve been working on across your Mac, then helps you write better from any app. Press Option in a text field to draft replies, summarize threads, rewrite sentences, or recall important details from your recent work without copying, pasting, or re-explaining the whole backstory.","zhDetail":"Goldfish 是一款面向 Mac 用户的 AI 写作助手，它解决了反复向 AI 工具解释上下文背景的痛点。通过私密记录你在 Mac 上的工作内容，你只需在任意文本框中按下 Option 键，即可直接起草回复、总结线程、改写句子或回忆近期重要信息，无需复制粘贴或重复说明前因后果。"},{"rank":16,"name":"4. Bond","zhName":"Bond","url":"https://www.producthunt.com/products/bond-12","desc":"The AI to-do list that does itself","zhDesc":"The AI to-do list that does itself","tags":[],"upvotes":null,"icon":null,"detail":"Bond is an AI Chief of Staff for executives. It connects to your tools, learns how your company works, and turns scattered tasks into a self-managing to-do list that always knows what you need to do next. You can ask Bond to prepare you for your next meeting, draft a follow-up, send an email, create action items, identify blockers, surface risks, or delegate tasks to team members.","zhDetail":"Bond 是一款专为企业高管设计的 AI 行政助手。它能连接你的工作工具，学习公司的运作方式，将零散的任务转化为自动管理的待办清单，始终知道你需要下一步做什么。你可以让 Bond 为你准备下一次会议、起草跟进邮件、创建行动项、识别阻碍与风险，或直接向团队成员委派任务。"}],"weekly":[{"rank":1,"name":"Fuzzy AI","zhName":"Fuzzy AI","url":"https://www.producthunt.com/products/fuzzy-ai-2","desc":"We warm your prospects before reaching out","zhDesc":"We warm your prospects before reaching out","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2ee5bc35-54be-4e1c-ac23-b791bb72f837.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Fuzzy AI 是一款面向销售团队的智能预热工具，帮助你在联系潜在客户之前先建立好感与信任。它通过自动化、个性化的互动策略，在正式触达前提升客户对品牌的认知和兴趣，从而提高转化率。"},{"rank":2,"name":"Lev8","zhName":"Lev8","url":"https://www.producthunt.com/products/l let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
