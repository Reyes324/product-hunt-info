<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年7月27日</span>
        <span class="updated">更新于 05:45</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-07-28","updatedAt":"05:45","yesterday":[{"rank":1,"name":"Adomate","zhName":"Adomate","url":"https://www.producthunt.com/products/adomate","desc":"Turn data into winning ads. At scale.","zhDesc":"Turn data into winning ads. At scale.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0b1dc26d-34c2-4318-b041-3b690a4f5a48.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"With Adomate you create ads from data, at scale. Take data from your Meta ad account, the ad library and reviews from Trustpilot and Amazon. Build creative research workflows that create branded ad concepts, the way you want. Fully traceable to their original data trigger, no blackbox.","zhDetail":"Adomate 是一款面向广告投放团队与营销人员的智能广告生成工具，能够从 Meta 广告账户、广告库以及 Trustpilot、Amazon 的用户评价中提取数据，自动规模化创建品牌广告创意。它支持构建可追溯的创意研究工作流，让每个广告概念都清晰关联原始数据来源，告别黑箱操作。"},{"rank":2,"name":"Artifacts by Databox","zhName":"Artifacts by Databox","url":"https://www.producthunt.com/products/databox","desc":"Ask your AI Analyst and get back a ready-to-share report","zhDesc":"Ask your AI Analyst and get back a ready-to-share report","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/4d622638-2418-4c44-9591-b650270d3c26.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Databox is an AI-powered business intelligence and analytics platform for teams that need clear, trusted answers fast. It offers the best of BI, without the complicated setup, steep price, or long learning curve. It provides a blend of powerful, but easy-to-use, features, from preparing datasets and creating the custom metrics your company needs to track, to building beautiful dashboards, customizing your reporting, and receiving AI-powered insights.","zhDetail":"Artifacts by Databox 是一款面向团队的人工智能商业智能与分析平台，帮助用户快速获得清晰、可信的业务答案。它免去了传统 BI 工具复杂的设置、高昂的价格和漫长的学习曲线，让用户能轻松完成数据准备、自定义指标、构建美观仪表盘和生成 AI 洞察，从而高效解决数据分析和报告难题。"},{"rank":3,"name":"Claude Opus 5","zhName":"Claude Opus 5","url":"https://www.producthunt.com/products/claude","desc":"Near-Fable 5 intelligence at half the price","zhDesc":"Near-Fable 5 intelligence at half the price","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a829d914-18d6-43bd-b963-7cd5d7f5b280.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"We're an AI research company that builds reliable, interpretable, and steerable AI systems. Our first product is Claude, an AI assistant for tasks at any scale.","zhDetail":"Claude Opus 5 是一款面向个人及企业用户的高性能AI助手，由专注于构建可靠、可解释、可操控AI系统的研究公司打造。它能帮助用户高效处理从简单问答到复杂任务的各种规模的工作，通过深度理解与精准执行来提升生产力。"},{"rank":4,"name":"Webhound","zhName":"Webhound","url":"https://www.producthunt.com/products/webhound","desc":"A research engine for your agent","zhDesc":"A research engine for your agent","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/11ac2f49-e69f-4126-b5a7-e8d2b33c6824.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Research has no natural finish line. An agent can spend ten minutes or ten hours on the same question, and both answers can look finished. Webhound lets you choose how much work the question deserves. Give it a question and a dollar budget. It follows leads and checks weak claims until the budget is consumed, then returns a cited report or sourced dataset with the sources and working documents behind it. Run Webhound yourself or call it from your agent through MCP or the API.","zhDetail":"Webhound 是一款面向研究人员和 AI 代理的深度调研工具。它解决了传统搜索中“不知道投入多少时间才够”的问题——你只需设定一个预算金额，它就会自动追踪线索、核查薄弱主张，直到预算用完，最终交付一份带有引用来源的完整报告或数据集。你既可以亲自使用，也可以通过 MCP 或 API 将其集成到自己的代理中。"},{"rank":5,"name":"Robynn AI","zhName":"Robynn AI","url":"https://www.producthunt.com/products/robynn-ai-self-improving-websites","desc":"Websites that improve and heal with self-learning","zhDesc":"Websites that improve and heal with self-learning","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/c8c7132c-3f7c-4d42-9bed-248ff97223e3.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Big companies solve this with people: web engineers, agencies, SEO retainers. Small teams get a to-do list that never shrinks. Robynn is that engineering muscle for every marketing team. Connect your existing site (no rebuild, no migration), get a continuous diagnosis against your brand and ICP, point at anything and describe the change in plain English. Agents rewrite and stage it; nothing goes live until you approve. Then we measure what moved in GA — wins get reinforced, regressions roll back.","zhDetail":"Robynn AI 是为中小型营销团队打造的网站优化引擎。它无需重建或迁移现有网站，即可持续诊断品牌与理想客户画像（ICP）的匹配度，并支持用户用自然语言描述修改需求。AI 代理会自动重写并暂存更改，经你批准后才上线，同时通过 Google Analytics 追踪效果，自动强化有效改动、回滚不利变化。"},{"rank":6,"name":"superfile","zhName":"superfile","url":"https://www.producthunt.com/products/superfile","desc":"A modern, visual file manager for the terminal","zhDesc":"A modern, visual file manager for the terminal","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/4e37c75c-ef4c-48fe-aec7-c92ecc658eac.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"the multi-panel + live preview combo is the part I'd actually use daily over plain ls/cd. curious how it holds up in two scenarios that tend to break TUI file managers: a directory with tens of thousands of files (does listing and search stay snappy or does it need to index first), and running it over a laggy SSH connection where redrawing a rich UI can get janky compared to a bare-bones tool. those are the two things that'd decide whether this replaces my terminal workflow or just becomes a local-only nice-to-have","zhDetail":"superfile 是一款面向终端重度用户的 TUI 文件管理器，解决了传统 `ls`/`cd` 在浏览和管理大量文件时效率低下的问题。它通过多面板布局与实时预览的组合，让用户无需离开终端即可快速浏览、搜索和操作文件，尤其适合处理数万文件的目录或通过 SSH 远程管理服务器。"},{"rank":7,"name":"Grok 4.5","zhName":"Grok 4.5","url":"https://www.producthunt.com/products/grok","desc":"SpaceXAI's model for coding, agentic tasks & knowledge work","zhDesc":"SpaceXAI's model for coding, agentic tasks & knowledge work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a1a82d64-c2aa-496b-b79b-ad94dddf113e.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Grok 4.5 was trained on datasets spanning knowledge in coding, science, engineering, and math. With both intelligent and efficient reasoning, Grok 4.5 excels at real engineering tasks and exceeds comparable leading models at these tasks.","zhDetail":"Grok 4.5 面向程序员、科研人员和工程师，通过涵盖编程、科学、工程与数学领域的大规模数据集训练，解决了复杂工程任务中推理效率与准确性不足的问题。它凭借智能且高效的推理能力，在真实工程场景中表现优于同类领先模型。"},{"rank":8,"name":"Estera","zhName":"Estera","url":"https://www.producthunt.com/products/estera","desc":"AI Receptionist that Answers Calls & WhatsApp 24/7","zhDesc":"AI Receptionist that Answers Calls & WhatsApp 24/7","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/cab423e8-40e9-4228-9979-6882398e9e86.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Meet Estera, the AI receptionist built for real estate, hotels, restaurants, and more. AI agent receptionist that answers every phone call and WhatsApp message in under 5 seconds, qualifies leads, books appointments, and follows up automatically. Built for real estate, hotels, restaurants, dental clinics, and more. Create your own AI agent assistant in under 3 minutes.","zhDetail":"Estera 是一款专为房地产、酒店、餐厅等服务业打造的AI前台接待员。它能在5秒内接听每一通电话和WhatsApp消息，自动筛选潜在客户、预约并跟进，帮助商家不错过任何商机。你只需不到3分钟就能创建自己的AI助手，大幅提升客户响应效率。"},{"rank":9,"name":"Rescript","zhName":"Rescript","url":"https://www.producthunt.com/products/rescript-edit-videos-like-you-edit-text","desc":"A free, open source, Descript alternative. Runs in-browser.","zhDesc":"A free, open source, Descript alternative. Runs in-browser.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/8d882ced-4ff2-4de2-bb29-7d56f687188a.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"love that this is a weekend project and fully local, that's a rare combo for video editing tools. curious how it holds up on longer source files though, like an hour long podcast recording. is the transcription and scrubbing still snappy on a mid-range laptop at that length, or does the in-browser part start to strain once the timeline gets long. either way nice work shipping this solo.","zhDetail":"Rescript 是一款面向视频创作者的本地化视频编辑工具，无需上传文件即可在浏览器中完成剪辑。它解决了视频编辑中常见的隐私和延迟问题，通过本地转录和智能片段筛选功能，让用户快速定位并剪辑出精彩片段。"},{"rank":10,"name":"AI YC interview with Gstack agents","zhName":"AI YC interview with Gstack agents","url":"https://www.producthunt.com/products/gstack-joins-your-meeting","desc":"AI specialists that join your Google Meet and gives feedback","zhDesc":"AI specialists that join your Google Meet and gives feedback","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/fe67cb9d-ec32-49da-bf1b-88c294f4adc3.gif?auto=compress&codec=mozjpeg&cs=strip&dpr=2&fit=max&fm=webp&frame=1&h=48&w=48","detail":"Garry Tan's open-sourced gstack specialists — CEO, CSO, QA Lead, a YC-office-hours partner and 15 more — join your real Google Meet as voice bots with 3D avatars. They open in-persona, take turns, critique your shared screen out loud, and drop notes in chat. Free, MIT, and the brain is your own coding-agent session. Built on AgentCall.","zhDetail":"这是一款面向YC申请团队和创业者的AI面试模拟工具。它通过将Garry Tan开源的Gstack专家角色（包括CEO、CSO、QA负责人、YC办公时间合伙人等15+角色）以3D语音机器人形式接入你的真实Google Meet，模拟YC面试场景。这些AI角色会轮流发言、实时点评你的共享屏幕，并在聊天中记录反馈，帮助你低成本、高效率地打磨路演和答辩表现。"},{"rank":11,"name":"localskills.sh","zhName":"localskills.sh","url":"https://www.producthunt.com/products/localskills-sh","desc":"AI Skill & MCP server management for teams & enterprises","zhDesc":"AI Skill & MCP server management for teams & enterprises","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/23ea6ba3-76bc-4572-aa48-2282309569db.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Drift is at least detectable. Two people compare notes and find different versions. A skill that fails to load at all, or loads a version nobody expected, produces no signal whatsoever. A missing dependency throws. A missing skill just means the agent answers without the rules that were meant to constrain it, and that answer looks completely normal. I keep my own agent rules in one global file with a stack of skills beside it, and the runs that cost me were never the ones that errored. They were the ones where a rule sitting right there on disk plainly did not reach the model, and nothing in the output said so.","zhDetail":"localskills.sh 是一款面向 AI 智能体开发者的本地技能管理工具，解决了因技能文件加载失败或版本不一致而导致智能体在无约束状态下输出错误结果的问题。它通过将智能体规则集中存储在一个全局文件中，并附带可堆叠的技能栈，确保所有规则都能可靠地传递给模型，避免静默失败带来的隐蔽风险。"},{"rank":12,"name":"Comms","zhName":"Comms","url":"https://www.producthunt.com/products/comms-ai-agents-inside-imessage","desc":"Launch iMessage agents in seconds","zhDesc":"Launch iMessage agents in seconds","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/f4575268-640a-4da0-8479-38346d5ee4e2.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Getting an iMessage line for your business used to mean sales calls, carrier paperwork, weeks of waiting, and $225+ a month before your first text. Comms puts a live agent on a real iMessage line in about 30 seconds. Describe it in plain English or make one API call. It handles support, bookings, onboarding, and payments inside the thread people actually read. Free to start with 3,000 messages a month, then a flat $50.","zhDetail":"Comms 为你的企业快速开通一条真正的 iMessage 客服线路，无需繁琐的销售沟通、运营商审批和数周等待。你只需用日常语言描述需求或调用一次 API，就能让真人客服在 iMessage 对话中处理客户支持、预约、引导和支付。每月前 3,000 条消息免费，之后统一收取 50 美元。"},{"rank":13,"name":"Notate","zhName":"Notate","url":"https://www.producthunt.com/products/notate-2","desc":"Annotate anything for humans and their agents","zhDesc":"Annotate anything for humans and their agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0dc9dfc9-74a3-49ad-8732-4a2dedbc2b14.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Notate 是一款面向人类用户及其 AI 代理的通用标注工具，帮助用户在任何内容上添加注释和标记。它解决了信息整理与协作中标注分散、格式不统一的问题，通过简洁的界面让用户和 AI 都能高效地理解与处理标注内容。"},{"rank":14,"name":"Rivault","zhName":"Rivault","url":"https://www.producthunt.com/products/rivault","desc":"Approve AI agent data access with Face ID","zhDesc":"Approve AI agent data access with Face ID","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a2c43946-6a29-4fbe-9d16-c30a01099a32.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Rivault 是一款面向 AI 代理用户的安全工具，解决 AI 代理在访问用户敏感数据时缺乏授权控制的问题。它通过 Face ID 生物识别验证，让用户能够实时审批或拒绝 AI 代理的数据访问请求，确保数据安全与隐私可控。"},{"rank":15,"name":"Tackly","zhName":"Tackly","url":"https://www.producthunt.com/products/tackly","desc":"Map your thoughts in real time with AI.","zhDesc":"Map your thoughts in real time with AI.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a58dfdf1-47f4-4a14-9c30-44cb8a9bb0af.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Tackly 是一款面向创意工作者和知识管理者的实时思维导图工具，利用 AI 帮助用户在头脑风暴或信息整理时快速将零散想法转化为结构化的可视化图谱。你只需输入关键词或短句，AI 便会自动生成关联节点并动态更新地图，从而提升思考效率与逻辑清晰度。"},{"rank":16,"name":"FindDiskKiller","zhName":"FindDiskKiller","url":"https://www.producthunt.com/products/finddiskkiller","desc":"See which apps are hammering your Mac's disk","zhDesc":"See which apps are hammering your Mac's disk","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/83486414-58f8-433f-95ce-35b5965d825e.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"面向Mac用户，帮助快速定位哪些应用正在大量读写磁盘、导致系统卡顿或发热。通过直观显示各应用的磁盘占用与活动情况，让你一键揪出“磁盘杀手”，从而关闭或卸载问题应用，恢复电脑流畅运行。"},{"rank":17,"name":"Edit Mind × Strava","zhName":"Edit Mind × Strava","url":"https://www.producthunt.com/products/edit-mind-3","desc":"Every clip matched to the Strava activity it's from","zhDesc":"Every clip matched to the Strava activity it's from","tags": name":"13. Notate","zhName":"Notate","url":"https://www.producthunt.com/products/notate-2","desc":"Annotate anything for humans and their agents","zhDesc":"Annotate anything for humans and their agents","tags":[],"upvotes":null,"icon":null,"detail":"One limit I'm keeping on purpose: no replay guarantees. Your fix invalidates the recording by design — replaying old clicks against a moved button clicks the wrong thing — so Notate will never pretend to reproduce app state. It records what happened, verifies the second capture matches the first's geometry and rate, and tells you exactly which frames diverge. Getting the app back to the moment stays with you or your agent — but with the trace in hand, that's following instructions rather than remembering. And your bar is the one I'm building to: not CI-grade, just decisively cheaper than eyeballing.","zhDetail":"Notate 是一款面向开发者和测试人员的录制回放工具，专为解决 UI 状态难以精确复现的问题而设计。它通过记录用户操作并验证两次录制的几何与速率是否一致，精准定位差异帧，从而避免因界面变化导致的回放失效。相比肉眼排查，Notate 大幅降低了复现 Bug 的成本，让开发者或 AI 代理能依据录制轨迹而非记忆来还原应用状态。"},{"rank":6,"name":"21. HeyZoku","zhName":"HeyZoku","url":"https://www.producthunt.com/products/heyzoku","desc":"Orchestrate an army of coding agents with your voice.","zhDesc":"Orchestrate an army of coding agents with your voice.","tags":[],"upvotes":null,"icon":null,"detail":"I am Priyanshu, an indie builder building this product HeyZoku. The world is changing very fast and in this new world voice is gonna be our primary way of interacting with the machines. We have to be at the forefront to make this reality and HeyZoku is my first contribution to it. HeyZoku helps you control all your terminal cli agents with your voice. We are using nvidia parakeet to make it work completely offline on your mac - so that it can work well without any monthly subscriptions. Open to any kind of questions or feedback and thank you for your support. An upvote would mean a lot!","zhDetail":"HeyZoku 是一款面向开发者和技术用户的语音控制工具，旨在让你通过语音直接操控终端中的 CLI 代理，无需手动输入命令。它利用 NVIDIA Parakeet 模型在 Mac 上完全离线运行，无需任何月费订阅，从而提升工作效率并保护隐私。"},{"rank":7,"name":"24. Tunio","zhName":"Tunio","url":"https://www.producthunt.com/products/tunio","desc":"AI Music operations platform for venues","zhDesc":"AI Music operations platform for venues","tags":[],"upvotes":null,"icon":null,"zhDetail":"Tunio 是一款面向场馆运营方的 AI 音乐管理平台，帮助酒吧、餐厅、健身房等场所自动规划与播放符合氛围的曲目，解决传统选歌耗时、版权复杂、音乐与场景不匹配的问题。通过智能算法分析客流时段与风格偏好，Tunio 能实时调整播放列表，让音乐自动适配不同营业场景。"},{"rank":8,"name":"1. TouchGrass","zhName":"TouchGrass","url":"https://www.producthunt.com/products/touchgrass-2","desc":"Context-aware break reminders without invasive permissions","zhDesc":"Context-aware break reminders without invasive permissions","tags":[],"upvotes":null,"icon":null,"detail":"TouchGrass is a context-aware break reminder built for macOS. Most break reminders only know one thing: time. TouchGrass waits through meetings, calls, media playback and screen recordings, counts time away from your Mac as a completed break, and reminds you to blink, improve your posture and rest after long typing sessions. Everything runs locally, never asks for Accessibility permission, and respects your workflow. 7 day free trial, then a one time purchase of $3.99 with lifetime updates.","zhDetail":"TouchGrass 是一款专为 macOS 设计的智能休息提醒工具。它不同于传统仅依赖时间的提醒器，能智能识别会议、通话、媒体播放和屏幕录制等场景，自动跳过干扰时段，并将你离开电脑的时间算作有效休息。同时，它还会提醒你眨眼、改善坐姿，并在长时间打字后建议放松，所有功能本地运行，无需无障碍权限，尊重你的工作节奏。"},{"rank":9,"name":"3. Openbase","zhName":"3. Openbase","url":"https://www.producthunt.com/products/openbase-2","desc":"Manage your team of AI agents by voice, from anywhere","zhDesc":"Manage your team of AI agents by voice, from anywhere","tags":[],"upvotes":null,"icon":null,"detail":"Openbase lets you manage a team of AI coding agents by voice, from anywhere; no screen, no desk. AI agents can work async, but supervising them still pulls you back to a laptop. OpenBase fixes that. Dispatch tasks, steer agents mid-work, and approve changes just by talking. The agents write code, control your computer, op let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
