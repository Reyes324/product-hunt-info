<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年7月27日</span>
        <span class="updated">更新于 10:39</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-07-28","updatedAt":"10:39","yesterday":[{"rank":1,"name":"Adomate","zhName":"Adomate","url":"https://www.producthunt.com/products/adomate","desc":"Turn data into winning ads. At scale.","zhDesc":"Turn data into winning ads. At scale.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0b1dc26d-34c2-4318-b041-3b690a4f5a48.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"With Adomate you create ads from data, at scale. Take data from your Meta ad account, the ad library and reviews from Trustpilot and Amazon. Build creative research workflows that create branded ad concepts, the way you want. Fully traceable to their original data trigger, no blackbox.","zhDetail":"Adomate 是一款面向广告投放人员与营销团队的数据驱动广告创意工具。它能从 Meta 广告账户、广告库以及 Trustpilot、Amazon 的用户评价中提取数据，自动生成品牌广告概念并支持规模化创作。所有创意均保留原始数据来源，过程透明可追溯，告别黑箱操作。"},{"rank":2,"name":"Artifacts by Databox","zhName":"Artifacts by Databox","url":"https://www.producthunt.com/products/databox","desc":"Ask your AI Analyst and get back a ready-to-share report","zhDesc":"Ask your AI Analyst and get back a ready-to-share report","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/4d622638-2418-4c44-9591-b650270d3c26.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Databox is an AI-powered business intelligence and analytics platform for teams that need clear, trusted answers fast. It offers the best of BI, without the complicated setup, steep price, or long learning curve. It provides a blend of powerful, but easy-to-use, features, from preparing datasets and creating the custom metrics your company needs to track, to building beautiful dashboards, customizing your reporting, and receiving AI-powered insights.","zhDetail":"Artifacts by Databox 是一款面向团队的人工智能商业智能与分析平台，专为需要快速获得清晰、可信答案的用户设计。它免去了复杂的设置、高昂的价格和漫长的学习曲线，让用户能轻松完成从数据集准备、自定义指标创建，到构建美观仪表盘、定制报告以及获取AI洞察的全流程。"},{"rank":3,"name":"Claude Opus 5","zhName":"Claude Opus 5","url":"https://www.producthunt.com/products/claude","desc":"Near-Fable 5 intelligence at half the price","zhDesc":"Near-Fable 5 intelligence at half the price","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a829d914-18d6-43bd-b963-7cd5d7f5b280.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"To get the most out of this model, here's the [new prompting guide](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5):","zhDetail":"Claude Opus 5 是面向开发者和高级用户的下一代大语言模型，旨在解决复杂推理、长文本理解和精准指令执行中的性能瓶颈。通过全新的提示工程指南，它帮助用户更高效地设计提示词，从而充分发挥模型在代码生成、分析推理和多步骤任务中的潜力。"},{"rank":4,"name":"Webhound","zhName":"Webhound","url":"https://www.producthunt.com/products/webhound","desc":"A research engine for your agent","zhDesc":"A research engine for your agent","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/11ac2f49-e69f-4126-b5a7-e8d2b33c6824.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Research has no natural finish line. An agent can spend ten minutes or ten hours on the same question, and both answers can look finished. Webhound lets you choose how much work the question deserves. Give it a question and a dollar budget. It follows leads and checks weak claims until the budget is consumed, then returns a cited report or sourced dataset with the sources and working documents behind it. Run Webhound yourself or call it from your agent through MCP or the API.","zhDetail":"Webhound 是一款面向研究人员和 AI 代理的深度调研工具，解决传统搜索无法控制投入成本与结果深度的问题。你只需提出一个问题并设定预算金额，它就会自动追踪线索、核查薄弱论断，直到预算耗尽，最终返回一份附带来源引用、原始工作文档的完整报告或数据集。你既可以亲自使用，也可以通过 MCP 或 API 将其集成到自己的代理中。"},{"rank":5,"name":"Robynn AI","zhName":"Robynn AI","url":"https://www.producthunt.com/products/robynn-ai-self-improving-websites","desc":"Websites that improve and heal with self-learning","zhDesc":"Websites that improve and heal with self-learning","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/c8c7132c-3f7c-4d42-9bed-248ff97223e3.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Big companies solve this with people: web engineers, agencies, SEO retainers. Small teams get a to-do list that never shrinks. Robynn is that engineering muscle for every marketing team. Connect your existing site (no rebuild, no migration), get a continuous diagnosis against your brand and ICP, point at anything and describe the change in plain English. Agents rewrite and stage it; nothing goes live until you approve. Then we measure what moved in GA — wins get reinforced, regressions roll back.","zhDetail":"Robynn AI 是为中小型营销团队打造的网站优化引擎。它无需重建或迁移网站，即可持续诊断网站是否符合品牌定位与理想客户画像（ICP）；用户只需用日常语言描述修改需求，AI 代理便会自动重写并生成预览，待你确认后才上线。同时，它能追踪 Google Analytics 中的效果变化，自动强化有效改动、回滚不利调整。"},{"rank":6,"name":"superfile","zhName":"superfile","url":"https://www.producthunt.com/products/superfile","desc":"A modern, visual file manager for the terminal","zhDesc":"A modern, visual file manager for the terminal","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/4e37c75c-ef4c-48fe-aec7-c92ecc658eac.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"the multi-panel + live preview combo is the part I'd actually use daily over plain ls/cd. curious how it holds up in two scenarios that tend to break TUI file managers: a directory with tens of thousands of files (does listing and search stay snappy or does it need to index first), and running it over a laggy SSH connection where redrawing a rich UI can get janky compared to a bare-bones tool. those are the two things that'd decide whether this replaces my terminal workflow or just becomes a local-only nice-to-have","zhDetail":"superfile 是一款面向终端重度用户的文件管理器，通过多面板与实时预览的组合，解决了传统命令行下文件浏览效率低、信息不直观的问题。它让你在终端中就能像图形界面一样快速切换目录、预览文件内容，尤其适合需要高频操作文件系统的开发者或运维人员。"},{"rank":7,"name":"Grok 4.5","zhName":"Grok 4.5","url":"https://www.producthunt.com/products/grok","desc":"SpaceXAI's model for coding, agentic tasks & knowledge work","zhDesc":"SpaceXAI's model for coding, agentic tasks & knowledge work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a1a82d64-c2aa-496b-b79b-ad94dddf113e.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Grok 4.5 was trained on datasets spanning knowledge in coding, science, engineering, and math. With both intelligent and efficient reasoning, Grok 4.5 excels at real engineering tasks and exceeds comparable leading models at these tasks.","zhDetail":"Grok 4.5 面向需要处理编程、科学、工程和数学等复杂任务的工程师与研究人员。它通过覆盖多领域知识的数据集训练，结合智能高效的推理能力，在真实工程任务上表现优异，超越了同类领先模型。"},{"rank":8,"name":"Rescript","zhName":"Rescript","url":"https://www.producthunt.com/products/rescript-edit-videos-like-you-edit-text","desc":"A free, open source, Descript alternative. Runs in-browser.","zhDesc":"A free, open source, Descript alternative. Runs in-browser.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/8d882ced-4ff2-4de2-bb29-7d56f687188a.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"🎬 Open source, transcript-based video editor that lives in the browser. Edit videos by simply editing the transcript text. Runs fully in the browser: Local, free and offline!","zhDetail":"Rescript 是一款开源的、基于转录文本的视频编辑器，完全运行在浏览器中。它面向需要快速剪辑视频的用户，通过直接编辑视频的转录文字来同步修改视频内容，无需专业剪辑软件。所有处理都在本地完成，免费且支持离线使用。"},{"rank":9,"name":"Estera","zhName":"Estera","url":"https://www.producthunt.com/products/estera","desc":"AI Receptionist that Answers Calls & WhatsApp 24/7","zhDesc":"AI Receptionist that Answers Calls & WhatsApp 24/7","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/cab423e8-40e9-4228-9979-6882398e9e86.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Meet Estera, the AI receptionist built for real estate, hotels, restaurants, and more. AI agent receptionist that answers every phone call and WhatsApp message in under 5 seconds, qualifies leads, books appointments, and follows up automatically. Built for real estate, hotels, restaurants, dental clinics, and more. Create your own AI agent assistant in under 3 minutes.","zhDetail":"Estera 是一款专为房地产、酒店、餐厅等服务业打造的 AI 前台接待员。它能在 5 秒内接听每通电话和 WhatsApp 消息，自动筛选潜在客户、预约并跟进，帮助商家不错过任何商机。你只需不到 3 分钟即可创建自己的 AI 助手。"},{"rank":10,"name":"AI YC interview with Gstack agents","zhName":"AI YC interview with Gstack agents","url":"https://www.producthunt.com/products/gstack-joins-your-meeting","desc":"AI specialists that join your Google Meet and gives feedback","zhDesc":"AI specialists that join your Google Meet and gives feedback","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/fe67cb9d-ec32-49da-bf1b-88c294f4adc3.gif?auto=compress&codec=mozjpeg&cs=strip&dpr=2&fit=max&fm=webp&frame=1&h=48&w=48","detail":"Realtime streaming with in-memory only and discard-on-call-end is the right call for a privacy-first tool. The in-memory model means the latency question I had mostly answers itself: if chunks stream live, a well-implemented custom agent can respond in near-real-time without waiting for a full parse. Practically useful to know. The heyski.io path is interesting too, fully on-device speech plus local Claude Code session closes the last external hop. One follow-up: for the shared-brain case where multiple gstack personas are in the same call, does the transcript stream to all agents simultaneously, or does one agent act as a relay that forwards relevant chunks to the others?","zhDetail":"这是一款面向创业者和产品团队的隐私优先的实时面试模拟工具。它通过纯内存流式处理技术，在通话结束后立即丢弃所有数据，解决了用户对AI面试工具隐私泄露的担忧。用户可以与多个Gstack智能体同时进行实时对话，每个智能体都能独立处理语音流，实现接近零延迟的交互体验。"},{"rank":11,"name":"localskills.sh","zhName":"localskills.sh","url":"https://www.producthunt.com/products/localskills-sh","desc":"AI Skill & MCP server management for teams & enterprises","zhDesc":"AI Skill & MCP server management for teams & enterprises","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/23ea6ba3-76bc-4572-aa48-2282309569db.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Drift is at least detectable. Two people compare notes and find different versions. A skill that fails to load at all, or loads a version nobody expected, produces no signal whatsoever. A missing dependency throws. A missing skill just means the agent answers without the rules that were meant to constrain it, and that answer looks completely normal. I keep my own agent rules in one global file with a stack of skills beside it, and the runs that cost me were never the ones that errored. They were the ones where a rule sitting right there on disk plainly did not reach the model, and nothing in the output said so.","zhDetail":"面向 AI 代理开发者和高级用户，解决本地技能文件未能被模型正确加载或执行时无法察觉的问题。通过提供一个全局规则文件与技能栈，确保所有本地技能在运行时被可靠调用，避免因技能缺失导致模型在无约束下生成看似正常但实际错误的回答。"},{"rank":12,"name":"Comms","zhName":"Comms","url":"https://www.producthunt.com/products/comms-ai-agents-inside-imessage","desc":"Launch iMessage agents in seconds","zhDesc":"Launch iMessage agents in seconds","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/f4575268-640a-4da0-8479-38346d5ee4e2.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Comms 是一款面向开发者和企业的工具，让你能在几秒钟内快速部署 iMessage 智能代理。它解决了传统短信服务缺乏自动化与智能交互的问题，通过直接接入 iMessage 通道，帮助用户实现消息自动回复、客户沟通等场景的即时落地。"},{"rank":13,"name":"Notate","zhName":"Notate","url":"https://www.producthunt.com/products/notate-2","desc":"Annotate anything for humans and their agents","zhDesc":"Annotate anything for humans and their agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0dc9dfc9-74a3-49ad-8732-4a2dedbc2b14.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"One limit I'm keeping on purpose: no replay guarantees. Your fix invalidates the recording by design — replaying old clicks against a moved button clicks the wrong thing — so Notate will never pretend to reproduce app state. It records what happened, verifies the second capture matches the first's geometry and rate, and tells you exactly which frames diverge. Getting the app back to the moment stays with you or your agent — but with the trace in hand, that's following instructions rather than remembering. And your bar is the one I'm building to: not CI-grade, just decisively cheaper than eyeballing.","zhDetail":"Notate 是一款面向开发者和测试人员的录制回放工具，旨在解决传统录制回放中因界面变化导致的回放失效问题。它通过记录用户操作的真实轨迹，并验证两次录制的几何与速率是否匹配，精准定位帧差异，从而让开发者或AI代理能依据轨迹而非记忆重现应用状态，大幅降低人工肉眼排查的成本。"},{"rank":14,"name":"Rivault","zhName":"Rivault","url":"https://www.producthunt.com/products/rivault","desc":"Approve AI agent data access with Face ID","zhDesc":"Approve AI agent data access with Face ID","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a2c43946-6a29-4fbe-9d16-c30a01099a32.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Rivault 是一款面向 AI 代理用户的安全工具，通过 Face ID 验证来审批 AI 代理的数据访问请求，防止敏感信息被未经授权调用。它解决了 AI 代理在自动执行任务时可能带来的隐私泄露风险，让用户在不牺牲便利性的前提下掌控数据权限。"},{"rank":15,"name":"FindDiskKiller","zhName":"FindDiskKiller","url":"https://www.producthunt.com/products/finddiskkiller","desc":"See which apps are hammering your Mac's disk","zhDesc":"See which apps are hammering your Mac's disk","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/83486414-58f8-433f-95ce-35b5965d825e.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"面向Mac用户，帮助快速定位哪些应用正在大量读写磁盘、导致系统卡顿或硬盘损耗。通过直观展示各应用的磁盘活动数据，让你一眼揪出“磁盘杀手”，从而关闭或优化对应应用。"},{"rank":16,"name":"Tackly","zhName":"Tackly","url":"https://www.producthunt.com/products/tackly","desc":"Map your thoughts in real time with AI.","zhDesc":"Map your thoughts in real time with AI.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a58dfdf1-47f4-4a14-9c30-44cb8a9bb0af.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"the sub-80ms rendering target is a smart thing to optimize for specifically, since with a thinking tool any visible lag between saying something and seeing it land breaks the whole point of thinking out loud. question about the 20 nodes - is that a fixed taxonomy of note types, or an actual cap on distinct thought clusters per session? if it's the latter, what happens on a long rambling session that would naturally produce more than 20, does it merge similar ones or just get more selective about what makes the cut","zhDetail":"Tackly 是一款面向深度思考者的思维工具，专为需要快速记录和整理灵感的人群设计。它通过将渲染延迟控制在80毫秒以内，消除了“边想边写”时的视觉卡顿感，让思维流动更自然。同时，它采用20个独立思维簇的会话结构，帮助用户自动归类并聚焦关键想法，避免长时漫谈中信息过载。"},{"rank":17,"name":"Cynative Security Research Agent","zhName":"Cynative Security Research Agent","url":"https://www.producthunt.com/products/cynative-deep-infra-research","desc":"Ask your cloud anything without breaking prod. Read-only.","zhDesc":"Ask your cloud anything without breaking prod. Read-only.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e49c6a81-06dc-4c02-b28e-78619233d833.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Open-source AI CLI that answers security questions across cloud, code and runtime - GitHub, GitLab, AWS, GCP, Azure, K8s. Ask in plain language: \"what's publicly exposed that shouldn't be?\" or \"can my CI escalate to cloud admin?\". Read-only by construction: every call is resolved to its IAM actions and authorized against a read-only policy before credentials attach. It can't modify your infra even if asked. Unlike MCP tools, it writes JS in a sandboxed runtime - a script per turn, not one call.","zhDetail":"Cynative 是一款开源 AI 命令行工具，面向安全工程师和 DevOps 人员，帮助用户用自然语言查询云、代码和运行时环境中的安全问题。它通过只读策略执行所有操作，确保不会修改基础设施，即使被要求也不会。相比 MCP 工具，它在沙箱中逐轮执行 JavaScript 脚本，而非单次调用，从而更安全地分析 GitHub、GitLab、AWS、GCP、Azure、K8s 等平台上的暴露风险。"}],"today":[{"rank":1,"name":"G.I.A.ac","zhName":"G.I.A.ac","url":"https://www.producthunt.com/products/g-i-a-ac","desc":"Build real, working apps from a single sentence","zhDesc":"Build real, working apps from a single sentence","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/b12cfb80-ab28-4266-b092-2450365c0e96.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Type one sentence — \"a booking site for a nail salon in Paris\" — and watch G.I.A build it live: real code, working app, no black box. Every app ships with a built-in AI assistant that knows that business (services, prices, availability) and answers customers from day one. Deploy to YOUR own GitHub and Vercel — your code, no lock-in, export anytime. Try everything free in a full live preview; pay €9.99/mo only when you're ready to ship. Built solo in Morocco. Describe it. Watch it build. Ship it.","zhDetail":"G.I.A.ac 是一款面向小型服务商（如巴黎美甲店）的 AI 建站工具。你只需用一句话描述业务，它就能实时生成真实可运行的网站代码，并内置一个了解该店服务、价格和库存的 AI 客服，从上线第一天起自动回答顾客问题。所有代码归你所有，可部署到自己的 GitHub 和 Vercel，无平台锁定，随时导出，免费预览满意后再按月付费。"},{"rank":2,"name":"Lamoom","zhName":"Lamoom","url":"https://www.producthunt.com/products/lamoom","desc":"Run agent apps inside your Claude or sell your own","zhDesc":"Run agent apps inside your Claude or sell your own","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0048cb32-97e1-4a2b-8b52-e6bd5090029c.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Lamoom is a marketplace of agent apps that run inside your own Claude - not on our servers. Install one and it works in your files, with your data. Every run is yours to see. Publish your own loops and charge per run or monthly. $20 free credit to start.","zhDetail":"Lamoom 是一个面向 Claude 用户的智能体应用市场，让你在自己的 Claude 环境中直接安装和使用各类 AI 助手应用，而非运行在第三方服务器上。这些应用可以访问你的本地文件和数据，每次运行结果完全透明可见。你还可以发布自己设计的自动化流程，并按次或按月收费，适合希望扩展 Claude 功能并实现变现的开发者与高级用户。"},{"rank":3,"name":"Conduit","zhName":"Conduit","url":"https://www.producthunt.com/products/conduit-ai","desc":"AI agents purpose-built for Hospitality","zhDesc":"AI agents purpose-built for Hospitality","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/81f76030-ce4c-445d-8d2f-b2a3110ded07.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Conduit automates guest conversations and the work behind it. Conduit agents reply across email, WhatsApp, OTAs and social, voice calls. Agents dispatch subagents to act inside your PMS and tech stack: dispatching cleaners, updating calendars, closing the loop. Agents learn from every interaction, and you can inspect every step. 140+ languages, SOC 2 Type II. 50M+ conversations and $3B+ in reservation value for 300+ brands including Marriott, Hilton, Nobu and Fairmont.","zhDetail":"Conduit 是一款面向酒店及度假村品牌的自动化客服与运营平台，通过 AI 智能体自动处理来自邮件、WhatsApp、OTA、社交媒体和语音电话的住客对话。它能将任务分派给子智能体，在您的物业管理系统（PMS）和技术栈中自动执行清洁调度、日历更新等操作，并持续从每次交互中学习，同时支持 140 多种语言和全程可审计的步骤。"},{"rank":4,"name":"Cercle","zhName":"Cercle","url":"https://www.producthunt.com/products/cercle","desc":"The bat signal for your closest friends.","zhDesc":"The bat signal for your closest friends.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/982a0fa6-bbb4-43c9-96e1-d69d11a3220d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Cercle is conquering the loneliness epidemic by bringing back connections with the people that matter most. Check in with yourself and share your mood with your close friends or your entire Cercle. Take the guesswork out of your friendships, know how they're feeling before that phone call or text. Your friends' mood updates live on your home-screen widget, so you know who needs you before they have to ask. Built after watching a series of close friends live and struggle in silence","zhDetail":"Cercle 致力于缓解孤独蔓延，帮你重新与最重要的人建立真实连接。你可以记录自己的心情，并与密友或整个“圈子”分享，从而在打电话或发消息前就了解对方的情绪状态。通过手机桌面小组件实时显示好友的心情更新，让你在他们开口之前就知道谁需要你——专为那些默默承受却不愿开口的朋友而设计。"},{"rank":5,"name":"Phantom","zhName":"Phantom","url":"https://www.producthunt.com/products/phantom-6","desc":"Voice-first AI agent that operates your Mac","zhDesc":"Voice-first AI agent that operates your Mac","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/14d4fa8f-b2cd-4530-bde1-49c8f3d8c993.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Phantom is a voice-first AI agent for macOS that is always accessible via the Mac notch. Instead of opening a chatbot window and moving work into a separate conversation, users speak or type from anywhere on their Mac, without interrupting their work. Phantom understands the relevant screen and app context and completes tasks directly within the user's workflow. The possibilities are only limited by the imagination of the user.","zhDetail":"Phantom 是一款专为 macOS 设计的语音优先 AI 助手，始终可通过 Mac 的刘海区域快速调用。用户无需打开聊天窗口或中断当前工作，即可在 Mac 任意位置通过语音或文字输入指令。它能理解当前屏幕和应用的上下文，直接在用户的工作流程中完成任务，极大提升效率。"},{"rank":6,"name":"Firstpass","zhName":"Firstpass","url":"https://www.producthunt.com/products/glaze-4","desc":"Actionable input so you nail every launch","zhDesc":"Actionable input so you nail every launch","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/d767c091-9920-4ab3-9d07-3df3897d7386.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"If you've ever shipped a launch and watched your copy get truncated, ignored, or misread — Firstpass shows you every surface a stranger meets your product on (the Product Hunt page, the leaderboard row, the Glaze Store grid) and pins handwritten crit notes to what breaks in each one, before you publish. The same tagline lives or dies differently depending on where it lands: PH gives you 60 characters, the Glaze Store caps at 40, the browse grid cuts near 33. Nobody checks — until it's live.","zhDetail":"Firstpass 是一款面向产品发布者的预览检查工具，帮助你在发布前看清产品在不同平台（如 Product Hunt、排行榜、Glaze Store 等）上的实际展示效果。它能自动识别每个展示面的字符限制（如60、40、33字符），并针对每个截断或显示异常的位置添加手写批注，避免文案被截断、忽略或误读。"},{"rank":7,"name":"SUB/WAVE","zhName":"SUB/WAVE","url":"https://www.producthunt.com/products/sub-wave","desc":"Self-hosted radio with an AI DJ and one shared stream","zhDesc":"Self-hosted radio with an AI DJ and one shared stream","tags":[],"upvotes":null,"i e run operations at UniTru, giving us leverage that would normally require engineering resources. It allows us to manage workflows across Slack and Google Sheets seamlessly, handling things like scheduling, status tracking, and coordination in real time. What stands out most is how quickly we can build, test, and refine workflows without slowing down, which is critical for a fast moving team. At a high level, Viktor does not just save time, it enables us to operate at a level of speed, organization, and scale that would not be possible otherwise.","zhDetail":"Viktor 是一款面向快节奏团队的工作流自动化工具，帮助非技术成员在 Slack 和 Google Sheets 中无缝管理排期、状态追踪与实时协作。它让用户无需工程资源即可快速搭建、测试和优化工作流程，从而提升团队的组织效率与规模化运营能力。"},{"rank":10,"name":"qsa.sh","zhName":"qsa.sh","url":"https://www.producthunt.com/products/qsa-sh-quick-security-audit","desc":"External security scan of your own IP, in your terminal","zhDesc":"External security scan of your own IP, in your terminal","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/633dc140-5f60-4924-ac13-b9cd3ab92bd8.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Run curl qsa.sh for a one-command external security scan of your server's own public IP — naabu, nmap + vulners, and nuclei map your open ports, service versions, and known CVEs, streamed straight to your terminal in ~30 seconds. See exactly what the internet sees of your host: no account, nothing stored. Free scans run live; paid Pro (all 65,535 ports, async) and one-time Deep (the full nuclei firehose, emailed) dig deeper uncovering vulnerabilities below the surface.","zhDetail":"qsa.sh 是一款面向服务器运维和安全工程师的极简外部安全扫描工具。只需在终端执行 `curl qsa.sh` 一条命令，即可在约30秒内扫描服务器公网IP的开放端口、服务版本及已知CVE漏洞，结果直接输出到终端。无需注册、不留存数据，免费版即可快速了解互联网视角下的主机暴露面；付费Pro版支持全65535端口异步扫描，Deep版则通过邮件发送完整的nuclei深度漏洞探测报告。"},{"rank":11,"name":"Space-Bin","zhName":"Space-Bin","url":"https://www.producthunt.com/products/space-bin","desc":"Temporary storage to share files securely","zhDesc":"Temporary storage to share let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

  const hint = document.getElementById('regenHint');

  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
</html>
