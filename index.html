<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>

          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>

          </button>
        </div>
      </div>

      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>

</div>

<div class="sidebar" id="sidebar">

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-08","updatedAt":"08:46","yesterday":[{"rank":2,"name":"Soloop","zhName":"Soloop","url":"https://www.producthunt.com/products/soloop","desc":"Approval-first Agent OS for solo founders","zhDesc":"Approval-first Agent OS for solo founders","tags":[],"upvotes":null,"icon":null,"detail":"I designed almost exactly this for my own company — departments instead of loose agents, each with a manager, shared memory, daily reviews. The one place I landed differently is approval. I started approval-first and moved to \"execute and report, stop only at what's irreversible\", because the approval queue became the bottleneck it was meant to remove. As a solo founder my scarcest resource is attention, and a system that asks me twelve times a day is a slower version of doing it myself. Curious how you're drawing that line — is \"requires approval\" a fixed category, or does it widen as the founder builds trust?","zhDetail":"Soloop 是为独立创始人打造的多智能体协作平台，用“部门化”结构替代松散代理，每个部门配有主管、共享记忆和每日复盘，帮助一人团队高效管理复杂工作流。它采用“先执行后汇报、仅在不可逆操作时暂停”的审批机制，避免创始人被频繁打断，从而将稀缺的注意力集中在真正重要的决策上。"},{"rank":3,"name":"Rindler","zhName":"Rindler","url":"https://www.producthunt.com/products/rindler","desc":"Automate the web work your team does by hand","zhDesc":"Automate the web work your team does by hand","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/52f5cfe9-17e4-4dd0-8cb0-56f60a9e0c2b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Rindler automates the repetitive web work your team still does by hand. Say what you need in plain English, and Rindler goes to the real site, signs in when needed, completes the task, and returns clean structured data. Put it on a schedule and it keeps running. Instead of making a browser agent guess every time, Rindler maps each site ahead of time and repairs workflows when pages change, so recurring tasks stay reliable","zhDetail":"Rindler 是一款面向团队的网页自动化工具，能自动完成那些仍靠人工操作的重复性网页任务。你只需用日常英语描述需求，它就会登录真实网站、完成任务并返回清晰的结构化数据，还能按计划定时运行。通过提前映射网站结构并在页面变化时自动修复流程，Rindler 让重复性工作保持稳定可靠，无需每次依赖浏览器代理猜测操作。"},{"rank":4,"name":"Nitro 4.0","zhName":"Nitro 4.0","url":"https://www.producthunt.com/products/alconost-localization","desc":"The first human translation platform built for AI agents","zhDesc":"The first human translation platform built for AI agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0da5d952-eaa9-4691-971f-161ab841ac6d.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Alconost is a tech-driven localization company building an ecosystem of products around localization and QA. Since 2004, we've helped companies of all sizes, from indie app and game developers to industry leaders, reach audiences in 120+ languages. We combine linguistic expertise, cultural intelligence, and advanced technology to handle every aspect of global expansion. Flexible teams, purpose-fit service levels for any budget, and effective delivery at any volume and speed.","zhDetail":"Nitro 4.0 是面向出海应用与游戏开发者的本地化与质量保障平台，帮助各类规模团队将产品覆盖到 120 多种语言市场。它通过融合语言专家、文化洞察与自动化技术，灵活匹配服务层级与预算，解决多语言交付中速度、成本与质量难以兼顾的问题。"},{"rank":7,"name":"Crew","zhName":"Crew","url":"https://www.producthunt.com/products/crew-a-tiny-crew-for-claude-code","desc":"A tiny crew of monsters for your Claude Code agents","zhDesc":"A tiny crew of monsters for your Claude Code agents","tags":[],"upvotes":null,"icon":null,"detail":"the Allow/Deny buttons on the creature are the sneaky-useful bit, I lose so much time hunting for which window wants something from me. How does it behave when it needs approval: does it freeze my window and wait or just sit there until I notice?","zhDetail":"Crew 是一款面向多窗口办公人群的效率工具，解决频繁切换窗口、找不到哪个应用在等待授权或输入的问题。它通过在每个应用上提供清晰的 Allow/Deny 按钮，并明确提示需要审批时的行为（如冻结窗口等待或静默提醒），让用户不再浪费时间寻找“谁在叫我”。"},{"rank":8,"name":"Kitesurf","zhName":"Kitesurf","url":"https://www.producthunt.com/products/cloudflare","desc":"Browser built for agents, running on Cloudflare Workers","zhDesc":"Browser built for agents, running on Cloudflare Workers","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/82f3196a-79f8-4479-9c73-2ff286bf0b69.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Reviewers mostly see Cloudflare as a reliable way to make sites and apps faster, safer, and easier to run, especially for DNS, CDN, caching, DDoS protection, and edge delivery. Users repeatedly praise quick setup, strong performance, and long-term dependability, while several note that the platform’s breadth can feel confusing or hard to learn. Founders of","zhDetail":"Kitesurf 是一款面向网站和应用开发者的 Cloudflare 管理工具，帮助用户更轻松地掌握 Cloudflare 的复杂功能。它通过简化配置流程和提供直观的操作界面，解决了新手和团队在 DNS、CDN、缓存等设置上的学习成本高、上手难的问题，让用户能快速部署并稳定运行。"},{"rank":9,"name":"DataBlur","zhName":"DataBlur","url":"https://www.producthunt.com/products/datablur","desc":"Blur sensitive data on screen before anyone sees it","zhDesc":"Blur sensitive data on screen before anyone sees it","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/73d1c001-6443-46e8-a686-410d4ba46b8f.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"DataBlur blurs sensitive data on your screen in real time — during live calls, demos and recordings. Auto-detects emails, cards and API keys. 100% local: no cloud, no AI, no signup. When detection fails, it blurs more, not less.","zhDetail":"DataBlur 是一款屏幕实时模糊工具，专为直播通话、产品演示和录屏场景设计，自动识别并隐藏屏幕上的邮箱、银行卡号和 API 密钥等敏感信息。所有处理均在本地完成，无需云端、AI 或注册账号，即使识别失败也会倾向多模糊而非漏模糊，确保隐私安全。"},{"rank":11,"name":"HAR","zhName":"HAR","url":"https://www.producthunt.com/products/har","desc":"Open Source harness for multi-agent coding workflows","zhDesc":"Open Source harness for multi-agent coding workflows","tags":[],"upvotes":null,"icon":null,"detail":"On the drift part we have only `har env maintain`, it checks the drift with the initial har template configuration. The next step will probably to have a har doctor command to prompt your coding agent to seek for any recent changes of the architecture (or any other type of structural changes) in your codebase that could break the environment startup flow. We know those changes are a bit rarer so we focus on core feature right now.","zhDetail":"HAR 是一款面向开发者的环境配置管理工具，用于检测和修复基础设施配置与初始模板之间的漂移问题。它通过 `har env maintain` 命令自动比对当前环境与预设模板的差异，帮助团队在架构或结构变更时快速定位可能导致环境启动失败的隐患，确保开发流程稳定可靠。"},{"rank":15,"name":"AndroMeld","zhName":"AndroMeld","url":"https://www.producthunt.com/products/andromeld","desc":"Bring a continuity-style experience to Android and Mac","zhDesc":"Bring a continuity-style experience to Android and Mac","tags":[],"upvotes":null,"icon":null,"detail":"AndroMeld brings a Continuity-style experience to Android and Mac. Mirror multiple Android apps in separate, resizable, native-like Mac windows, hand off the app already open on your phone, and control it with keyboard & trackpad gestures. Browse Android storage in Finder, sync notifications and clipboard, and turn on your phone’s hotspot over Bluetooth. Support any Android 16+ devices connect by USB or Wi-Fi, with a free Web App available.","zhDetail":"AndroMeld 为 Android 和 Mac 用户带来类似苹果 Continuity 的无缝体验。它能在 Mac 上以独立、可调整大小的原生窗口镜像多个安卓应用，并支持从手机直接接力当前应用，通过键盘和触控板手势操控。此外，你还能在 Finder 中浏览安卓存储、同步通知与剪贴板，并通过蓝牙开启手机热点，支持 USB 或 Wi-Fi 连接任意 Android 16+ 设备，另有免费网页版可用。"}],"today":[{"rank":1,"name":"AstraPixels","zhName":"AstraPixels","url":"https://www.producthunt.com/products/astrapixels","desc":"​​A pixel-art solar system at its real current positions.​","zhDesc":"​​A pixel-art solar system at its real current positions.​","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2849f813-bd82-4704-bea6-992e43ca7a35.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"An animated pixel-art map of the solar system with every body at its real current position, computed from published orbital elements rather than copied from a list. Zoom from the Sun to the Kuiper belt, browse 171 catalogued objects with sourced facts, and see what the sky is doing for the next six months. Every rock is also for sale: claim an asteroid for $5, keep it forever, name it whatever you like. A name here is shown on AstraPixels only, and is not an IAU designation.","zhDetail":"AstraPixels 是一款动态像素艺术太阳系地图，为天文爱好者和好奇者展示所有天体的实时真实位置，数据基于公开轨道要素计算而非静态列表。用户可从太阳缩放至柯伊伯带，浏览171个带来源事实的编目天体，并查看未来六个月的天空动态。此外，每颗小行星都可以5美元的价格认领并永久命名（仅显示于 AstraPixels，非IAU官方命名）。"},{"rank":2,"name":"Toolport","zhName":"Toolport","url":"https://www.producthunt.com/products/conduit-12","desc":"Every tool, one port. One MCP setup for all your AI agents","zhDesc":"Every tool, one port. One MCP setup for all your AI agents","tags":[],"upvotes":null,"icon":null,"detail":"A free, open source, local MCP gateway. Set up each server once and every AI agent shares it (Claude, Cursor, VS Code, Codex, and 29 more). Instead of dumping every tool definition into context, it exposes a few meta-tools your agent searches on demand. Benchmarked and graded for correct answers, that's up to 91% fewer tokens at the same task success. Secrets live in your OS keychain, not client configs. Rug-pulls and tool poisoning get flagged, and destructive calls can wait for your approval.","zhDetail":"Toolport 是一款免费开源的本地 MCP 网关，面向使用多种 AI 编程助手（如 Claude、Cursor、VS Code、Codex 等）的开发者。它通过一次性配置服务器，让所有 AI 代理共享工具，并以按需搜索的元工具替代全量工具定义，最高可减少 91% 的 token 消耗，同时保持任务成功率。此外，它还将密钥安全存储在系统钥匙串中，并主动标记恶意工具或破坏性调用，需经你批准后才执行，兼顾效率与安全。"},{"rank":3,"name":"Hexis","zhName":"Hexis","url":"https://www.producthunt.com/products/bevel-4","desc":"Git-backed skills, tools & context for AI agents","zhDesc":"Git-backed skills, tools & context for AI agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/c122d314-c8c5-419e-ad79-8ceed93935e3.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"One place where your company's AI skills, tools and knowledge live - centrally managed, reviewed and access-controlled, and usable from any AI agent. Hexis is a layer on top of Git: same core (versioning, PRs), plus a clean UX so anyone can use skills, suggest changes, and submit new ones and admins can govern which context, tools, and skills each person, team, or agent can access. Consumed via MCP, works in any agent in the company.","zhDetail":"Hexis 是一个集中管理企业 AI 技能、工具与知识的平台，面向需要安全协作与治理的团队。它基于 Git 构建，提供版本控制、审查和权限管理，让任何员工或 AI 代理都能通过 MCP 协议在现有工具中安全调用技能，同时管理员可精细控制每个人、团队或代理的访问范围。"},{"rank":4,"name":"2. Soloop","zhName":"Soloop","url":"https://www.producthunt.com/products/soloop","desc":"Approval-first Agent OS for solo founders","zhDesc":"Approval-first Agent OS for solo founders","tags":[],"upvotes":null,"icon":null,"detail":"I designed almost exactly this for my own company — departments instead of loose agents, each with a manager, shared memory, daily reviews. The one place I landed differently is approval. I started approval-first and moved to \"execute and report, stop only at what's irreversible\", because the approval queue became the bottleneck it was meant to remove. As a solo founder my scarcest resource is attention, and a system that asks me twelve times a day is a slower version of doing it myself. Curious how you're drawing that line — is \"requires approval\" a fixed category, or does it widen as the founder builds trust?","zhDetail":"Soloop 是为独立创始人打造的企业级 AI 智能体管理平台，将零散的 AI 助手组织为带经理、共享记忆和每日复盘的结构化部门。它解决了创始人因审批流程过多而分散注意力、拖慢决策的痛点，采用“先执行后报告、仅对不可逆操作设限”的机制，让 AI 在授权范围内自主推进，从而释放创始人的核心精力。"},{"rank":5,"name":"3. Rindler","zhName":"Rindler","url":"https://www.producthunt.com/products/rindler","desc":"Automate the web work your team does by hand","zhDesc":"Automate the web work your team does by hand","tags":[],"upvotes":null,"icon":null,"detail":"Rindler automates the repetitive web work your team still does by hand. Say what you need in plain English, and Rindler goes to the real site, signs in when needed, completes the task, and returns clean structured data. Put it on a schedule and it keeps running. Instead of making a browser agent guess every time, Rindler maps each site ahead of time and repairs workflows when pages change, so recurring tasks stay reliable","zhDetail":"Rindler 是一款面向团队的自动化工具，帮助用户摆脱重复性的网页操作。你只需用自然语言描述需求，它就能自动登录真实网站、完成任务并返回结构化数据，还能按计划定时运行。通过预先映射网站结构并在页面变化时自动修复流程，Rindler 确保重复性任务稳定可靠，不再依赖每次猜测式的浏览器操作。"},{"rank":6,"name":"4. Nitro 4.0","zhName":"Nitro 4.0","url":"https://www.producthunt.com/products/alconost-localization","desc":"The first human translation platform built for AI agents","zhDesc":"The first human translation platform built for AI agents","tags":[],"upvotes":null,"icon":null,"detail":"Alconost is a tech-driven localization company building an ecosystem of products around localization and QA. Since 2004, we've helped companies of all sizes, from indie app and game developers to industry leaders, reach audiences in 120+ languages. We combine linguistic expertise, cultural intelligence, and advanced technology to handle every aspect of global expansion. Flexible teams, purpose-fit service levels for any budget, and effective delivery at any volume and speed.","zhDetail":"Nitro 4.0 是面向出海应用与游戏开发者的本地化与质量保障平台，帮助各类规模团队高效触达全球 120 多种语言的用户。它融合语言专家、文化洞察与自动化技术，覆盖翻译、审校、QA 等全流程，并提供灵活的服务层级与交付速度，让不同预算的团队都能快速、可靠地完成全球扩张。"},{"rank":7,"name":"Viktor.com","zhName":"Viktor.com","url":"https://www.producthunt.com/products/viktor","desc":"An AI coworker that actually does the work","zhDesc":"An AI coworker that actually does the work","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/37038cc7-70ae-4d9f-b264-b20497bae49b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Viktor has become a core part of how we run operations at UniTru, giving us leverage that would normally require engineering resources. It allows us to manage workflows across Slack and Google Sheets seamlessly, handling things like scheduling, status tracking, and coordination in real time. What stands out most is how quickly we can build, test, and refine workflows without slowing down, which is critical for a fast moving team. At a high level, Viktor does not just save time, it enables us to operate at a level of speed, organization, and scale that would not be possible otherwise.","zhDetail":"Viktor.com 是一款面向快节奏团队的运营自动化工具，帮助非技术人员在 Slack 和 Google Sheets 中无缝管理工作流，无需依赖工程资源。它通过实时处理日程安排、状态跟踪和团队协调，让用户快速搭建、测试并优化流程，从而显著提升团队的速度、组织性和扩展能力。"},{"rank":8,"name":"1. Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":null,"detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向开发团队和 AI 编码代理的决策审查工具，能在代码上线前自动识别并解读 AI 在实现过程中做出的关键选择。它结合你的需求文档、工单和现有产品上下文，清晰说明每个决策的内容、潜在影响及撤销难度，帮助团队快速批准、修正或替换决策，并将这些上下文无缝带入后续开发任务，避免技术债和返工。"},{"rank":9,"name":"3. SKI","zhName":"SKI","url":"https://www.producthunt.com/products/ski","desc":"Free voice coding for Claude Code, Codex and more","zhDesc":"Free voice coding for Claude Code, Codex and more","tags":[],"upvotes":null,"icon":null,"detail":"We just built SKI — voice coding for Claude Code, Codex and more. It's not dictation: your agent answers you out loud, like a real teammate, so you build at the speed you think. You can even bring it into a meeting to build live, or send it in your place to speak for you. It's an ambient thing that just sits on your desktop — hit a key, talk, it works. All on your machine, free. Available on Mac & Windows.","zhDetail":"SKI 是一款为 Claude Code、Codex 等 AI 编程工具打造的语音交互助手，面向开发者，让你用说话代替打字来编写代码。它不只是听写，而是像真实队友一样用语音回应你，让你以思考的速度构建应用；你还可以在会议中现场演示编程，或让它代你发言。它常驻桌面，按一下键即可对话，完全在本地运行，免费支持 Mac 和 Windows。"},{"rank":10,"name":"1. Acti","zhName":"Acti","url":"https://www.producthunt.com/products/acti-2","desc":"Agentic keyboard for mobile commands and search","zhDesc":"Agentic keyboard for mobile commands and search","tags":[],"upvotes":null,"icon":null,"detail":"Type what you need. Hold Acti Bar. Acti understands your intent and brings back the right result, link, or action - right where you are. Use Acti for live sports schedules, nearby restaurants, Notion docs, LinkedIn profiles, Meet links, Calendar actions, and custom workflows - without leaving the conversation.","zhDetail":"Acti 是一款智能操作助手，面向在聊天或工作中频繁切换应用、查找信息的用户。你只需输入需求并按住 Acti 栏，它就能理解你的意图，直接在当前对话中返回正确的结果、链接或执行操作——无论是查看体育赛程、查找附近餐厅、调取 Notion 文档、打开 LinkedIn 资料，还是安排日历会议，都无需离开当前界面。"},{"rank":11,"name":"2. Pazi","zhName":"Pazi","url":"https://www.producthunt.com/products/pazi","desc":"Vibe code business operations","zhDesc":"Vibe code business operations","tags":[],"upvotes":null,"icon":null,"detail":"Pazi is an AI team for that idea you keep coming back to — a book, a shop, an app, a skill you want to sell. Tell Pazi what you're trying to do and it builds a team of agents around your idea and starts making things happen: a website, first outreach, content, the next step. Every time you come back, something has moved. You stay in control; your team does the rest alongside you, one real step at a time. Like vibe coding but for business operations.","zhDetail":"Pazi 是一个围绕你反复浮现的创意（如写书、开店、做应用或出售技能）组建的 AI 团队。你只需告诉它目标，它便会自动搭建代理团队，推进建站、首次外联、内容制作等具体步骤，让你每次回来都能看到进展。你始终掌握主导权，团队则与你并肩一步步落地执行——就像“氛围编程”，但专为商业运营而设计。"},{"rank":12,"name":"5. AnySearch","zhName":"AnySearch","url":"https://www.producthunt.com/products/anysearch","desc":"Real-time structured search trusted by agents and developers","zhDesc":"Real-time structured search trusted by agents and developers","tags":[],"upvotes":null,"icon":null,"detail":"A search tool for agents, not a search box. AI agents are only as good as the information they receive. When connected to AnySearch, your agent gets filtered, de-duplicated, and structured information from trusted sources searched in parallel, helping it produce more reliable results. Free to start.","zhDetail":"AnySearch 是一款专为 AI 智能体设计的搜索工具，而非传统搜索框。它能并行检索可信来源，并自动过滤、去重和结构化信息，确保智能体获得高质量输入，从而生成更可靠的结果。适合开发者和 AI 应用团队，免费即可上手使用。"}],"weekly":[{"rank":1,"name":"Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2e85ae4d-5d7d-4547-9839-4c8fb5e5e29a.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向开发团队的工具，用于在 AI 生成的代码变更上线前捕捉潜在的设计或技术决策问题。它会结合你的规格说明、任务单和现有产品上下文，自动解读每次变更背后的决策、影响及回退难度，帮助团队快速批准、修正或替换这些决策，并将上下文延续到后续工作中。"},{"rank":3,"name":"SKI","zhName":"SKI","url":"https://www.producthunt.com/products/ski","desc":"Free voice coding for Claude Code, Codex and more","zhDesc":"Free voice coding for Claude Code, Codex and more","tags":[],"upvotes":null,"icon":null,"detail":"We just built SKI — voice coding for Claude Code, Codex and more. It's not dictation: your agent answers you out loud, like a real teammate, so you build at the speed you think. You can even bring it into a meeting to build live, or send it in your place to speak for you. It's an ambient thing that just sits on your desktop — hit a key, talk, it works. All on your machine, free. Available on Mac & Windows.","zhDetail":"SKI 是为 Claude Code、Codex 等 AI 编程工具打造的语音交互助手，面向开发者，让你用说话的方式指挥编码代理，并实时听到它语音回应，像与真人队友协作一样高效。它支持在会议中现场演示或代 let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
</body>
