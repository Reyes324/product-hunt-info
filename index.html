<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年8月4日</span>
        <span class="updated">更新于 10:39</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-05","updatedAt":"10:39","yesterday":[{"rank":1,"name":"Hey Noah","zhName":"Hey Noah","url":"https://www.producthunt.com/products/hey-noah","desc":"A proactive AI executive assistant for founders","zhDesc":"A proactive AI executive assistant for founders","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/683a6add-051e-41db-bdd2-b7f76c07c261.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Noah is a proactive AI executive assistant for founders. Claude talks to you; Noah talks to your network. It's like Tesla Full Self Driving, and not cruise control- an autonomous AI EA that manages your calendar, relationships, and follow-ups across email, text, and WhatsApp - so nothing slips. Think of it as an always-on EA living in your SMS and helping you with meeting logistics.","zhDetail":"Hey Noah 是一款面向创业者的主动式 AI 执行助理，它不像普通助手那样被动响应，而是像特斯拉的完全自动驾驶一样，自主管理你的日历、人脉和跟进事项，覆盖邮件、短信和 WhatsApp，确保任何重要事务都不遗漏。它常驻于你的短信中，帮你处理会议安排和沟通细节，让你专注于核心业务。"},{"rank":3,"name":"Driven","zhName":"Driven","url":"https://www.producthunt.com/products/driven-ai","desc":"The trusted AI investment agent, from insight to action","zhDesc":"The trusted AI investment agent, from insight to action","tags":[],"upvotes":null,"icon":null,"detail":"Driven is an AI investment agent that turns market insight into action, not just answers. In one agent-powered workspace, it combines 260+ APIs, built-in & custom Skills, Playbooks, scheduled tasks, 24/7 monitoring, real-time data, portfolios, and order workflows. Instead of switching tools or chasing every signal, investors can manage the full journey in Driven, from idea generation and data gathering to analysis and action. It’s your AI investment team, while you stay in control.","zhDetail":"Driven 是一款 AI 投资代理，专为投资者打造，将市场洞察直接转化为行动，而非仅仅提供答案。它在一个智能工作区内整合了 260+ API、内置及自定义技能、剧本、定时任务、全天候监控、实时数据、投资组合与订单流程，帮助用户从想法生成、数据收集到分析与执行，一站式完成投资全流程，无需在多工具间切换或追逐每个信号。您掌控全局，Driven 充当您的 AI 投资团队。"},{"rank":11,"name":"Snipplet","zhName":"Snipplet","url":"https://www.producthunt.com/products/snipplet","desc":"Create and share beautiful guides from places you love","zhDesc":"Create and share beautiful guides from places you love","tags":[],"upvotes":null,"icon":null,"detail":"Most travel tools help you plan trips. Snipplet does the opposite. It's for places you've already been and actually loved. Save your favorite spots, add photos and tips, and it becomes a visual guide you can share with one link. No more scattered screenshots or 47 tab Google Docs. Make it yours with custom fonts, colors, stickers, backgrounds, and themes. Or drop a screenshot in and let AI build it for you. Real recs from real people. Works for Tokyo or your favorite spots around the corner.","zhDetail":"Snipplet 是一款帮你记录并分享心爱之地的视觉化工具，专为那些已经去过并真正喜欢某个地方的人设计。它能让你保存喜欢的景点、添加照片和小贴士，并生成一个可一键分享的链接，告别零散的截图和杂乱的文档。你还可以自定义字体、颜色、贴纸和主题，或直接上传截图让 AI 帮你自动生成，适合从东京到街角小店的各种推荐场景。"},{"rank":13,"name":"SpeakoFlow","zhName":"SpeakoFlow","url":"https://www.producthunt.com/products/speakoflow","desc":"Free, open-source voice dictation and AI assistant, offline","zhDesc":"Free, open-source voice dictation and AI assistant, offline","tags":[],"upvotes":null,"icon":null,"detail":"SpeakoFlow puts your voice over your whole desktop. Speak, and your words land in any app — email, editor, chat, terminal. Say \"Hey Flow\" and it writes the whole reply from what's on your screen. Ask the assistant about what you're looking at and hear the answer back. It also cleans up your dictation, translates as you speak, and learns how you work. Everything can run on your machine — speech-to-text always does. Free, open source, MIT. Windows, macOS, Linux.","zhDetail":"SpeakoFlow 让你的声音掌控整个桌面——说出内容，文字即可落入任意应用（邮件、编辑器、聊天、终端）。只需说“Hey Flow”，它就能根据屏幕内容写出完整回复，还能回答你眼前所见的问题并语音播报。它支持语音转文字、自动清理口述内容、实时翻译，并会学习你的工作习惯；所有功能均可本地运行，免费开源（MIT 协议），支持 Windows、macOS 和 Linux。"},{"rank":14,"name":"space ocr","zhName":"Space OCR","url":"https://www.producthunt.com/products/space-ocr","desc":"OCR that checks its own answers, as an app or an API","zhDesc":"OCR that checks its own answers, as an app or an API","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e25f3335-65f4-4cee-a80c-db6ce136fe78.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Either way the results stay somewhere you can use, so there is no database to stand up. A folder and a sheet are the storage. Photos land in the sheet as rows of the columns you asked for, and later you can ask that sheet for the rows over an amount, or from one vendor, newest first, a page at a time. That runs on the server, it does not read the images again, and it is not charged. The rows keep the coordinates and the flags they were stored with, so a filtered answer is as checkable as a single scan.","zhDetail":"Space OCR 是一款面向需要批量处理票据或文档图片的用户的 OCR 工具，它省去了搭建数据库的麻烦，直接将识别结果以表格行形式存入文件夹和电子表格中。用户只需指定列，照片即可自动转为可筛选的数据行，并支持按金额、供应商或时间排序查询，且后续查询在服务器端完成，不重复读取图片、不额外收费，每行数据保留坐标和标记，方便随时核对。"},{"rank":15,"name":"Finyuus","zhName":"Finyuus","url":"https://www.producthunt.com/products/finyuus","desc":"A code-first language for durable, governed AI workflows","zhDesc":"A code-first language for durable, governed AI workflows","tags":[],"upvotes":null,"icon":null,"detail":"the durability and git-diffable execution graph is the genuinely useful part, that's a real gap in a lot of prompt-chain tools. the new DSL is the part I'd push back on though - Temporal already has SDKs in Python and TypeScript that get you retries, replay and versioning without asking anyone to learn new indentation rules. what does the language buy you over a thin Python wrapper around the same guards and approvals, besides a smaller surface to write the interpreter for? \"governable\" and \"diffable\" don't obviously require a new syntax, they require the underlying execution model you already built.","zhDetail":"Finyuus 面向需要构建可靠、可审计 AI 提示链的开发者，解决了现有工具在流程执行的可追溯性和版本管理上的不足。它通过提供持久化且支持 git-diff 的执行图，让每次运行结果可复现、可审查，同时内置重试、回放和版本控制能力，帮助团队在复杂工作流中实现更严谨的治理与协作。"},{"rank":17,"name":"Domo","zhName":"Domo","url":"https://www.producthunt.com/products/domo-a-claude-agent-for-your-calendar","desc":"Build and customize your own calendar agent you can text","zhDesc":"Build and customize your own calendar agent you can text","tags":[],"upvotes":null,"icon":null,"detail":"Domo is a purpose-built agent that keeps your family calendar. It has its own phone number you iMessage or text (\"add dentist Thursday at 3\"), and an always-on wall dashboard that stays current. It's built with native Claude Code tooling and runs on your existing Claude subscription: no API key, no per-token bill. Install it by handing the guide to a coding agent. It's a pattern as much as a product: swap the purpose and build your own. We build in public; come see what others are making.","zhDetail":"Domo 是一款专为家庭日历打造的智能助手，拥有专属电话号码，可通过 iMessage 或短信直接下达指令（如“周四下午3点添加牙医预约”），并配有实时更新的墙面仪表盘。它基于原生 Claude Code 工具构建，运行在你现有的 Claude 订阅上，无需 API 密钥或按 token 计费。安装只需将指南交给编码代理即可完成，既是一个产品，也是一种可自定义用途的开源模式。"}],"today":[{"rank":1,"name":"Dover MCP","zhName":"Dover MCP","url":"https://www.producthunt.com/products/dover","desc":"Run your hiring process from Claude or ChatGPT","zhDesc":"Run your hiring process from Claude or ChatGPT","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/c50be0e2-a436-4250-acbd-534d7ad39036.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Dover’s MCP connects Dover’s free ATS to ChatGPT, Claude, Cursor, and other AI tools. You can now use powerful AI tools to review applicants, schedule interviews, move candidates through your pipeline, add notes, and coordinate hiring. Access is secure and respects your team's existing permissions. Available today as part of Dover's free ATS for startups.","zhDetail":"Dover MCP 将 Dover 的免费 ATS（应聘者追踪系统）接入 ChatGPT、Claude、Cursor 等 AI 工具，帮助初创团队用 AI 完成候选人筛选、面试安排、流程推进、备注添加及招聘协调。它面向使用 AI 工具进行招聘的团队，在保障安全并遵循现有权限的前提下，让招聘流程更高效。该功能现已随 Dover 面向初创公司的免费 ATS 提供。"},{"rank":2,"name":"StepGrab","zhName":"StepGrab","url":"https://www.producthunt.com/products/stepgrab","desc":"Turn any Mac task into a step-by-step guide","zhDesc":"Turn any Mac task into a step-by-step guide","tags":[],"upvotes":null,"icon":null,"detail":"There's a real constraint behind that one. To describe a click you need to know what was clicked, and on macOS that lives in the Accessibility API. I have shipped a build that used it, but approval for that entitlement is inconsistent enough that I can't put a core feature on top of it. So I reconstruct from OCR and cursor position instead. When a control carries visible text that works well. When it's an unlabelled toolbar icon it doesn't, and that layer is still very much in development. The image foundation model coming in macOS 27 should close most of the gap, and until then I'm grateful for any ideas.","zhDetail":"StepGrab 是一款面向 macOS 用户的自动化操作记录工具，帮助开发者或效率爱好者精准捕捉每一步点击操作。它通过 OCR 与光标位置智能识别界面元素，无需依赖系统权限即可生成可复现的操作步骤，解决因辅助功能授权不稳定而导致的记录缺失问题。目前对带文字标签的控件识别良好，无标签图标仍在持续优化中。"},{"rank":3,"name":"AdAnt AI","zhName":"AdAnt AI","url":"https://www.producthunt.com/products/adant-ai","desc":"Claude for viral, high-converting social ads","zhDesc":"Claude for viral, high-converting social ads","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/6206777f-775d-4ab0-a9c5-72d06df2ee77.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"AdAnt AI is a team of Creative Agents that handles Social Ad Strategy, Creation, and Iteration. Built on the strategies our founding team used to generate 50M+ Organic Views and reduce Paid Acquisition Costs by 60% on average, AdAnt AI creates Scroll-Stopping, High-Converting Ads for TikTok, Instagram, and YouTube.","zhDetail":"AdAnt AI 是一个由创意智能体组成的团队，专为品牌和营销团队打造，负责社交媒体广告的策略、制作与迭代优化。它基于创始团队曾实现5000万+自然浏览并将付费获客成本平均降低60%的实战方法，自动生成适用于 TikTok、Instagram 和 YouTube 的高转化、抓眼球的广告内容，帮助用户节省时间并提升广告效果。"},{"rank":4,"name":"Keystroke","zhName":"Keystroke","url":"https://www.producthunt.com/products/keystroke-2","desc":"Build powerful AI agents & workflows","zhDesc":"Build powerful AI agents & workflows","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/f472269c-857a-4963-b066-971c78607bfb.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Agents come with memory, web search, code execution, persistent workspaces, and access to more than 1,000 integrations, any API, or any MCP server. They can work on schedules or app events, create their own triggers, and spin up lightweight apps and dashboards. For more complex systems, you can combine agents with deterministic workflows, multi-agent orchestration, and human approvals. Every run is durable, observable, and available for your team to inspect.","zhDetail":"Keystroke 是一款面向开发者和自动化团队的智能代理平台，旨在解决复杂任务中 AI 代理能力分散、难以集成和缺乏可控性的问题。它通过内置记忆、联网搜索、代码执行和持久工作区，并支持超过 1000 种集成、任意 API 或 MCP 服务器，让代理能按计划或应用事件自主运行，同时结合确定性工作流、多代理编排和人工审批，确保每次执行可追溯、可观察，便于团队审查。"},{"rank":5,"name":"Aegisora","zhName":"Aegisora","url":"https://www.producthunt.com/products/aegisora","desc":"The narrow control plane for AI agent tool and API calls.","zhDesc":"The narrow control plane for AI agent tool and API calls.","tags":[],"upvotes":null,"icon":null,"detail":"Stop selling abstract \"AI safety\". Enterprises buy operational control. Aegisora is an open-source, zero-latency proxy layer built for AppSec teams. Intercept malicious LLM actions, enforce least-privilege API access, mask PII on the fly, and generate readable audit logs for autonomous agents—without the bloated middleware.","zhDetail":"Aegisora 是一款面向企业应用安全（AppSec）团队的开源零延迟代理层，用于拦截恶意大模型行为、强制最小权限 API 访问、实时脱敏个人隐私数据，并为自主智能体生成可读的审计日志。它帮助企业在不引入臃肿中间件的情况下，将抽象的“AI 安全”落地为可操作的运营控制，解决大模型接入时的权限失控与数据泄露风险。"},{"rank":6,"name":"X Money","zhName":"X Money","url":"https://www.producthunt.com/products/x-money-2","desc":"Your money, on the world's most powerful network.","zhDesc":"Your money, on the world's most powerful network.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/dda0e684-dbbb-45b1-a6ed-952368dfc8a3.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"honestly the way they tied APY, the card, and instant transfers into a single app feels really well thought out, like they actually obsessed over not making me bounce between tools","zhDetail":"X Money 是一款面向个人用户的综合金融应用，将高收益储蓄（APY）、消费卡和即时转账整合在一个界面中，解决用户在不同工具间切换的繁琐问题。通过统一管理资金流动，让用户更高效地完成储蓄、支付与转账操作。"},{"rank":7,"name":"Kiro Crew","zhName":"Kiro Crew","url":"https://www.producthunt.com/products/kiro","desc":"Open source agentic development workspace","zhDesc":"Open source agentic development workspace","tags":[],"upvotes":null,"icon":null,"detail":"Kiro Crew is a persistent workspace that remembers your context, lessons, and skills across sessions, so you come back to progress instead of a cold start. Build a crew of agents that work across the tools you already use, wrapped in purpose-built Apps for the jobs you repeat.","zhDetail":"Kiro Crew 是一个持久化工作空间，专为频繁使用 AI 代理完成重复任务的团队或个人设计。它能跨会话记住你的上下文、经验与技能，避免每次从零开始；同时支持组建多个代理团队，在你常用的工具中协同工作，并通过定制化应用封装重复流程，显著提升效率。"},{"rank":8,"name":"Hansel","zhName":"Hansel","url":"https://www.producthunt.com/products/hansel-2","desc":"Remember everything you've worked on","zhDesc":"Remember everything you've worked on","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a808a052-9ba7-42a0-988a-64bf9c4a68ab.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Juggling different tasks and trying to understand what useful stuff I got done today sounds familiar... I'd definitely try it if I had Mac. Looks promising! Good luck on your launch, Ben!","zhDetail":"Hansel 是一款面向 Mac 用户的效率追踪工具，帮助那些每天忙于多项任务、却难以回顾自己究竟完成了哪些有价值工作的人。它通过自动记录和分析你的工作活动，生成清晰的每日成果总结，让你轻松掌握自己的生产力轨迹。"},{"rank":9,"name":"Lightfield","zhName":"Lightfield","url":"https://www.producthunt.com/products/lightfield","desc":"AI-native CRM that builds itself and does work for you","zhDesc":"AI-native CRM that builds itself and does work for you","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e31fc558-30e0-48e2-921a-0199328f3f02.x-icon?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Lightfield reads your emails, meetings, and calls to build your CRM automatically. No manual data entry — ever. Connect your inbox, upload a spreadsheet or CSV from your old CRM, and everything is recreated in less than five minutes. Ask it anything in plain English: who needs follow-up, what objections keep coming up, how has our ICP shifted — answered from your actual conversations. Then put it to work to draft follow-ups, create board decks, build proposals, and more.","zhDetail":"Lightfield 是一款面向销售团队的智能 CRM 自动构建工具，通过读取你的邮件、会议和通话记录，自动填充客户关系数据，彻底告别手动录入。你只需连接邮箱或上传旧 CRM 的 CSV 文件，五分钟内即可完成迁移，并能用日常英语提问（如“谁需要跟进”“客户常提哪些异议”），还能自动生成跟进邮件、董事会演示和提案，大幅提升销售效率。"},{"rank":10,"name":"Keytones","zhName":"Keytones","url":"https://www.producthunt.com/products/keytones-for-mac","desc":"Distinct key sounds for uppercase, lowercase & more","zhDesc":"Distinct key sounds for uppercase, lowercase & more","tags":[],"upvotes":null,"icon":null,"detail":"Ever typed a whole sentence in caps before noticing? Keytones plays a distinct sound for each key group (uppercase, lowercase, space bar, and modifiers) so your ears catch a stray Caps Lock before your eyes do. Tune Pitch, Length, Damping + Volume per group, import your own sounds, or, if audible feedback isn't an option, turn on Visual Feedback: a glowing screen edge that pulses with every keystroke. Per-app control, Siri + Shortcuts, instant triple-tap mute. One-time purchase, no subscription.","zhDetail":"Keytones 是一款为 Mac 用户设计的键盘音效反馈工具，帮助你在打字时通过耳朵捕捉误按的 Caps Lock 或大小写混输问题。它为不同按键组（大写、小写、空格和修饰键）分配独特音效，并支持自定义音调、音量或导入个人声音；若不便听音，还可开启屏幕边缘发光闪烁的视觉反馈。支持按应用单独设置、Siri 快捷指令和快速静音，一次买断，无需订阅。"},{"rank":11,"name":"1. Hey Noah","zhName":"Hey Noah","url":"https://www.producthunt.com/products/hey-noah","desc":"A proactive AI executive assistant for founders","zhDesc":"A proactive AI executive assistant for founders","tags":[],"upvotes":null,"icon":null,"detail":"Noah is a proactive AI executive assistant for founders. Claude talks to you; Noah talks to your network. It's like Tesla Full Self Driving, and not cruise control- an autonomous AI EA that manages your calendar, relationships, and follow-ups across email, text, and WhatsApp - so nothing slips. Think of it as an always-on EA living in your SMS and helping you with meeting logistics.","zhDetail":"Hey Noah 是一款为创始人打造的主动式 AI 行政助理，它不像普通助手那样被动响应，而是像特斯拉的自动驾驶一样，自主管理你的日历、人际关系和邮件、短信及 WhatsApp 上的后续跟进，确保任何重要事项都不会遗漏。它常驻在你的短信中，随时帮你处理会议安排等事务，让你专注于核心业务。"},{"rank":12,"name":"3. Driven","zhName":"3. Driven","url":"https://www.producthunt.com/products/driven-ai","desc":"The trusted AI investment agent, from insight to action","zhDesc":"The trusted AI investment agent, from insight to action","tags":[],"upvotes":null,"icon":null,"zhDetail":"3. Driven 是一款面向投资者的可信 AI 投资代理，帮助用户将市场洞察直接转化为投资行动。它通过智能分析数据并生成可执行的交易建议，解决投资者在信息过载与决策迟缓之间的痛点，让从研究到执行的全流程更高效、更可靠。"},{"rank":13,"name":"1. Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":null,"detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向软件团队的 AI 决策审查工具，能在代码发布前捕捉 AI 助手或开发人员做出的关键设计选择。它结合规格说明、工单和现有产品上下文，清晰解释每项决策的影响、后果及撤销难度，帮助团队快速批准、修正或替换决策，并将这些上下文无缝带入后续开发工作。"},{"rank":14,"name":"3. SKI","zhName":"SKI","url":"https://www.producthunt.com/products/ski","desc":"Free voice coding for Claude Code, Codex and more","zhDesc":"Free voice coding for Claude Code, Codex and more","tags":[],"upvotes":null,"icon":null,"detail":"We just built SKI — voice coding for Claude Code, Codex and more. It's not dictation: your agent answers you out loud, like a real teammate, so you build at the speed you think. You can even bring it into a meeting to build live, or send it in your place to speak for you. It's an ambient thing that just sits on your desktop — hit a key, talk, it works. All on your machine, free. Available on Mac & Windows.","zhDetail":"SKI 是一款为 Claude Code、Codex 等 AI 编程工具打造的语音交互助手，面向开发者，让你像与真实队友对话一样用语音指挥 AI 编码，而非简单听写。它常驻桌面，按一下键即可说话，AI 会实时语音回应，甚至能替你参加会议或现场演示，全程本地运行、免费支持 Mac 和 Windows。"},{"rank":15,"name":"1. Acti","zhName":"Acti","url":"https://www.producthunt.com/products/acti-2","desc":"Agentic keyboard for mobile commands and search","zhDesc":"Agentic keyboard for mobile commands and search","tags":[],"upvotes":null,"icon":null,"detail":"Type what you need. Hold Acti Bar. Acti understands your intent and brings back the right result, link, or action - right where you are. Use Acti for live sports schedules, nearby restaurants, Notion docs, LinkedIn profiles, Meet links, Calendar actions, and custom workflows - without leaving the conversation.","zhDetail":"Acti 是一款智能快捷操作工具，让你在聊天或任意界面中直接输入需求并按住 Acti 栏，即可快速获取所需结果、链接或执行操作。它面向需要高效切换任务的专业人士和日常用户，无需离开当前对话，就能查询体育赛程、附近餐厅、Notion 文档、LinkedIn 资料、会议链接及日历操作，并支持自定义工作流。"},{"rank":16,"name":"2. Pazi","zhName":"Pazi","url":"https://www.producthunt.com/products/pazi","desc":"Vibe code business operations","zhDesc":"Vibe code business operations","tags":[],"upvotes":null,"icon":null,"detail":"This website uses a security service to protect against malicious bots. This page is displayed while the website verifies you are not a bot.","zhDetail":"Pazi 是一款面向网站管理者的安全防护工具，用于拦截恶意机器人攻击。当网站检测到可疑访问时，它会自动展示验证页面，确认访问者不是机器人后才放行，从而保护网站免受自动化滥用和恶意流量侵扰。"},{"rank":17,"name":"5. AnySearch","zhName":"AnySearch","url":"https://www.produc let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
