<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>

          </button>

            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年7月28日</span>
        <span class="updated">更新于 10:42</span>

    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-07-29","updatedAt":"10:42","yesterday":[{"rank":1,"name":"Prefactor","zhName":"Prefactor","url":"https://www.producthunt.com/products/prefactor","desc":"Evaluate your AI Agents in real-time","zhDesc":"Evaluate your AI Agents in real-time","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/4ffa8a62-0b8a-4920-813e-e2f34bb5b68d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Most agents pass their evals and fail in production. Prefactor is the evaluation layer that closes the gap. We score every agent run in real time, surface quality regressions and drift as they happen, and show engineering teams exactly how their agents are performing at scale. Built for the teams shipping agents to customers.","zhDetail":"Prefactor 是一款面向将 AI 智能体交付给客户的工程团队的评估层工具。它解决了智能体在测试环境中通过评估却在生产环境中失败的问题，通过实时评分每一次智能体运行、即时发现质量回退与漂移，帮助团队精准掌握智能体在大规模部署下的实际表现。"},{"rank":2,"name":"Cekura","zhName":"Cekura","url":"https://www.producthunt.com/products/vocera","desc":"The self-improvement loop for voice agents","zhDesc":"The self-improvement loop for voice agents","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a0348018-57b9-4835-bf5a-faf8d3bee8a0.jpeg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Cekura is the testing, observability, and self-improvement platform for production voice and chat AI agents. It simulates thousands of scenarios, catches failures, diagnoses the root cause, rewrites prompts and config, then re-validates with a full regression sweep. Unlike tools that hand failures back to your team, Cekura closes the loop by fixing the agent itself and proving the fix holds without overfitting.","zhDetail":"Cekura 是为生产环境中的语音与聊天 AI 智能体打造的测试、可观测与自我优化平台。它通过模拟数千种场景，自动捕获失败、诊断根因、重写提示词与配置，并执行完整的回归验证来修复问题。与仅将失败反馈给团队的工具有所不同，Cekura 能自主闭环修复智能体，并确保修复有效且不产生过拟合。"},{"rank":3,"name":"Lottie Creator 2.0","zhName":"Lottie Creator 2.0","url":"https://www.producthunt.com/products/lottiefiles","desc":"After Effects for the web, built on Lottie","zhDesc":"After Effects for the web, built on Lottie","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/20670f6c-a217-4ffc-95bd-a5b42014f3a5.gif?auto=compress&codec=mozjpeg&cs=strip&dpr=2&fit=max&fm=webp&frame=1&h=48&w=48","detail":"Boss on your back and you need to quickly align an entire animated brand kit? Use the Motion Systems and standardize look and feel across multiple animations. Working on a one-of-a-kind masterpiece? Use the new Graph Editor to tweak every important frame to tell your story (and lets be real: every frame is important). Need to blaze through adding interactivity for your animations? Use a combo of State Machines and Copilot to perform the repetitive clicks, while your brain focuses on your next creative idea.","zhDetail":"专为动画设计师和品牌团队打造，解决多动画间风格不统一、关键帧调整繁琐以及交互添加效率低的问题。通过 Motion Systems 标准化多动画的视觉风格，利用 Graph Editor 精细调整每一帧，并借助 State Machines 与 Copilot 组合自动完成重复操作，让创作者专注于创意本身。"},{"rank":4,"name":"Leaping AI","zhName":"Leaping AI","url":"https://www.producthunt.com/products/leaping-ai","desc":"AI agents that call and text in multi-day campaigns","zhDesc":"AI agents that call and text in multi-day campaigns","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/3ed60734-850b-49ea-be66-eca197df5c21.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"The horizontal to home remodeling niche-down is a smart call, the physical-world trades are so underserved by voice AI. I work on the consumer side (daily check-in calls to aging parents), and the thing that quietly kills outbound for us is carrier spam labeling: even a wanted, friendly call gets flagged \"Scam Likely\" and never picked up. With 100+ parallel outbound calls, how are you handling number reputation and STIR/SHAKEN attestation so calls actually connect? Would love to hear what held up at scale.","zhDetail":"Leaping AI 是一款面向家装行业的语音AI工具，帮助实体服务商解决外呼电话被运营商标记为“骚扰”或“疑似诈骗”而无法接通的问题。它通过支持100路并行外呼、管理号码信誉和STIR/SHAKEN认证，确保真实、友好的电话能顺利被客户接听。"},{"rank":5,"name":"Hardbook","zhName":"Hardbook","url":"https://www.producthunt.com/products/hardbook","desc":"The freelancer booking link that signs the contract for you","zhDesc":"The freelancer booking link that signs the contract for you","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/1c10a81a-bcca-4ebd-804d-68377b230048.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"The flow: send your Hardbook link, client picks dates from your Google Calendar, signs the contract, and — if you’ve switched deposits on — pays one, all in the same session. No app, no account on their end. Nothing moves forward without a signature, and the deposit goes to your own Stripe account, not mine.","zhDetail":"Hardbook 是一款面向自由职业者和小型服务商的在线签约与收款工具。它让客户无需注册或下载应用，就能直接通过你发送的链接查看你的 Google Calendar 空闲时间、选择日期、签署合同，并在开启定金功能时完成付款——所有流程在同一个会话中完成。只有客户签字后流程才会推进，定金直接进入你自己的 Stripe 账户，无需经过平台。"},{"rank":6,"name":"Ycode AI Agents","zhName":"Ycode AI Agents","url":"https://www.producthunt.com/products/ycode","desc":"Build websites with AI","zhDesc":"Build websites with AI","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/de055381-4c88-4ce2-835e-3d2e2674846d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Connect Claude, OpenAI, Gemini or Grok to Ycode and use your preferred AI directly inside the website builder. Describe what you want to change, and the agent can update designs, manage CMS content, and build or improve components for you","zhDetail":"Ycode AI Agents 面向使用无代码网站构建器的用户，让你直接在 Ycode 中接入 Claude、OpenAI、Gemini 或 Grok 等 AI 模型。只需描述你想要修改的内容，AI 代理就能自动更新设计、管理 CMS 内容，并帮你创建或优化网站组件。"},{"rank":7,"name":"EasyCircuit","zhName":"EasyCircuit","url":"https://www.producthunt.com/products/easycircuit","desc":"Hardware prototyping, as simple as vibe-coding","zhDesc":"Hardware prototyping, as simple as vibe-coding","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/45c0c875-1c01-4cc0-b55c-526e0c935b8d.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"One thing from the factory side that might shape it: when a Chinese factory quotes, they usually already have a preferred equivalent for half your BOM, and they will quietly use it unless the line says otherwise. So the useful field isn't just \"acceptable substitutes\", it's which parameter must not move. Capacitance can drift a bit, voltage rating usually can't, that sort of thing.","zhDetail":"EasyCircuit 是一款面向电子工程师和硬件创业者的智能BOM（物料清单）管理工具，帮助用户在与工厂沟通时避免因元件替换导致的设计偏差。它通过标记关键参数（如电压额定值不可变动、电容值可小幅浮动等），让用户清晰指定哪些参数必须严格保留，从而确保工厂在替换元件时不会影响电路性能。"},{"rank":8,"name":"Jotform Website Widgets","zhName":"Jotform Website Widgets","url":"https://www.producthunt.com/products/jotform","desc":"Build and embed no-code website widgets in minutes","zhDesc":"Build and embed no-code website widgets in minutes","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/0ffaad9c-66c1-4b9c-97b1-94ca33837e53.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Upgrade your website with customizable no-code widgets. Create interactive experiences with reviews, booking, chat, popups, countdowns, FAQs, media galleries, announcements, and much more, then personalize every widget and embed it on any website in minutes.","zhDetail":"Jotform Website Widgets 是一款面向网站所有者和运营者的无代码工具，帮助用户快速为网站添加评论、预约、聊天、弹窗、倒计时、常见问题、媒体画廊、公告等交互式组件。无需编程知识，即可在几分钟内自定义每个组件的外观与功能，并将其嵌入任何网站，从而提升用户体验与网站互动性。"},{"rank":9,"name":"Firstpass","zhName":"Firstpass","url":"https://www.producthunt.com/products/glaze-4","desc":"Actionable input so you nail every launch","zhDesc":"Actionable input so you nail every launch","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/d767c091-9920-4ab3-9d07-3df3897d7386.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"If you've ever shipped a launch and watched your copy get truncated, ignored, or misread &cs=strip&fit=crop&frame=1&h=48&w=48","detail":"EQK is the first Mac app with dynamic AI EQ - an equalizer that re-tunes itself per song in real time. Give every app its own EQ, headphone correction, and output device. No virtual drivers - just native macOS audio capture. 10-band parametric Tone Desk, 3,985+ AutoEq headphone profiles, per-app limiter, full signal-chain metering, and a free built-in FLAC player with synced lyrics for the songs that you own. 100% local, no telemetry, no subscription. Tune every app on your Mac.","zhDetail":"EQK 是首款为 Mac 用户打造的动态 AI 均衡器应用，能根据每首歌曲实时自动调整音效。它让用户为每个应用单独设置 EQ、耳机校正和输出设备，无需虚拟驱动即可原生捕获 macOS 音频。内置 10 段参数均衡器、3985+ 种 AutoEq 耳机配置文件、逐应用限制器、完整信号链计量，以及免费的内置 FLAC 播放器（支持同步歌词），所有处理均在本地完成，无数据上报、无订阅。"},{"rank":2,"name":"AgentQuartz","zhName":"AgentQuartz","url":"https://www.producthunt.com/products/agentquartz","desc":"Claude & Cursor usage in your macOS menu bar","zhDesc":"Claude & Cursor usage in your macOS menu bar","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/86629c28-7b08-4c7d-b5a7-7301488d9d8b.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"since this is unofficial and there's no cloud account, I'm guessing it's reading local session/config files or an undocumented local endpoint rather than a published usage API from Anthropic or Cursor. if that's the case, what happens when either of them ships an update that moves or restructures where that data lives - does the tray just go blank, show stale numbers, or is there some way it'd tell you it's out of sync","zhDetail":"AgentQuartz 是一款面向 AI 工具重度用户的本地用量监控工具，帮助开发者实时追踪 Anthropic 或 Cursor 等平台的 API 调用与配置使用情况。它通过读取本地会话或配置文件中的未公开数据，在系统托盘直观展示用量统计，无需依赖官方云账户。"},{"rank":3,"name":"Epilude","zhName":"Epilude","url":"https://www.producthunt.com/products/epilude","desc":"Local voice dictation for Mac for polished text","zhDesc":"Local voice dictation for Mac for polished text","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/d8985b1b-a0e1-4cef-8b35-d3ffd214db83.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"\"trim the rambling\" is the phrase that catches me, since that's not just punctuation cleanup, that's deciding what you didn't mean to say. for casual notes that's exactly what I'd want, but if I'm dictating something with a number, a caveat, or a qualifier in the middle of a rambly sentence, trimming risks cutting the part that mattered along with the filler. is there a way to see what got trimmed before it lands in the app, or does it commit straight to the final text with no diff to check against","zhDetail":"Epilude 是一款面向日常笔记和语音记录用户的智能文本精简工具，帮助你在冗长的口述内容中自动识别并删除无意义的填充词和冗余表达，同时保留关键信息（如数字、限定条件等）。它通过智能算法判断哪些部分可以安全修剪，避免误删重要内容，让最终文本更简洁、精准。"},{"rank":4,"name":"Task Monki","zhName":"Task Monki","url":"https://www.producthunt.com/products/task-monki","desc":"Run coding agents through the full development process","zhDesc":"Run coding agents through the full development process","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/9b608328-f855-4b13-b9ef-1a02821fc16f.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Task Monki is an open-source desktop app for managing coding agents from task to pull request. Run several tasks at once, follow each agent’s progress, preview every result without manually setting up services or containers, send work to another agent for review and fixes, and bring multiple agents into the same discussion, where they can respond to each other, compare approaches, and challenge assumptions.","zhDetail":"Task Monki 是一款面向开发者的开源桌面应用，帮助用户高效管理多个编码代理从任务到拉取请求的全流程。它支持同时运行多个任务、实时追踪每个代理的进度并预览结果，无需手动配置服务或容器；还能让代理之间相互审查代码、修复问题，甚至在同一讨论中比较方案、挑战假设，从而提升协作开发效率。"},{"rank":5,"name":"Prelint","zhName":"Prelint","url":"https://www.producthunt.com/products/prelint","desc":"Prevent product drift in AI-written code","zhDesc":"Prevent product drift in AI-written code","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/2e85ae4d-5d7d-4547-9839-4c8fb5e5e29a.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Prelint catches these decisions before they ship. It reads each change alongside your specifications, tickets and existing product context, then explains what the agent decided, what the consequences are and how difficult the choice will be to reverse. Your team can approve, correct or replace the decision, and Prelint carries that context into the next piece of work.","zhDetail":"Prelint 是一款面向开发团队和产品经理的代码审查辅助工具，能在 AI 生成的变更上线前自动捕捉潜在决策问题。它通过对比每次代码改动与产品规格、任务单及现有上下文，清晰解释 AI 代理的决策内容、潜在影响以及回退难度，帮助团队快速批准、修正或替换决策，并将这些上下文无缝带入后续工作中。"},{"rank":6,"name":"Denovo","zhName":"Denovo","url":"https://www.producthunt.com/products/denovo-business-manager","desc":"Turn your vibe-coded app into paying customers","zhDesc":"Turn your vibe-coded app into paying customers","tags":[],"upvotes":null,"icon":null,"detail":"Congrats on the launch Saverio. The honest bit about previous startups failing on go-to-market makes this more interesting than the usual “build anything with AI” pitch. Denovo is taking on a lot though. Idea validation, branding, websites, payments, ads, lead generation, reporting. I’d want to know where the system is genuinely making decisions and where it is mainly automating setup. The green, yellow, red verdict also caught my attention. Has Denovo ever told a founder not to build something, and what evidence does it use to make that call? That could be one of the most valuable parts if it is willing to be blunt.","zhDetail":"Denovo 是一款面向创业者的全流程产品启动助手，帮助解决从创意验证、品牌建设、网站搭建到支付、广告、线索生成和报告分析的复杂难题。它通过自动化设置与智能决策相结合的方式，为用户提供“绿灯、黄灯、红灯”式的明确判断，甚至敢于直言建议创始人放弃某个项目，从而降低试错成本。"},{"rank":7,"name":"Totem","zhName":"Totem","url":"https://www.producthunt.com/products/totem-5","desc":"Your Twitter bookmarks organized to make you read them","zhDesc":"Your Twitter bookmarks organized to make you read them","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/448a6b86-4bb2-4fca-9324-e2ad6b925bef.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"You bookmark great threads on X and never see them again. Totem turns your new tab into a distraction-free environment for those bookmarks, the way you'd read on Substack. Open a thread full-width, highlight what matters, search everything, export etc.","zhDetail":"Totem 是一款专为 X（原 Twitter）用户设计的书签管理工具，解决你收藏的优质推文被遗忘、难以回顾的问题。它把你的浏览器新标签页变成一个无干扰的阅读空间，像在 Substack 上一样沉浸式浏览推文，支持全屏阅读、高亮重点、全局搜索和导出等功能。"},{"rank":8,"name":"JusTTY","zhName":"JusTTY","url":"https://www.producthunt.com/products/justty","desc":"A simple native macOS terminal built on Swift and libghostty","zhDesc":"A simple native macOS terminal built on Swift and libghostty","tags":[],"upvotes":null,"icon":null,"detail":"Native macOS apps built with libghostty are exactly what I've been hoping someone would ship. One thing that would make me switch from iTerm2 full time: support for per-pane scrollback buffers with the ability to detach a pane into its own window. Would be great for keeping long-running logs handy while working in another session.","zhDetail":"JusTTY 是一款面向 macOS 用户的原生终端应用，基于 libghostty 构建，旨在解决 iTerm2 等传统终端中无法独立管理每个窗格滚动缓冲区的问题。它支持将任意窗格分离为独立窗口，方便用户在处理其他会话时随时查看长时间运行的日志输出，从而提升多任务场景下的工作效率。"},{"rank":9,"name":"ClinicFrame","zhName":"ClinicFrame","url":"https://www.producthunt.com/products/clinic-scribe-clinicframe","desc":"Like Granola, but for healthcare. Fully HIPAA-compliant.","zhDesc":"Like Granola, but for healthcare. Fully HIPAA-compliant.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/633bd8a1-8e3c-449f-acec-88372c665558.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"I'm not in healthcare, but the idea really got me. Really, congrats on the execution. The line about clinicians writing every note twice gets to the real problem. The transcription is useful, but cutting out that second round of admin is where the value is. I’d be interested in how ClinicFrame handles situations where the conversation is incomplete, contradictory, or clinically sensitive. Does it clearly flag uncertainty and missing details, or can a polished note make the output look more certain than the visit actually was? Keeping the clinician as the author is the right approach. The review step needs to be genuinely quick without encouraging people to skim.","zhDetail":"ClinicFrame 是一款面向临床医生的智能笔记工具，旨在解决医生重复书写病历的痛点。它通过自动转录医患对话并精简二次行政录入环节，帮助医生快速生成清晰、准确的临床记录，同时保留医生对最终内容的审核与修改权。"},{"rank":10,"name":"Bo AI","zhName":"Bo AI","url":"https://www.producthunt.com/products/bo-ai","desc":"An AI personal assistant that lives in your texts 💬","zhDesc":"An AI personal assistant that lives in your texts 💬","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/bf7e6ff3-68de-462c-855f-ad6028363761.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Bo is the first consumer AI product that exists to serve everyday people. Bo helps you stay organized, save time, live healthier, and answer your questions—all via text.","zhDetail":"Bo AI 是首款面向普通消费者的AI产品，旨在通过短信对话帮助用户保持生活有序、节省时间、更健康地生活，并随时解答各类问题。无需下载复杂应用，只需发消息即可获得日常事务管理、健康建议与信息查询等贴心服务。"},{"rank":11,"name":"Vela","zhName":"Vela","url":"https://www.producthunt.com/products/vela-4","desc":"The AI Recruiting Coordinator","zhDesc":"The AI Recruiting Coordinator","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/a0fb980b-df99-4165-8e1b-9171efa8c0b5.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","zhDetail":"Vela 是一款面向招聘团队的 AI 协调助手，帮助招聘人员自动处理面试安排、候选人沟通等繁琐事务，从而将更多时间聚焦在人才评估与决策上。"},{"rank":12,"name":"SceneNote","zhName":"SceneNote","url":"https://www.producthunt.com/products/scenenote-free-video-feedback-tool","desc":"Free video feedback tool for editors & clients","zhDesc":"Free video feedback tool for editors & clients","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/57fc5424-163d-41c5-b9a3-d08741390c7b.png? let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
