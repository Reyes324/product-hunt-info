<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH 热门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6154'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='19' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --border:#E8E4DC;
  --accent:#FF6154;
  --accent-soft:rgba(255,97,84,0.08);
  --text:#1C1917;
  --text-2:#6B6560;
  --text-3:#B5AFA8;
  --tag-bg:#EDE9E3;
  --tag-text:#57534E;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.09),0 2px 6px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 12px rgba(0,0,0,0.06);
  --sidebar-w:460px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh;transition:padding-right .35s cubic-bezier(.4,0,.2,1)}
.app.panel-open{padding-right:var(--sidebar-w)}
.main{flex:1;max-width:740px;margin:0 auto;padding:0 28px 80px}

header{padding:36px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.ph-mark{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(255,97,84,.35)}
h1{font-size:21px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.header-sub{display:flex;align-items:center;gap:10px;margin-top:8px}
.badge{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}
.updated{font-size:12px;color:var(--text-3)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Segmented tabs */
.tab-bar{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.tab{flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--text-3);cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,97,84,.4)}
.tab:hover:not(.active){color:var(--text-2);background:var(--surface-2)}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rank{width:20px;font-size:12px;font-weight:800;color:var(--text-3);text-align:center;padding-top:3px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.gold{color:#D97706}.rank.silver{color:#9CA3AF}.rank.bronze{color:#B45309}
.icon{width:46px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.name-zh{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:1px;color:var(--text)}
.name-en{font-size:11px;color:var(--text-3);margin-bottom:6px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:9px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--tag-bg);color:var(--tag-text);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.1px}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:36px}
.vote-box{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.card:hover .vote-box{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vote-count{font-size:11px;font-weight:700;color:var(--text-2)}
.ext-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.ext-btn:hover{background:var(--surface-2);color:var(--accent)}

/* Sidebar */
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;overflow:hidden}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)}
.sb-head-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.icon-btn{width:30px;height:30px;background:none;border:none;color:var(--text-3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text-2)}
.sb-body{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:65vh}
.sb-product-row{display:flex;gap:14px;margin-bottom:14px}
.sb-icon{width:56px;height:56px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.sb-icon img{width:100%;height:100%;object-fit:cover;display:block}
.sb-name-zh{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:3px;color:var(--text)}
.sb-name-en{font-size:11px;color:var(--text-3);margin-bottom:8px}
.sb-desc{font-size:13px;color:var(--text-2);line-height:1.65}
.sb-stats{display:flex;gap:14px;margin:12px 0}
.sb-stat{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sb-stat strong{color:var(--accent)}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sb-btn{display:block;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-align:center;transition:opacity .15s;box-shadow:0 2px 8px rgba(255,97,84,.3)}
.sb-btn:hover{opacity:.9}
.sb-btn-sec{display:block;padding:10px 18px;border:1.5px solid var(--border);color:var(--text-2);border-radius:10px;font-size:13px;font-weight:500;text-align:center;margin-top:8px;cursor:pointer;background:none;width:100%;transition:.15s}
.sb-btn-sec:hover{border-color:var(--text-3);color:var(--text)}
.sb-iframe-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.sb-iframe{width:100%;height:100%;border:none;flex:1;display:none;background:#fff}
.sb-no-preview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;padding:32px}

.regen-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.regen-overlay.open{display:flex}
.regen-modal{background:var(--surface);border-radius:14px;padding:20px;width:400px;max-width:100%;box-shadow:var(--shadow-lg)}
.regen-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.regen-hint{font-size:12px;color:var(--text-3);line-height:1.5;margin-bottom:12px}
.regen-hint code{background:var(--tag-bg);padding:1px 5px;border-radius:4px}
.regen-modal input[type=password]{width:100%;padding:10px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;margin-bottom:10px;background:var(--surface-2);color:var(--text)}
.regen-log{background:#111;color:#0f0;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:20px;max-height:260px;overflow-y:auto;margin-top:12px}
.regen-log:empty{padding:0;margin-top:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

@media(max-width:640px){
  :root{--sidebar-w:100vw}
  .main{padding:0 16px 60px}
  .app.panel-open{padding-right:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <header>
      <div class="header-row">
        <div class="brand">
          <div class="ph-mark">P</div>
          <h1>Product Hunt 热门</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="openRegenModal()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
            重新生成
          </button>
          <button class="refresh-btn" onclick="window.location.reload()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            刷新
          </button>
        </div>
      </div>
      <div class="header-sub">
        <span class="badge" id="period-badge">📅 2026年8月2日</span>
        <span class="updated">更新于 11:29</span>
      </div>
    </header>

    <div class="tab-bar">
      <div class="tab active" id="tab-yesterday" onclick="switchTab('yesterday')">昨日榜单</div>
      <div class="tab" id="tab-today" onclick="switchTab('today')">今日上线</div>
      <div class="tab" id="tab-weekly" onclick="switchTab('weekly')">周榜单</div>
      <div class="tab" id="tab-monthly" onclick="switchTab('monthly')">月度榜单</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="sb-head-title" id="sb-title">产品详情</span>
    <button class="icon-btn" onclick="openNewTab()" title="新标签页打开">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
    <button class="icon-btn" onclick="closeSidebar()" title="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sb-body" id="sb-body"></div>
  <div class="sb-iframe-wrap">
    <iframe class="sb-iframe" id="sb-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="sb-no-preview" id="sb-no-preview">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>该页面不支持内嵌预览</span>
    </div>
  </div>
</div>

<div class="regen-overlay" id="regenOverlay">
  <div class="regen-modal">
    <div class="regen-head">
      <span>重新生成榜单</span>
      <button class="icon-btn" onclick="closeRegenModal()" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="regen-hint" id="regenHint">Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。</p>
    <input type="password" id="regenKey" placeholder="DEEPSEEK_API_KEY（可留空）" autocomplete="off">
    <button class="sb-btn" id="regenStart" onclick="runRegen()" style="width:100%;border:none;cursor:pointer">开始生成</button>
    <pre class="regen-log" id="regenLog"></pre>
  </div>
</div>

<script>
const DATA = {"date":"2026-08-03","updatedAt":"11:29","yesterday":[],"today":[{"rank":1,"name":"1. AgentSky","zhName":"AgentSky","url":"https://www.producthunt.com/products/agentsky","desc":"Any harness, any LLM — cloud-hosted agents on demand.","zhDesc":"Any harness, any LLM — cloud-hosted agents on demand.","tags":[],"upvotes":null,"icon":null,"detail":"From outside, a suspended agent, a finished agent, and one that crashed and never resumed all present the same way. No activity, no cost, nothing in the channel. So what tells the operator which of the three they have? What I would want is for a long horizon agent to declare an expected cadence when it launches, so the platform can say this one should have woken by now and has not, instead of leaving silence to mean whatever the reader assumes it means.","zhDetail":"AgentSky 面向运维与开发人员，解决长时间运行的 AI 智能体“静默失联”难以区分的问题——无论是正常挂起、已完成还是崩溃，表面都毫无动静。它通过让智能体在启动时声明预期唤醒节奏，平台据此主动检测“该醒未醒”的异常状态，将沉默转化为可判断的信号，避免误读与漏报。"},{"rank":2,"name":"5. Appllama","zhName":"Appllama","url":"https://www.producthunt.com/products/appllama","desc":"Study 25,000+ screens from top-earning iOS apps","zhDesc":"Study 25,000+ screens from top-earning iOS apps","tags":[],"upvotes":null,"icon":null,"detail":"Appllama is a design-research platform for app creators. Search 25,000+ screens from 600+ of the App Store’s top-earning iOS apps; follow complete onboarding, paywall, home and in-app flows; inspect UI elements, colors and fonts; and see revenue, downloads and ratings in context. New apps arrive weekly, captured live from the store. Start free no card required.","zhDetail":"Appllama 是一款面向应用创作者的设计研究平台。你可以搜索来自 600 多款 App Store 高收入 iOS 应用中的 25,000+ 个屏幕截图，追踪完整的引导、付费墙、首页及应用内流程，并查看 UI 元素、配色和字体，同时结合收入、下载量与评分等背景数据进行分析。平台每周从商店实时抓取新应用，免费开始使用，无需绑定信用卡。"},{"rank":3,"name":"7. Snapdown","zhName":"Snapdown","url":"https://www.producthunt.com/products/snapdown-2","desc":"Turn anything on your Mac screen into clean Markdown","zhDesc":"Turn anything on your Mac screen into clean Markdown","tags":[],"upvotes":null,"icon":null,"detail":"The structure-preserving part is the bit that matters. I deal with a lot of scanned compliance documents, certificates, permits, inspection reports and every OCR tool I've tried turns a table of expiry dates into a paragraph of numbers with no way to tell which date belongs to which row.","zhDetail":"Snapdown 专为处理扫描版合规文件（如证书、许可证、检查报告）的用户设计，解决传统 OCR 工具破坏表格结构、导致数据错乱的问题。它通过保留原始文档的表格布局，确保每个日期、编号等关键信息准确对应所属行列，让用户无需手动重新整理即可直接使用提取的数据。"},{"rank":4,"name":"8. yapyap","zhName":"yapyap","url":"https://www.producthunt.com/products/yapyap-3","desc":"Own your voice again. Local-first voice & meeting recorder.","zhDesc":"Own your voice again. Local-first voice & meeting recorder.","tags":[],"upvotes":null,"icon":null,"detail":"Every meeting recorder ships your audio to the cloud and bills you monthly. yapyap does neither. It records, transcribes, names your speakers, and turns talk into summaries and action items entirely on your own machine. “Lenses” reshape each recording into whatever you need: a summary, a to-do list, or a decision log. You can install more or build your own. Prefer the cloud? Optionally connect any major provider: OpenAI, Anthropic, Groq. Either way, yapyap is yours forever. No subscription.","zhDetail":"yapyap 是一款完全本地运行的会议记录工具，专为注重隐私、不想为云端录音功能按月付费的用户设计。它能在你的设备上完成录音、转写、说话人识别，并自动生成摘要和待办事项，无需上传任何音频。通过可扩展的“Lenses”功能，你可以将每次会议灵活转化为总结、任务清单或决策记录，并可选接入 OpenAI 等云端服务，但绝不强制订阅。"},{"rank":5,"name":"9. claudemon","zhName":"claudemon","url":"https://www.producthunt.com/products/claudemon","desc":"Wild Pokémon appear while you wait for Claude Code","zhDesc":"Wild Pokémon appear while you wait for Claude Code","tags":[],"upvotes":null,"icon":null,"detail":"Hi PH 👋 Half my day in Claude Code is watching it work. Not long enough to switch tasks, too long to just sit there. claudemon lives in that gap. It's a Pokémon game that only advances while Claude does. Your prompts are steps through the grass; every twenty seconds Claude works is another step. Something jumps out, the status line tells you, you fight it in a second terminal tab. OpenSource, Free, MIT, fully local.","zhDetail":"claudemon 是一款专为 Claude Code 用户打造的趣味效率工具，将等待 AI 编码的碎片时间变成一场宝可梦式冒险。它在你使用 Claude 工作时自动推进游戏进度，每 20 秒工作即走一步，遇到野生精灵可在第二终端标签页即时对战。完全开源、免费且本地运行，让等待不再无聊。"},{"rank":6,"name":"10. MascotAI","zhName":"MascotAI","url":"https://www.producthunt.com/products/mascotai","desc":"Animated SVG mascot studios for apps that need a personality","zhDesc":"Animated SVG mascot studios for apps that need a personality","tags":[],"upvotes":null,"icon":null,"detail":"The gestures worth shipping aren't the happy ones. Empty state, loading, and error are the three moments an app actually needs a face, because that's when it's failing the user and the mascot is the only thing buying patience. Everyone builds wave and thumbs up first, then ships a plain grey spinner anyway. And agreed with Christoph on the paywall. A mascot is a taste purchase and you can't sell taste off someone else's sample character.","zhDetail":"MascotAI 面向应用开发者与产品设计师，专注于在空状态、加载和错误提示这三个用户最易流失的瞬间，用定制化吉祥物表情替代单调的灰色加载动画，以趣味和温度缓解用户等待时的焦虑与挫败感。它提供可灵活定制的吉祥物生成方案，让团队无需从零设计，即可快速为每个关键交互节点配上贴合品牌调性的“表情”，从而提升产品体验的完整度与亲和力。"},{"rank":7,"name":"12. mpai","zhName":"mpai","url":"https://www.producthunt.com/products/mpai","desc":"Make existing Codex and Claude Code sessions multiplayer","zhDesc":"Make existing Codex and Claude Code sessions multiplayer","tags":[],"upvotes":null,"icon":null,"detail":"Yes—if you mean mpai, it is MIT-licensed, so commercial use is allowed. For a client environment today, I’d run it only on a client-owned Mac and tailnet the client controls, have them explicitly invite you and share the exact session, and start with a non-sensitive pilot. The host keeps execution authority; mpai exposes no arbitrary shell and cannot bypass approvals. It is still a macOS public alpha, not an enterprise SLA product yet. If you test it, I’d love your install-to-first-room time and where the flow breaks.","zhDetail":"mpai 是一款面向 macOS 用户的 AI 助手工具，采用 MIT 开源许可，允许商业使用。它通过客户端控制的 Mac 和 tailnet 网络运行，确保主机保留执行权限，不暴露任意 shell 且无法绕过审批，从而在安全可控的环境中提供 AI 辅助功能。目前仍处于公开测试阶段，适合希望在受控环境下试用 AI 协作能力的用户。"},{"rank":8,"name":"Wispr Flow: Dictation That Works Everywhere","zhName":"Wispr Flow","url":"https://www.producthunt.com/products/wisprflow","desc":"Stop typing. Start speaking. 4x faster.","zhDesc":"Stop typing. Start speaking. 4x faster.","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/08e81e1c-a2f8-466b-9603-8d2a6ae3a751.png?auto=compress,format&codec=mozjpeg&cs=strip&fit=max&frame=1&h=178&w=888","detail":"Wispr Flow turns your voice into perfectly formatted text across every app on your device. Speak naturally and Flow handles the rest: real-time auto-edits, tone matching, and context-aware formatting so you never rewrite a single word. Works in 100+ languages including mixed-language dictation like Hinglish. Available on Mac, Windows, iPhone, and Android. One intelligent voice system, every device. Write 4x faster by just talking.","zhDetail":"Wispr Flow 是一款跨平台语音输入工具，专为需要高效写作的用户设计。它能在你设备上的任何应用中，将语音实时转换为格式完美的文本，并自动进行编辑、匹配语气和根据上下文调整格式，让你无需再手动修改一个字。支持100多种语言及混合语言听写（如Hinglish），覆盖Mac、Windows、iPhone和Android，帮助用户仅通过说话即可将写作速度提升4倍。"},{"rank":9,"name":"15. Doxy","zhName":"Doxy","url":"https://www.producthunt.com/products/doxy-2","desc":"Markdown & HTML editor, without the LaTeX pain","zhDesc":"Markdown & HTML editor, without the LaTeX pain","tags":[],"upvotes":null,"icon":null,"detail":"Hey PH! 👋 I'm ilies, the builder of Doxy. The idea came from using Overleaf during uni , I loved the workflow but always wished I could just write in markdown instead of LaTeX. So I built it. Happy to answer anything. What would make you actually switch your writing workflow to Doxy?","zhDetail":"Doxy 是一款面向学术写作者的在线文档工具，专为喜欢 Markdown 简洁语法、又需要 LaTeX 级排版效果的用户设计。它让你无需学习 LaTeX 即可轻松撰写论文、报告等学术文档，同时保留熟悉的写作流程，帮助你在更短的时间内完成高质量排版。"},{"rank":10,"name":"16. Murmell","zhName":"Murmell","url":"https://www.producthunt.com/products/murmell","desc":"Cloud canvas where your team and AI agents works together","zhDesc":"Cloud canvas where your team and AI agents works together","tags":[],"upvotes":null,"icon":null,"detail":"Murmell is a shared cloud canvas where your team and AI agents work in the same room, on the same repo, with a preview and more coming in the future. Close your laptop and the work keeps going. Agents claim files before they write, so people and agents can move at once without overwriting each other. Run Claude Code, Codex, Kimi, and OpenCode together today, with more agents on the way (OpenClaw, Hermes, and more), and your work lands back in git, so you can always find your projects there.","zhDetail":"Murmell 是一个共享云端画布，让团队和 AI 代理在同一仓库中协同工作，并实时预览。即使你合上电脑，工作也会继续；代理在写入前会“认领”文件，避免互相覆盖，从而支持人与 AI 并行推进。目前可同时运行 Claude Code、Codex、Kimi 和 OpenCode 等代理，所有成果自动同步回 git，方便随时查找项目。"},{"rank":11,"name":"18. MacDupl","zhName":"MacDupl","url":"https://www.producthunt.com/products/macdupl-run-every-acc-in-its-own-app","desc":"Clone any Mac app into a fully isolated instance","zhDesc":"Clone any Mac app into a fully isolated instance","tags":[],"upvotes":null,"icon":null,"detail":"Early on I looked at container/VM-based isolation to sandbox apps more heavily — more \"bulletproof\" in theory, but it added real complexity and UX tradeoffs that worked against the whole point (this was supposed to feel instant, not heavy). I ended up going with a lighter approach: unique bundle identifiers plus separate data directories per clone, using `--use-mock-keychain` so credentials stay isolated without ever touching the shared macOS Keychain. It's simpler, and it's fast — clones build in about 2 seconds.","zhDetail":"MacDupl 是一款面向 Mac 用户的轻量级应用分身工具，让你无需复杂容器或虚拟机，即可快速创建同一应用的多个独立副本。它通过为每个克隆分配独立的 bundle 标识和数据目录，并隔离钥匙串凭据，在约 2 秒内完成克隆，既保护隐私又保持系统流畅，适合需要多账号登录或测试不同配置的用户。"},{"rank":12,"name":"Lightfield","zhName":"Lightfield","url":"https://www.producthunt.com/products/lightfield","desc":"AI-native CRM that builds itself and does work for you","zhDesc":"AI-native CRM that builds itself and does work for you","tags":[],"upvotes":null,"icon":"https://ph-files.imgix.net/e31fc558-30e0-48e2-921a-0199328f3f02.x-icon?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&frame=1&h=48&w=48","detail":"Lightfield reads your emails, meetings, and calls to build your CRM automatically. No manual data entry — ever. Connect your inbox, upload a spreadsheet or CSV from your old CRM, and everything is recreated in less than five minutes. Ask it anything in plain English: who needs follow-up, what objections keep coming up, how has our ICP shifted — answered from your actual conversations. Then put it to work to draft follow-ups, create board decks, build proposals, and more.","zhDetail":"Lightfield 是一款面向销售团队的智能 CRM 自动化工具，能自动读取你的邮件、会议和通话记录，无需手动录入即可构建客户关系数据库。只需连接邮箱或上传旧 CRM 的 CSV 文件，五分钟内即可完成数据迁移，并支持用自然语言提问（如“谁需要跟进”“客户常提哪些异议”），还能自动生成跟进邮件、董事会演示文稿和提案，大幅提升销售效率。"},{"rank":13,"name":"20. CoachAI","zhName":"CoachAI","url":"https://www.producthunt.com/products/coachai-fitness-coach","desc":"Your iPhone camera watches your form, rep by rep","zhDesc":"Your iPhone camera watches your form, rep by rep","tags":[],"upvotes":null,"icon":null,"detail":"CoachAI uses your phone's camera to count your reps and correct your form in real time - a personal trainer's eyes in your pocket.","zhDetail":"CoachAI 是一款利用手机摄像头实时计数动作次数并纠正训练姿势的AI健身助手，相当于把私人教练的眼睛装进口袋。它面向居家或健身房锻炼者，无需额外设备即可获得即时动作反馈，帮助用户更安全、高效地完成训练。"},{"rank":14,"name":"21. Open Minis","zhName":"Open Minis","url":"https://www.producthunt.com/products/open-minis","desc":"An on-device AI Agent that runs on your phone, open & secure","zhDesc":"An on-device AI Agent that runs on your phone, open & secure","tags":[],"upvotes":null,"icon":null,"detail":"Open Minis is a free, open-source AI agent for iOS and Android that does more than chat — it gives the model a real computer to work with. A sandboxed Alpine Linux shell runs on your device: it installs packages, runs Python, edits real files and drives a browser. Around it, 30+ native bridges reach HealthKit, HomeKit, Calendar, Photos. etc. Bring your own model — Claude, GPT, Gemini, Kimi, Grok, or any OpenAI-compatible endpoint. Keys and data never leave your phone. Free and Open Source.","zhDetail":"Open Minis 是一款免费开源的移动端 AI 代理，为 iOS 和 Android 用户提供超越聊天的真实计算能力。它通过在设备上运行沙盒化的 Alpine Linux 环境，让 AI 能安装软件、执行 Python 脚本、编辑文件并操控浏览器，同时内置 30 多个原生桥接模块，可访问健康、家居、日历和照片等数据。支持自带 Claude、GPT 等任意模型密钥，且所有数据与密钥均不出手机，兼顾功能与隐私。"},{"rank":15,"name":"1. Zinley","zhName":"Zinley","url":"https://www.producthunt.com/products/zinley","desc":"Your Personal AI Representative for calls, email, and tasks","zhDesc":"Your Personal AI Representative for calls, email, and tasks","tags":[],"upvotes":null,"icon":null,"detail":"Most AI waits inside a chat. Zinley is reachable by you and the people around you. With its own phone number and email, it answers calls, handles email, books things, and gets work done within your rules. It remembers your people and relationships, then reports back in your language. Not another chatbot. A second you that shows up.","zhDetail":"Zinley 是一款拥有独立电话号码和邮箱的 AI 助手，能接听电话、处理邮件、预订事务并执行任务，同时遵循你的规则。它适合希望 AI 主动融入日常生活的个人或小团队，无需打开聊天窗口即可随时调用。Zinley 还能记住你的人际关系，用你的语言汇报结果，成为真正替你“出面”的第二分身。"},{"rank":16,"name":"2. Capptivo","zhName":"Capptivo","url":"https://www.producthunt.com/products/capptivo","desc":"Free open-source screen recorder & demo editor","zhDesc":"Free open-source screen recorder & demo editor","tags":[],"upvotes":null,"icon":null,"detail":"This website uses a security service to protect against malicious bots. This page is displayed while the website verifies you are not a bot.","zhDetail":"Capptivo 是一款面向内容创作者和营销团队的工具，帮助他们在网站或落地页上快速收集访客的邮箱和联系方式，解决因访客流失而错失潜在客户的问题。它通过可自定义的弹窗和表单，在访客离开前捕捉其意向，并支持与主流邮件营销平台无缝集成，从而提升线索转化率。"},{"rank":17,"name":"4. Lumichats","zhName":"Lumichats","url":"https://www.producthunt.com/products/lumichats-offline","desc":"A Clau let activeTab = 'yesterday';
let activeUrl = null;

const TAB_IDS = ['yesterday', 'today', 'weekly', 'monthly'];

function switchTab(tab) {
  activeTab = tab;
  TAB_IDS.forEach(id => document.getElementById('tab-' + id).classList.toggle('active', id === tab));
  document.getElementById('period-badge').textContent = '📅 ' + DATA.periods[tab];
  closeSidebar();
  render();
}

function rankClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function render() {
  const products = DATA[activeTab] || [];
  const list = document.getElementById('list');
  if (!products?.length) {
    list.innerHTML = '<div style="padding:48px 0;text-align:center;color:#444;font-size:13px">暂无数据，请运行脚本更新</div>';
    return;
  }
  list.innerHTML = products.map((p, i) => `
    <div class="card" onclick="openSidebar(${i})">
      <div class="rank ${rankClass(i)}">${p.rank}</div>
      <div class="icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div class="body">
        <div class="name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="name-en">${p.name}</div>` : ''}
        <div class="desc">${p.zhDetail || p.desc}</div>
        <div class="meta">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="right">
        <div class="votes">
          <div class="vote-box">
            <svg width="9" height="8" viewBox="0 0 10 8" fill="currentColor"><path d="M5 0L10 8H0z"/></svg>
          </div>
          <span class="vote-count">${p.upvotes ?? '—'}</span>
        </div>
        <a class="ext-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()" title="在 PH 查看">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join('');
}

function openSidebar(i) {
  const p = (DATA[activeTab] || [])[i];
  activeUrl = p.url;
  document.getElementById('sb-title').textContent = p.zhName || p.name;
  document.getElementById('sb-body').innerHTML = `
    <div class="sb-product-row">
      <div class="sb-icon">${p.icon ? `<img src="${p.icon}" alt="" onerror="this.parentElement.innerHTML='🚀'">` : '🚀'}</div>
      <div style="min-width:0">
        <div class="sb-name-zh">${p.zhName || p.name}</div>
        ${p.zhName && p.zhName !== p.name ? `<div class="sb-name-en">${p.name}</div>` : ''}
        <div class="sb-desc">${p.zhDetail || p.desc}</div>
      </div>
    </div>
    ${p.upvotes ? `<div class="sb-stats"><div class="sb-stat">▲ <strong>${p.upvotes}</strong> 票</div></div>` : ''}
    <div class="sb-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <a class="sb-btn" href="${p.url}" target="_blank">在 Product Hunt 查看 →</a>
    <button class="sb-btn-sec" onclick="loadFrame()">尝试内嵌预览</button>
  `;
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-iframe').src = '';
  document.getElementById('sb-no-preview').style.display = 'none';
  document.getElementById('app').classList.add('panel-open');
  document.getElementById('sidebar').classList.add('open');
}

function loadFrame() {
  const frame = document.getElementById('sb-iframe');
  frame.style.display = 'block';
  frame.src = activeUrl;
  const t = setTimeout(showNoPreview, 5000);
  frame.onload = () => {
    clearTimeout(t);
    try { if (!frame.contentDocument?.body) showNoPreview(); } catch { showNoPreview(); }
  };
}

function showNoPreview() {
  document.getElementById('sb-iframe').style.display = 'none';
  document.getElementById('sb-no-preview').style.display = 'flex';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('app').classList.remove('panel-open');
  document.getElementById('sb-iframe').src = '';
  activeUrl = null;
}

function openNewTab() { if (activeUrl) window.open(activeUrl, '_blank'); }

const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

function openRegenModal() {
  const hint = document.getElementById('regenHint');
  const keyInput = document.getElementById('regenKey');
  const startBtn = document.getElementById('regenStart');
  if (IS_LOCAL) {
    hint.innerHTML = 'Key 只在浏览器和本地服务之间传递，不会被记录。留空则生成英文原文版本。需通过 <code>node server.mjs</code> 启动的本地服务访问此页面才能使用。';
    keyInput.style.display = 'block';
    startBtn.textContent = '开始生成';
  } else {
    hint.textContent = '将触发云端自动抓取最新榜单并翻译，无需输入任何内容，完成后（约 1-2 分钟）本页会自动刷新。';
    keyInput.style.display = 'none';
    startBtn.textContent = '触发更新';
  }
  document.getElementById('regenLog').textContent = '';
  document.getElementById('regenOverlay').classList.add('open');
}
function closeRegenModal() { document.getElementById('regenOverlay').classList.remove('open'); }

async function runRegen() {
  if (IS_LOCAL) return runRegenLocal();
  return runRegenRemote();
}

async function runRegenLocal() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '';
  const key = document.getElementById('regenKey').value;
  try {
    const res = await fetch('/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      log.textContent += decoder.decode(value);
      log.scrollTop = log.scrollHeight;
    }
    if (log.textContent.includes('✅ 已生成')) {
      log.textContent += '\n即将刷新页面…';
      setTimeout(() => window.location.reload(), 1200);
    }
  } catch (e) {
    log.textContent += '\n请求失败：请确认是通过 node server.mjs 启动的本地服务打开此页面（而不是直接双击 index.html）。';
  }
  btn.disabled = false;
}

async function runRegenRemote() {
  const btn = document.getElementById('regenStart');
  const log = document.getElementById('regenLog');
  btn.disabled = true;
  log.textContent = '正在触发云端更新…';
  try {
    const res = await fetch('/api/trigger', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log.textContent = '✅ 已触发，GitHub Actions 正在云端抓取最新数据（约 1-2 分钟），完成后页面会自动刷新。\n你也可以稍后手动刷新查看。';
    setTimeout(() => window.location.reload(), 100000);
  } catch (e) {
    log.textContent = '❌ 触发失败：' + e.message;
  }
  btn.disabled = false;
}

render();
</script>
